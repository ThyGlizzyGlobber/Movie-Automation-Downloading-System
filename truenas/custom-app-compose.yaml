# TrueNAS SCALE Custom App compose config for "movie-downloader" (Stage 5).
#
# Not applied via `docker compose` directly — pasted into the TrueNAS
# Custom App form (or submitted as `custom_compose_config_string` to the
# `app.create` / `app.update` middleware methods), which wraps it into its
# own `ix-movie-downloader` compose project with its own bridge network
# (frontend reaches the backend by service name, `backend:8000`, same as
# local Compose).
#
# This file is a reference copy, not the applied one. The live config is
# maintained by hand in the TrueNAS UI, and nothing in this repo can
# change it: `git pull` and `POST /api/admin/deploy` update the source
# the containers already mount, never the compose config TrueNAS holds.
# So treat this as the template you'd paste from when recreating the app
# — and expect to fill the paths in, rather than expecting them to be
# right.
#
# Every host path is therefore a <PLACEHOLDER>, deliberately: the real
# ones move (the media datasets have already moved pools once), and a
# stale absolute path committed here reads as fact while being wrong.
# The container-side paths are NOT placeholders — /repo, /app/data,
# /tv-library, /movie-library and /run/secrets/deploy_key are fixed by
# the app's own config and code, and changing one means changing that
# too. Fill in:
#   <REPO_PATH>           the deployed `git clone` of this repo on the NAS
#   <SECRETS_PATH>        holds the deploy key; outside the clone entirely
#   <APP_DATA_PATH>       persistent SQLite; survives recreation and pulls
#   <TV_LIBRARY_PATH>     the dataset qBittorrent's "tv" category saves to
#   <MOVIE_LIBRARY_PATH>  the same for "movies"
#
# TMDB_API_KEY: TrueNAS custom apps have no env_file support, so the real
# key value has to be inlined here when actually applying this config —
# same handling TrueNAS gives qBittorrent's own Wireguard key in this same
# custom-app system (stored root-only, 0600, under /mnt/.ix-apps/app_configs
# once applied). The placeholder below is what's committed to this
# gitignored-.env-respecting repo; the live NAS deployment has the real
# value from backend/.env substituted in at apply time, not committed here.
#
# GIT_SSH_KEY_PATH (Stage 6): the read-only GitHub deploy key, generated
# for this NAS specifically and never committed — lives at
# <SECRETS_PATH>/deploy_key (0600, root-only, outside the git-tracked
# repo entirely so `git pull` itself can never touch it), bind-mounted
# read-only into the backend container. Same
# "never in the git-tracked tree, never visible via `docker inspect`"
# handling as the confirmed architecture requires — `docker inspect` shows
# only the mount *path*, never the key's contents.

services:
  frontend:
    build:
      context: <REPO_PATH>/frontend
    ports:
      - "8095:80"
    # One directory-level bind mount, not per-file: a per-file bind mount
    # breaks after a write replaces a file via write-new+rename (the
    # container keeps the old inode) — confirmed live during Stage 5's
    # validation pass. A directory mount re-resolves paths on every
    # request, which is what "frontend picks it up on next request" in
    # the confirmed architecture actually requires.
    #
    # Frontend migration Part B: points at frontend/dist, not frontend/
    # itself — deploy.py's `POST /api/admin/deploy` regenerates this exact
    # host path (`npm run build` run against the same repo clone the
    # backend container already has mounted at /repo) after every `git
    # pull`, so this container's own image only matters at initial
    # creation; an update never needs it rebuilt or restarted, same
    # "picks it up on next request" property the pre-Vite single
    # index.html had. dist/ never contains a dotfile/.env/Dockerfile —
    # nginx.conf's own generic dotfile-deny rule is the (now largely
    # redundant, still cheap) defense-in-depth layer for that.
    #
    # The TMDB image cache (frontend/nginx.conf's `location ^~ /img/`) is
    # the one thing here that a `git pull` + deploy genuinely cannot
    # deliver: nginx.conf is COPYed into the image, not bind-mounted like
    # dist/ is, so changing it means recreating this container from a
    # rebuilt image — the single exception to "an update never needs it
    # rebuilt" above. The cache itself needs no configuration at all; it
    # falls back to the container's writable layer. The named volume below
    # only buys a cache that survives that recreation, and is capped at
    # 5g by nginx regardless of where it lands.
    volumes:
      - "<REPO_PATH>/frontend/dist:/usr/share/nginx/html"
      - "tmdb-cache:/var/cache/nginx/tmdb"
      # Read-only view of the backend's data path, so nginx can send the
      # trailer files rather than uvicorn streaming them through Python
      # while it is also answering the API. Same <APP_DATA_PATH> the
      # backend mounts at /app/data below; only ever read here.
      - "<APP_DATA_PATH>:/srv/backend-data:ro"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: <REPO_PATH>/backend
    environment:
      # Hand trailer files to nginx instead of streaming them out of
      # uvicorn — the app still authorises every request for one, then
      # names the file for the `internal` location in
      # frontend/nginx.conf. Needs the frontend's read-only mount of
      # this same data path, above. Unset, the app serves them itself.
      TRAILER_X_ACCEL_PREFIX: "/internal-trailers/"
      TMDB_API_KEY: "REPLACE_WITH_VALUE_FROM_backend/.env"
      QBIT_HOST: "192.168.0.133"
      QBIT_PORT: "30024"
      # Stage 6: where the self-update endpoint runs `git pull --ff-only`
      # and the deploy key it authenticates with — see app/deploy.py.
      DEPLOY_REPO_PATH: "/repo"
      GIT_SSH_KEY_PATH: "/run/secrets/deploy_key"
      # Stage 11: this container's path to the mount below.
      TV_LIBRARY_ROOT: "/tv-library"
      # Stage 11: this container's path to the movie-library mount below.
      MOVIE_LIBRARY_ROOT: "/movie-library"
      # Post-Stage-13 fix: qBittorrent runs as its own separate container
      # with its own bind mount of this exact same host directory, under
      # its OWN path — not "/tv-library". media_organizer.py needs this to
      # translate qBittorrent's self-reported save_path into this
      # container's namespace before it can hardlink/copy from it; without
      # it, every organize attempt silently fails with FileNotFoundError
      # (real value confirmed live: project.md's Stage 11 decision log,
      # the user set qBittorrent's "tv" category save path to this exact
      # string on the real box).
      QBIT_TV_SAVE_PATH: "/media/TV Shows"
      # Same idea for movies — inferred from the same qBittorrent category
      # config (movies' own category save path, which "tv" defaulted to
      # before being split out), not independently re-confirmed this
      # session; movies aren't auto-organized by the worker today (only
      # the manual `organize-movie` CLI command uses this), so a wrong
      # value here has no live blast radius yet.
      QBIT_MOVIE_SAVE_PATH: "/media/Movies"
    volumes:
      # Deployed-copy source, live-reloaded by uvicorn --reload — confirmed
      # live during Stage 5 by editing this file directly on the NAS and
      # watching WatchFiles pick it up with no container restart.
      - "<REPO_PATH>/backend/app:/app/app"
      # Stage 6: the whole deployed-copy clone, .git included — same host
      # directory backend/app above is a subdirectory of, so a `git pull`
      # run against this mount updates the files both this bind mount and
      # frontend's directory-level mount already serve, with no separate
      # sync step. Read-write: `git pull` has to write into `.git`.
      - "<REPO_PATH>:/repo"
      # Read-only GitHub deploy key — see the note above. 0600 on the host,
      # readable only as this container's (root) user.
      - "<SECRETS_PATH>/deploy_key:/run/secrets/deploy_key:ro"
      # Persistent SQLite job store — distinct from the git-tracked source
      # above, survives container recreation and `git pull` alike.
      - "<APP_DATA_PATH>:/app/data"
      # Stage 11: same underlying dataset qBittorrent's "tv" category
      # downloads into — media_organizer.py's hardlink can't work at all if
      # this isn't genuinely the same filesystem as qBittorrent's own
      # download path, only a same-looking one. That requirement is the
      # whole reason this mount exists, and it is the thing to re-check
      # whenever either side moves: the media datasets have since moved
      # off the SSD onto the big HDD pool, and a library root left
      # pointing at the old pool would still "work" — every organize
      # would just silently fall back to a full copy (EXDEV) at double
      # the disk, with one log line to say so.
      - "<TV_LIBRARY_PATH>:/tv-library"
      # Stage 11 (movies): same idea as the TV mount above, on the SSD
      # dataset qBittorrent's "movies" category save path already points at.
      - "<MOVIE_LIBRARY_PATH>:/movie-library"
    expose:
      - "8000"
    restart: unless-stopped

  # Frontend migration Part G3 — remote access. Opt-in: delete this service
  # (or leave TUNNEL_TOKEN unfilled and it will simply fail to connect) for
  # a LAN-only deployment, which is the default the rest of this file
  # assumes.
  #
  # A Cloudflare Tunnel rather than a port forward: nothing inbound is
  # opened on the router at all, the home IP is never published, and TLS is
  # terminated at Cloudflare's edge — this app never terminates HTTPS
  # itself. cloudflared dials out (7844/tcp) and holds the connection open,
  # so it needs no `ports:` entry of its own and the frontend's published
  # 8095 stays a LAN-only convenience.
  #
  # The public hostname is configured in the Cloudflare dashboard, not
  # here: Zero Trust > Networks > Tunnels > this tunnel > Public Hostname,
  # pointed at `http://frontend:80` — the service name on this project's
  # network, not localhost, which in this container is this container.
  #
  # TUNNEL_TOKEN is a credential and is handled exactly like TMDB_API_KEY
  # above: the placeholder is what's committed, and the real connector
  # token (dashboard, at tunnel creation) is substituted in at apply time,
  # landing root-only under /mnt/.ix-apps/app_configs. Anyone holding it can
  # run this tunnel, so it never goes in the repo. Rotate it in the
  # dashboard if it ever does.
  #
  # Before pointing a hostname at this, read the real_ip note at the top of
  # frontend/nginx.conf's server block, and confirm from outside the house
  # that /api/setup/status answers 403 rather than JSON. Every request
  # through here reaches nginx from this container's private address, and
  # that address is inside the private-range allow list guarding the setup
  # and Plex-link routes; the real_ip directives are the only reason it
  # isn't handing the admin identity to whoever asks first. This service
  # sitting on the same network as `frontend` is also what puts it inside
  # the /12 those directives trust — move it off this network and that
  # stops being true.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "REPLACE_WITH_CONNECTOR_TOKEN_FROM_CLOUDFLARE_DASHBOARD"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  # Declared so the frontend's tmdb-cache mount above resolves; TrueNAS
  # creates it as a normal Docker named volume inside the ix- project.
  tmdb-cache:
