# TrueNAS SCALE Custom App compose config for "movie-downloader" (Stage 5).
#
# Not applied via `docker compose` directly — pasted into the TrueNAS
# Custom App form (or submitted as `custom_compose_config_string` to the
# `app.create` / `app.update` middleware methods), which wraps it into its
# own `ix-movie-downloader` compose project with its own bridge network
# (frontend reaches the backend by service name, `backend:8000`, same as
# local Compose).
#
# All paths below live on the NAS itself, distinct from any workstation
# checkout: the "deployed copy" is `git clone`d to
# /mnt/SSD/AppData/movie-downloader/repo, and only that clone (updated by
# `git pull` from Stage 6 onward) is ever referenced here.
#
# TMDB_API_KEY: TrueNAS custom apps have no env_file support, so the real
# key value has to be inlined here when actually applying this config —
# same handling TrueNAS gives qBittorrent's own Wireguard key in this same
# custom-app system (stored root-only, 0600, under /mnt/.ix-apps/app_configs
# once applied). The placeholder below is what's committed to this
# gitignored-.env-respecting repo; the live NAS deployment has the real
# value from backend/.env substituted in at apply time, not committed here.
#
# GIT_SSH_KEY_PATH (Stage 6): the read-only GitHub deploy key, generated
# for this NAS specifically and never committed — lives at
# /mnt/SSD/AppData/movie-downloader/secrets/deploy_key (0600, root-only,
# outside the git-tracked repo entirely so `git pull` itself can never
# touch it), bind-mounted read-only into the backend container. Same
# "never in the git-tracked tree, never visible via `docker inspect`"
# handling as the confirmed architecture requires — `docker inspect` shows
# only the mount *path*, never the key's contents.

services:
  frontend:
    build:
      context: /mnt/SSD/AppData/movie-downloader/repo/frontend
    ports:
      - "8095:80"
    # One directory-level bind mount, not per-file: a per-file bind mount
    # breaks after `git pull` replaces a file via write-new+rename (the
    # container keeps the old inode) — confirmed live during Stage 5's
    # validation pass. A directory mount re-resolves paths on every
    # request, which is what "frontend picks it up on next request" in
    # the confirmed architecture actually requires. nginx.conf denies
    # serving this same directory's Dockerfile/nginx.conf as a result.
    volumes:
      - /mnt/SSD/AppData/movie-downloader/repo/frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: /mnt/SSD/AppData/movie-downloader/repo/backend
    environment:
      TMDB_API_KEY: "REPLACE_WITH_VALUE_FROM_backend/.env"
      QBIT_HOST: "192.168.0.133"
      QBIT_PORT: "30024"
      # Stage 6: where the self-update endpoint runs `git pull --ff-only`
      # and the deploy key it authenticates with — see app/deploy.py.
      DEPLOY_REPO_PATH: "/repo"
      GIT_SSH_KEY_PATH: "/run/secrets/deploy_key"
    volumes:
      # Deployed-copy source, live-reloaded by uvicorn --reload — confirmed
      # live during Stage 5 by editing this file directly on the NAS and
      # watching WatchFiles pick it up with no container restart.
      - /mnt/SSD/AppData/movie-downloader/repo/backend/app:/app/app
      # Stage 6: the whole deployed-copy clone, .git included — same host
      # directory backend/app above is a subdirectory of, so a `git pull`
      # run against this mount updates the files both this bind mount and
      # frontend's directory-level mount already serve, with no separate
      # sync step. Read-write: `git pull` has to write into `.git`.
      - /mnt/SSD/AppData/movie-downloader/repo:/repo
      # Read-only GitHub deploy key — see the note above. 0600 on the host,
      # readable only as this container's (root) user.
      - /mnt/SSD/AppData/movie-downloader/secrets/deploy_key:/run/secrets/deploy_key:ro
      # Persistent SQLite job store — distinct from the git-tracked source
      # above, survives container recreation and `git pull` alike.
      - /mnt/SSD/AppData/movie-downloader/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
