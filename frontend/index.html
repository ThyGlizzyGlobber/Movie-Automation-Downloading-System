<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obsidian</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#050508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": on iOS 26 a translucent status bar
         makes a home-screen app's page one status-bar height shorter than
         the screen, leaving a dead band at the bottom that no CSS can
         reach. An opaque bar lays the page out edge to edge below it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Obsidian" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/brand-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- The two faces every screen uses, fetched alongside the script
         rather than once it has run and drawn some text. The same files
         main.tsx's font imports point at, so Vite gives both the same
         hashed URL and the preload is what the page then uses. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
