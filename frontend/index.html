<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smithflix</title>
<!-- Sets data-theme before first paint, so a saved light-mode preference
     doesn't flash dark first — the full theme apply (meta theme-color,
     toggle icon) happens later in the main script once the rest of the
     DOM exists. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("smithflix-theme")==="light"?"light":"dark"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#123b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smithflix">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/brand-icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,700,1,0" rel="stylesheet">
<style>
  /* Smithflix brand palette — see brand_identity/smithflix-brand/
     BRAND-IMPLEMENTATION.md. Dark is the default theme (teal surfaces,
     cream text); :root[data-theme="light"] below overrides the same
     tokens for the manual light-mode toggle. Coral is the one fixed
     accent across both themes — reserved for actions/selection, never
     recolored per-household (the old customizable-accent-color setting
     was removed for exactly this reason: one consistent brand color). */
  :root {
    --smithflix-cream: #f6efe3;
    --smithflix-teal: #123b36;
    --smithflix-coral: #ff6b4a;
    --smithflix-mustard: #f4b942;

    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    --bg: #0d2b27;
    --bg-elevated: #123b36;
    --bg-card: #17453f;
    --text: #f6efe3;
    --text-dim: #a9c1bc;
    --accent: var(--smithflix-coral);
    --accent-text: #ffffff;
    --border: #285650;
    --status-queued: #6b7280;
    --status-searching: #3b82f6;
    --status-downloading: #a855f7;
    --status-complete: #22c55e;
    --status-nomatch: #f59e0b;
    --status-nospace: #ef4444;
    --status-failed: #dc2626;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #f6efe3;
    --bg-elevated: #efe5d2;
    --bg-card: #e8dcc4;
    --text: #123b36;
    --text-dim: #5c7570;
    --border: #ddceac;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* Every icon in the app is Material Symbols Rounded at one fixed style
     (filled, weight 700, grade 0, optical size 48 — set on the element
     itself as a fallback/override in case the URL-baked @48,700,1,0
     defaults from the <link> in <head> don't apply for any reason).
     Google's own standard boilerplate for using the variable font as an
     icon set; font-size controls the rendered size per placement below,
     independent of the opsz axis. color inherits from the parent, same
     as the SVG icons this replaces (fill: currentColor). */
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    overscroll-behavior-y: none;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  #topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  #backBtn, #settingsToggle, #themeToggle {
    flex: 0 0 auto; background: none; border: none; color: var(--text);
    font-size: 20px; padding: 6px 8px; border-radius: 8px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #backBtn:active, #settingsToggle:active, #themeToggle:active { background: var(--bg-card); }
  #topbarLogo {
    flex: 0 0 auto; display: flex; align-items: center; min-width: 0;
  }
  /* Real text, not an image — "smith" tracks the current theme's text
     color, "flix" stays the fixed brand coral, so switching theme just
     recolors it like everything else instead of needing a separate
     light/dark SVG swap. */
  #topbarLogo .brand-wordmark {
    font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1;
  }
  #topbarLogo .brand-word-smith { color: var(--text); }
  #topbarLogo .brand-word-flix { color: var(--smithflix-coral); }
  /* Always in the top bar (not a toggleable row) — flex:1 + min-width:0
     so it scales with whatever space backBtn/settingsToggle leave behind,
     rather than forcing the bar to overflow. */
  .search-input-wrap { position: relative; flex: 1; min-width: 0; }
  #searchInput {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 9px 36px 9px 12px; border-radius: 10px; font-size: 15.5px;
    -webkit-appearance: none; appearance: none;
  }
  #searchInput:focus { outline: 2px solid var(--accent); }
  #searchInput::-webkit-search-cancel-button { display: none; }
  .search-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; background: none; border: none;
    color: var(--text-dim); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  /* Same-specificity tie with the UA's [hidden]{display:none} — without
     this, source order lets the rule above win and the button shows even
     while hidden. */
  .search-clear-btn[hidden] { display: none; }
  .search-clear-btn:active { background: var(--bg-elevated); }

  .inline-search {
    display: block; width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px;
    margin-bottom: 18px;
  }
  .inline-search:focus { outline: 2px solid var(--accent); }

  /* 130px (not just the tab bar's ~90px) so scrolled content on the
     Requests view clears the floating .clear-requests-fab/.downloads-fab
     above the tab bar. max-width + centering keeps a desktop-width
     browser window from stretching a single grid/detail column edge to edge. */
  main {
    padding: 14px 14px calc(130px + var(--safe-bottom));
    min-height: 60vh;
    max-width: 1600px; margin: 0 auto;
  }

  .top-nav-links { display: none; }
  .top-nav-link {
    padding: 8px 14px; border-radius: 8px; font-size: 14.5px; font-weight: 600;
    color: var(--text-dim); background: none; border: none;
  }
  .top-nav-link:hover { color: var(--text); background: var(--bg-card); }
  .top-nav-link.active { color: var(--text); }

  section.row { margin-bottom: 26px; }
  section.row h2 {
    font-size: 15px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 10px 2px;
  }
  /* A row whose title expands to a dedicated full-list page (Prime-Video-
     style) — same type scale as the plain h2 above, but accent-colored
     with a trailing chevron so it visibly reads as tappable, not just a
     label. */
  section.row .row-title {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 15px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 10px 2px;
  }
  section.row .row-title-arrow { font-size: 21px; line-height: 1; font-weight: 700; }
  section.row .row-title:active { opacity: 0.7; }

  .hscroll {
    /* overflow-x:auto forces overflow-y to compute as auto too (CSS spec —
       explicitly setting overflow-y:visible here wouldn't override that),
       which clips the top of a poster's hover scale-up below. Top padding
       gives the scaled card room inside the box instead. */
    display: flex; gap: 10px; overflow-x: auto; padding: 8px 0 4px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .hscroll::-webkit-scrollbar { display: none; }

  .poster-card {
    display: block; flex: 0 0 auto; width: var(--poster-min, 112px); scroll-snap-align: start;
  }
  .poster-art { position: relative; border-radius: 10px; overflow: hidden; }
  .poster-card img {
    width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px;
    background: var(--bg-card); display: block;
  }
  .poster-card .cap {
    font-size: 12.5px; margin-top: 6px; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.25;
  }
  /* "On Plex" badge (Stage 14) — a quick-glance band across the bottom of
     any poster already in the household's Plex library, distinct from
     "I requested this" (the app's own status pills). Green, matching the
     existing --status-complete "done/good" color language. */
  .on-plex-badge {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--status-complete) 30%, black 55%);
    color: var(--status-complete);
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    text-align: center; padding: 4px 2px;
  }
  @media (hover: hover) {
    .poster-art { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .poster-card:hover .poster-art {
      transform: scale(1.045); box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 1;
    }
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--poster-min, 104px), 1fr));
    gap: 14px 10px;
  }
  .grid .poster-card { width: auto; }
  .grid .poster-card img { width: 100%; height: auto; aspect-ratio: 2 / 3; }

  /* Full-bleed: breaks out of main's 14px side padding so the row of
     service icons spans the entire display edge to edge. */
  .provider-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 16px 12px;
    width: calc(100% + 28px); margin: 0 -14px; padding: 0 14px;
  }
  .provider-chip {
    /* ~22% is the standard CSS approximation of Apple's App Store icon
       "squircle" ratio (percentage, not a fixed px, so it holds at any
       chip size the responsive grid lands on). */
    width: 100%; aspect-ratio: 1; border-radius: 22%;
    overflow: hidden; background: var(--bg-card); border: 1px solid var(--border);
  }
  .provider-chip img { width: 100%; height: 100%; object-fit: cover; }
  .provider-label {
    text-align: center; font-size: 12.5px; color: var(--text-dim); margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .subnav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 22px;
  }
  .subnav h1 { font-size: 21px; margin: 0; }

  /* Plex-style grid density slider, shown top-right on the same row as a
     category page's own title. Controls --poster-min, so it affects
     every .grid/.hscroll on the page (not just the current view). */
  .grid-size { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .grid-size-icon { color: var(--text-dim); flex: 0 0 auto; line-height: 1; }
  .grid-size-icon.small { font-size: 9px; }
  .grid-size-icon.large { font-size: 16px; }
  .grid-size input[type="range"] {
    width: 78px; accent-color: var(--accent);
  }

  /* Invisible trigger an IntersectionObserver watches to auto-load the
     next page as the user scrolls near it — see wireInfiniteGrid(). Its
     own spinner only shows while a background page fetch is in flight. */
  .grid-sentinel { height: 1px; margin-top: 12px; }
  .grid-sentinel .spinner { margin-top: 16px; }

  .empty, .error, .loading {
    color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 15px;
  }
  .error { color: var(--status-nospace); }
  .retry {
    display: inline-block; margin-top: 10px; padding: 8px 16px;
    background: var(--bg-card); border-radius: 8px; color: var(--text);
  }

  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Detail view — mirrors TMDB's own movie/show page: a full-bleed
     backdrop hero with the poster and title/meta/score/action row
     overlaid near its bottom edge (a dark gradient keeps the text
     legible over any backdrop), Overview/crew/cast below in the normal
     content column. */
  .hero {
    position: relative; width: calc(100% + 28px); margin: 0 -14px 18px;
    background-color: var(--bg-card); background-size: cover; background-position: center top;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top,
      var(--bg) 0%,
      color-mix(in srgb, var(--bg) 88%, transparent) 35%,
      color-mix(in srgb, var(--bg) 45%, transparent) 70%,
      color-mix(in srgb, var(--bg) 10%, transparent) 100%);
  }
  .hero-content {
    position: relative; z-index: 1; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
    min-height: 300px; padding: 24px 14px 20px;
  }
  .detail-poster-wrap {
    position: relative; flex: 0 0 auto; border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }
  .detail-poster { width: 130px; height: 195px; object-fit: cover; background: var(--bg-card); display: block; }
  .detail-info { flex: 1; min-width: 220px; padding-bottom: 2px; }
  .detail-info h1 { font-size: 21px; margin: 0 0 6px; line-height: 1.2; }
  .detail-info h1 .hero-year { font-weight: 400; color: var(--text-dim); }
  .detail-meta {
    color: var(--text-dim); font-size: 13.5px; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .cert-badge {
    font-size: 11px; font-weight: 700; padding: 1px 6px; border: 1px solid var(--text-dim);
    border-radius: 4px; color: var(--text-dim); line-height: 1.4;
  }
  .detail-overview { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--text-dim); }

  /* The score ring + the primary action button share one row, same as
     TMDB's User Score + Play Trailer row. */
  .hero-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-ring {
    width: 44px; height: 44px; border-radius: 50%; position: relative; flex: 0 0 auto;
    background: conic-gradient(var(--score-color, var(--status-complete)) calc(var(--score-pct, 0) * 1%), var(--bg-card) 0);
    display: flex; align-items: center; justify-content: center;
  }
  .score-ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); }
  .score-ring span { position: relative; font-size: 12px; font-weight: 700; }
  .score-label { font-size: 12.5px; color: var(--text-dim); font-weight: 600; }

  .tagline { font-style: italic; color: var(--text-dim); margin-top: 14px; font-size: 14px; }
  .section-heading { font-size: 15px; font-weight: 700; margin: 20px 0 10px; }

  .crew-row { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .crew-name { font-weight: 600; font-size: 14px; }
  .crew-job { font-size: 12.5px; color: var(--text-dim); }

  .cast-section { margin-top: 8px; }
  .cast-card { flex: 0 0 auto; width: 88px; }
  .cast-card img {
    width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
    background: var(--bg-card); display: block;
  }
  .cast-card .cast-name {
    font-size: 12.5px; font-weight: 600; margin-top: 6px; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cast-card .cast-character { font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 1px; }

  /* The primary action button (Add to Plex / Add Show / Watching /
     Paused) — a compact pill sitting next to the score ring, same slot
     TMDB's own "Play Trailer" button occupies. */
  .add-btn {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 12px 22px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: var(--accent-text); border: none; border-radius: 999px;
  }
  .add-btn:active { opacity: 0.85; }
  .add-btn[disabled] { background: var(--bg-card); color: var(--text-dim); }
  .add-confirm {
    margin-top: 14px; padding: 12px 14px; background: var(--bg-card);
    border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 10px;
  }

  @media (min-width: 860px) {
    .hero-content { min-height: 420px; padding: 40px 32px; gap: 28px; }
    .detail-poster { width: 200px; height: 300px; }
    .detail-info h1 { font-size: 32px; }
    .add-btn { padding: 14px 28px; font-size: 16px; }
  }

  /* Show detail (Stage 14): subscribe state + bulk-download actions,
     styled alongside .add-btn above rather than as a separate system. */
  .unsubscribe-link {
    display: block; width: 100%; text-align: center; margin-top: 10px;
    background: none; border: none; color: var(--text-dim); font-size: 13.5px; text-decoration: underline;
  }
  .bulk-btn {
    width: 100%; margin-top: 10px; padding: 13px; font-size: 15px; font-weight: 600;
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
  }
  .bulk-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .bulk-btn:active { opacity: 0.85; }
  .bulk-btn[disabled] { color: var(--text-dim); opacity: 0.6; }
  .season-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .season-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px; background: var(--bg-card); border-radius: 10px; font-size: 14px;
  }
  .season-btn {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    background: none; color: var(--accent); border: 1px solid var(--accent);
  }
  .season-btn:active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .season-btn[disabled] { color: var(--text-dim); border-color: var(--border); }

  /* Status pills, shared between detail confirm + requests list */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .status-queued   { background: color-mix(in srgb, var(--status-queued) 22%, transparent); color: var(--status-queued); }
  .status-searching{ background: color-mix(in srgb, var(--status-searching) 22%, transparent); color: var(--status-searching); }
  .status-downloading{ background: color-mix(in srgb, var(--status-downloading) 22%, transparent); color: var(--status-downloading); }
  .status-complete { background: color-mix(in srgb, var(--status-complete) 22%, transparent); color: var(--status-complete); }
  .status-nomatch  { background: color-mix(in srgb, var(--status-nomatch) 22%, transparent); color: var(--status-nomatch); }
  .status-nospace  { background: color-mix(in srgb, var(--status-nospace) 22%, transparent); color: var(--status-nospace); }
  .status-failed   { background: color-mix(in srgb, var(--status-failed) 22%, transparent); color: var(--status-failed); }
  .status-dot.status-queued { background: var(--status-queued); }
  .status-dot.status-searching { background: var(--status-searching); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-downloading { background: var(--status-downloading); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-complete { background: var(--status-complete); }
  .status-dot.status-nomatch { background: var(--status-nomatch); }
  .status-dot.status-nospace { background: var(--status-nospace); }
  .status-dot.status-failed { background: var(--status-failed); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* Requests list */
  .req-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 4px; border-bottom: 1px solid var(--border);
  }
  .req-main { min-width: 0; flex: 1; }
  .req-title {
    display: block; font-size: 15.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .req-title:active { opacity: 0.7; }
  .req-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .req-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

  /* Requests list grouping (Stage 14.x): a show's episode/pack requests
     collapse into one "Lanterns"-style row with an expand arrow, instead
     of one flat row per episode. Movies stay ungrouped. The header row
     itself toggles on click (see the delegated handler, which skips the
     toggle when the click actually landed on the <a> title so navigating
     to the show still works); the arrow button is just a visual/keyboard
     affordance for the same action. */
  .req-group-header { cursor: pointer; }
  .req-group-header:active { background: var(--bg-card); }
  .req-group-toggle-btn {
    flex: 0 0 auto; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-dim); font-size: 11px;
  }
  .req-group-children { padding-left: 30px; }
  .req-child-row { padding: 10px 4px; }
  .req-child-row .req-title { font-size: 14px; font-weight: 500; color: var(--text-dim); }

  .watch-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .watch-link {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  }
  .watch-link:active { background: var(--bg-card); }
  .cancel-btn {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: transparent; color: var(--status-nospace); border: 1px solid var(--status-nospace);
  }
  .cancel-btn:active { background: color-mix(in srgb, var(--status-nospace) 18%, transparent); }
  .cancel-btn[disabled] { opacity: 0.5; }
  /* A finished download's "Cancel" is really "delete" (there's nothing
     left in progress to cancel) — a plain circular X reads simpler than
     a text pill for that, same treatment as .search-clear-btn. */
  .req-delete-btn {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
    background: none; border: none; color: var(--status-nospace); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .req-delete-btn:active { background: color-mix(in srgb, var(--status-nospace) 18%, transparent); }
  .req-delete-btn[disabled] { opacity: 0.5; }
  /* Watching list's Pause/Resume — same pill shape as .cancel-btn but a
     neutral (not destructive) color, since pausing isn't deleting anything. */
  .toggle-show-btn {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
  }
  .toggle-show-btn:active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .toggle-show-btn[disabled] { opacity: 0.5; }

  /* Floating above the tab bar, bottom-right — not part of the scrolling
     list, so it stays reachable regardless of scroll position. Shares the
     exact right/bottom inset the global .downloads-fab uses everywhere
     else, since the two never appear on screen together — .downloads-fab
     is hidden on this exact page (see route()). */
  .clear-requests-fab {
    position: fixed; right: 32px; bottom: calc(84px + var(--safe-bottom)); z-index: 9;
  }
  .split-btn {
    display: flex; align-items: stretch; background: var(--bg-card);
    border: 1px solid var(--status-nospace); border-radius: 999px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .split-btn-main {
    background: none; border: none; color: var(--status-nospace);
    font-size: 13.5px; font-weight: 600; padding: 10px 16px; white-space: nowrap;
  }
  .split-btn-divider { width: 1px; background: var(--status-nospace); opacity: 0.35; margin: 8px 0; }
  .split-btn-arrow {
    background: none; border: none; color: var(--status-nospace);
    font-size: 12px; padding: 10px 14px; display: flex; align-items: center;
  }
  .split-btn-main:active, .split-btn-arrow:active {
    background: color-mix(in srgb, var(--status-nospace) 18%, transparent);
  }

  .retention-menu {
    position: absolute; left: 0; bottom: calc(100% + 8px); min-width: 200px;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .retention-option {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    width: 100%; text-align: left; background: none; border: none; color: var(--text);
    font-size: 14px; padding: 11px 14px; border-bottom: 1px solid var(--border);
  }
  .retention-option:last-child { border-bottom: none; }
  .retention-option:active { background: var(--bg-card); }
  .retention-option .check { color: var(--accent); font-weight: 700; }

  /* Global "downloads" FAB (Stage 14.x) — replaces Requests as a top-level
     nav item; present on every page (rendered outside #app so route
     changes never touch it), bottom-right, badge-counted with the number
     of currently non-terminal (queued/searching/downloading) requests.
     Hidden on the Requests page itself via route()'s own toggle — no
     point offering to navigate to where you already are. */
  .downloads-fab {
    position: fixed; right: 32px; bottom: calc(84px + var(--safe-bottom)); z-index: 9;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .downloads-fab .material-symbols-rounded { font-size: 28px; }
  .downloads-fab:active { opacity: 0.85; }
  /* Same-specificity tie with the UA's [hidden]{display:none} as
     .search-clear-btn above — without this, the class rule's own
     display:flex wins and route()'s downloadsFab.hidden toggle becomes a
     no-op. */
  .downloads-fab[hidden] { display: none; }
  .downloads-badge {
    position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 999px; background: var(--status-nospace); color: #fff;
    font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }

  /* Settings */
  .settings-btn {
    padding: 12px 20px; font-size: 15px; font-weight: 600; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); border: none;
  }
  .settings-btn:active { opacity: 0.85; }
  .settings-btn[disabled] { background: var(--bg-card); color: var(--text-dim); }
  .settings-btn.danger {
    background: transparent; color: var(--status-nospace); border: 1px solid var(--status-nospace);
  }
  .plex-connected { font-size: 15px; margin-bottom: 14px; }
  .plex-hint { color: var(--text-dim); font-size: 14px; margin-bottom: 14px; line-height: 1.4; }
  .plex-error { color: var(--status-nospace); font-size: 13px; margin-top: 10px; }

  .settings-field { margin-bottom: 16px; }
  .settings-field label {
    display: block; font-size: 13.5px; color: var(--text-dim); margin-bottom: 6px;
  }
  .settings-field input[type="text"], .settings-field input[type="number"], .settings-field select {
    width: 100%; padding: 10px 12px; font-size: 15px; box-sizing: border-box;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  .settings-size-range { display: flex; align-items: center; gap: 10px; }
  .settings-size-range input { flex: 1; min-width: 0; }
  .settings-size-range span { color: var(--text-dim); font-size: 14px; }
  .settings-checkbox-label {
    display: flex !important; align-items: center; gap: 10px; color: var(--text) !important;
    font-size: 15px !important; margin-bottom: 0 !important; cursor: pointer;
  }
  .settings-checkbox-label input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
  .settings-hint { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; line-height: 1.4; }
  .settings-save-error { color: var(--status-nospace); font-size: 13px; margin-top: 12px; }

  .about-footer {
    text-align: center; color: var(--text-dim); font-size: 12px; margin: 28px 0 12px;
  }

  /* Bottom nav */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 6px 0 calc(6px + var(--safe-bottom));
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 0; color: var(--text-dim); font-size: 11px; background: none; border: none;
  }
  .tab .icon { display: flex; }
  .tab .icon .material-symbols-rounded { font-size: 22px; }
  .tab.active { color: var(--accent); }

  /* Desktop nav: a top horizontal bar (Netflix-style) replaces the bottom
     tab bar above this width; below it, today's #tabbar stays. Both are
     driven by the same setChrome({activeTab}) call — see .tab/.top-nav-link
     "active" class toggling in JS — so there's one source of truth for
     which section is active, just two pieces of markup. Declared last so
     it wins the cascade over the plain #tabbar/.top-nav-links rules above,
     which share the same specificity. */
  @media (min-width: 860px) {
    #tabbar { display: none; }
    .top-nav-links { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    main { padding-bottom: 40px; }
    .clear-requests-fab, .downloads-fab { bottom: 28px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="backBtn" style="display:none" aria-label="Back">&larr;</button>
  <a id="topbarLogo" href="#/home" aria-label="Smithflix home">
    <span class="brand-wordmark"><span class="brand-word-smith">smith</span><span class="brand-word-flix">flix</span></span>
  </a>
  <nav class="top-nav-links">
    <button class="top-nav-link" data-tab="home">Home</button>
    <button class="top-nav-link" data-tab="movies">Movies</button>
    <button class="top-nav-link" data-tab="tv">TV Shows</button>
  </nav>
  <div class="search-input-wrap">
    <input id="searchInput" type="search" enterkeyhint="search" aria-label="Search movies and TV shows">
    <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search" hidden>&#10005;</button>
  </div>
  <button id="settingsToggle" aria-label="Settings">
    <span class="material-symbols-rounded">settings</span>
  </button>
  <button id="themeToggle" aria-label="Switch to light mode">
    <span class="material-symbols-rounded" id="themeToggleIcon">dark_mode</span>
  </button>
</div>

<main id="app"><div class="loading"><div class="spinner"></div></div></main>

<nav id="tabbar">
  <button class="tab" data-tab="home">
    <span class="icon"><span class="material-symbols-rounded">home</span></span>Home
  </button>
  <button class="tab" data-tab="movies">
    <span class="icon"><span class="material-symbols-rounded">movie</span></span>Movies
  </button>
  <button class="tab" data-tab="tv">
    <span class="icon"><span class="material-symbols-rounded">tv</span></span>TV Shows
  </button>
</nav>

<!-- Global downloads FAB (Stage 14.x) — outside #app so route changes
     never touch it; navigates to Requests, badge-counted with the active
     (queued/searching/downloading) request count. Hidden while already
     on the Requests page — see route(). -->
<button id="downloadsFab" class="downloads-fab" aria-label="Requests">
  <span class="material-symbols-rounded">download</span>
  <span id="downloadsBadge" class="downloads-badge" hidden>0</span>
</button>

<script>
(function () {
  "use strict";

  // -- Theme (dark/light) -- data-theme itself is already set on <html>
  // by the tiny inline script in <head> (before first paint); this fills
  // in everything that needs the rest of the DOM — the toggle button's
  // own icon/label and the PWA theme-color meta tag. The logo wordmark
  // is plain text colored via CSS vars, so it needs no JS handling here.
  const THEME_KEY = "smithflix-theme";
  function getTheme() {
    try { return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch (e) { return "dark"; }
  }
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#f6efe3" : "#123b36");
    const icon = document.getElementById("themeToggleIcon");
    if (icon) icon.textContent = theme === "light" ? "light_mode" : "dark_mode";
    const btn = document.getElementById("themeToggle");
    if (btn) btn.setAttribute("aria-label", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
  }
  function toggleTheme() {
    const next = getTheme() === "light" ? "dark" : "light";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* private browsing, etc. — just won't persist */ }
    applyTheme(next);
  }
  applyTheme(getTheme());

  const IMG_BASE = "https://image.tmdb.org/t/p/";
  const POSTER_SIZE = "w342";
  const BACKDROP_SIZE = "w780";
  const PLACEHOLDER_POSTER =
    "data:image/svg+xml;utf8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300">' +
      '<rect width="100%" height="100%" fill="#17453f"/></svg>'
    );

  // Curated set of major providers for the home-row chips — TMDB's full
  // provider list runs to 100+ entries; this just picks which ones get a
  // tap target. Logos are shipped locally (frontend/icons/, real App
  // Store icons) rather than hotlinked from TMDB — the user's own choice,
  // to stay in control of freshness/quality rather than whatever TMDB has
  // on file for a given service.
  const CURATED_PROVIDERS = [
    { id: 8, name: "Netflix", icon: "netflix.png" },
    { id: 9, name: "Prime Video", icon: "prime-video.png" },
    { id: 337, name: "Disney+", icon: "disney-plus.png" },
    { id: 1899, name: "Max", icon: "max.png" },
    { id: 15, name: "Hulu", icon: "hulu.png" },
    { id: 2, name: "Apple TV", icon: "apple-tv.png" },
    // 531 ("Paramount+") is a dead TMDB provider id — Paramount+ was split
    // into tiered entries (Premium/Essential); 2303 is the current Premium
    // one — kept for the provider-browse id even though the logo is now local.
    { id: 2303, name: "Paramount+", icon: "paramount-plus.png" },
    { id: 386, name: "Peacock", icon: "peacock.png" },
  ];

  // TMDB's watch-provider ids are shared across movies and TV (Netflix is
  // always 8, etc.), so the same curated chip list backs both sections —
  // only the link prefix differs ("#/movies/provider" vs "#/tv/provider").
  function providerChipsHtml(hrefPrefix) {
    return CURATED_PROVIDERS.map((cp) => `<a href="${hrefPrefix}/${cp.id}/${encodeURIComponent(cp.name)}">
        <div class="provider-chip"><img src="/icons/${cp.icon}" alt=""></div>
        <div class="provider-label">${escapeHtml(cp.name)}</div>
      </a>`).join("");
  }

  // Curated genre rows (Netflix/Prime-style "Comedies", "Action", etc.) —
  // TMDB's genre ids are fixed, well-known constants, so these are hand-
  // picked here rather than fetched from a genre-list endpoint (none
  // exists, and building one just to map id -> name for a handful of
  // rows this app itself chooses would be pure overhead).
  const MOVIE_GENRES = [
    { id: 28, label: "Action" }, { id: 35, label: "Comedies" }, { id: 27, label: "Horror" },
    { id: 10749, label: "Romance" }, { id: 16, label: "Animation" }, { id: 99, label: "Documentaries" },
  ];
  const TV_GENRES = [
    { id: 35, label: "Comedies" }, { id: 18, label: "Dramas" }, { id: 10765, label: "Sci-Fi & Fantasy" },
    { id: 16, label: "Animation" }, { id: 99, label: "Documentaries" }, { id: 80, label: "Crime" },
    { id: 10764, label: "Reality" },
  ];
  // Home mixes movie+TV per named genre — ids diverge by media type (e.g.
  // Action is 28 for movies but "Action & Adventure" is 10759 for TV;
  // Sci-Fi is 878 for movies vs 10765 for TV) so each row pairs a label
  // with both ids explicitly rather than reusing MOVIE_GENRES/TV_GENRES
  // positionally.
  const HOME_GENRES = [
    { label: "Comedies", movieId: 35, tvId: 35 },
    { label: "Action & Adventure", movieId: 28, tvId: 10759 },
    { label: "Sci-Fi & Fantasy", movieId: 878, tvId: 10765 },
    { label: "Animation", movieId: 16, tvId: 16 },
    { label: "Documentaries", movieId: 99, tvId: 99 },
  ];
  // Subset of CURATED_PROVIDERS surfaced as inline "Popular on X" rows on
  // the Movies/TV curated pages — all 8 as rows would make an already-
  // heavy page noticeably heavier; the full list stays reachable via the
  // existing "Browse a Service" chip grid on the same page.
  const ROW_PROVIDERS = CURATED_PROVIDERS.slice(0, 4); // Netflix, Prime Video, Disney+, Max

  const STATUS_META = {
    "queued": { label: "Queued", cls: "status-queued" },
    "searching": { label: "Searching…", cls: "status-searching" },
    "downloading": { label: "Downloading…", cls: "status-downloading" },
    "complete": { label: "Ready", cls: "status-complete" },
    "no qualifying results": { label: "No matches found", cls: "status-nomatch" },
    "insufficient free space": { label: "Not enough space", cls: "status-nospace" },
    "failed": { label: "Failed", cls: "status-failed" },
    "cancelled": { label: "Cancelled", cls: "status-queued" },
  };
  const NON_TERMINAL = new Set(["queued", "searching", "downloading"]);
  const CANCELLABLE = new Set(["queued", "downloading", "complete"]);

  function statusMeta(status) {
    return STATUS_META[status] || { label: status, cls: "status-queued" };
  }

  function statusPillHtml(status) {
    const m = statusMeta(status);
    return `<span class="status-pill ${m.cls}"><span class="status-dot ${m.cls}"></span>${m.label}</span>`;
  }

  function posterUrl(path) {
    return path ? IMG_BASE + POSTER_SIZE + path : PLACEHOLDER_POSTER;
  }
  function backdropUrl(path) {
    return path ? IMG_BASE + BACKDROP_SIZE + path : "";
  }
  function yearOf(dateStr) {
    return dateStr && dateStr.length >= 4 ? dateStr.slice(0, 4) : "";
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  // -- API --

  async function api(path, opts) {
    const res = await fetch(path, opts);
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      const err = new Error(detail);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }
  const getDiscoverPopular = (page) => api(`/api/discover/popular?page=${page || 1}`);
  const getDiscoverTrending = (page) => api(`/api/discover/trending?page=${page || 1}`);
  const getDiscoverByProvider = (id, page) => api(`/api/discover/providers/${id}?page=${page || 1}`);
  const getDiscoverByGenre = (id, page) => api(`/api/discover/genre/${id}?page=${page || 1}`);
  const getComingSoon = (page) => api(`/api/discover/coming-soon?page=${page || 1}`);
  const getMovie = (id) => api(`/api/movies/${id}`);
  const postSearch = (query, providerId) => api(`/api/search`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, provider_id: providerId || null }),
  });

  // -- Stage 14: TV browse + subscription surface --
  const getTvDiscoverPopular = (page) => api(`/api/tv/discover/popular?page=${page || 1}`);
  const getTvDiscoverTrending = (page) => api(`/api/tv/discover/trending?page=${page || 1}`);
  const getTvDiscoverByProvider = (id, page) => api(`/api/tv/discover/providers/${id}?page=${page || 1}`);
  const getTvDiscoverByGenre = (id, page) => api(`/api/tv/discover/genre/${id}?page=${page || 1}`);
  const getTvShow = (id) => api(`/api/tv/${id}`);
  const postSearchTv = (query, providerId) => api(`/api/tv/search`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, provider_id: providerId || null }),
  });
  const listShows = (status) => api(`/api/shows${status ? `?status=${status}` : ""}`);
  const createShow = (tmdb_id) => api(`/api/shows`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tmdb_id }),
  });
  const pauseShow = (id) => api(`/api/shows/${id}/pause`, { method: "POST" });
  const resumeShow = (id) => api(`/api/shows/${id}/resume`, { method: "POST" });
  const deleteShow = (id) => api(`/api/shows/${id}`, { method: "DELETE" });
  // Keyed by tmdb_id (not the local show id) — works whether or not the
  // show has ever been subscribed; the backend creates a paused show
  // record behind the scenes on first use if one doesn't exist yet.
  const bulkDownload = (tmdbId, body) => api(`/api/tv/${tmdbId}/bulk-download`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });

  const listRequests = () => api(`/api/requests`);
  const createRequest = (tmdb_id, query) => api(`/api/requests`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tmdb_id, query: query || null }),
  });
  const getRequest = (id) => api(`/api/requests/${id}`);
  const cancelRequest = (id) => api(`/api/requests/${id}/cancel`, { method: "POST" });
  const clearRequests = () => api(`/api/requests/clear`, { method: "POST" });
  const getRetention = () => api(`/api/settings/retention`);
  const setRetention = (days) => api(`/api/settings/retention`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days }),
  });
  const startPlexLink = () => api(`/api/plex/link`, { method: "POST" });
  const getPlexStatus = () => api(`/api/plex/status`);
  const unlinkPlex = () => api(`/api/plex/unlink`, { method: "POST" });
  const getPipelineSettings = () => api(`/api/settings/pipeline`);
  const setPipelineSettings = (body) => api(`/api/settings/pipeline`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const getTvSettings = () => api(`/api/settings/tv`);
  const setTvSettings = (body) => api(`/api/settings/tv`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const postDeploy = () => api(`/api/admin/deploy`, { method: "POST" });

  // -- Rendering helpers --

  // mediaType: "movie" (default) or "tv" — picks the title/date field and
  // the detail-page link target. Wraps the poster in .poster-art so the
  // "On Plex" badge (Stage 14) can sit pinned to its bottom edge, and so
  // the desktop hover-lift affects only the artwork, not the caption.
  function posterCard(item, mediaType) {
    const isTv = mediaType === "tv";
    const title = escapeHtml(item.title || item.name || item.original_title || item.original_name || "Untitled");
    const href = isTv ? `#/tv/${item.id}` : `#/movies/${item.id}`;
    return `<a class="poster-card" href="${href}">
      <div class="poster-art">
        <img src="${posterUrl(item.poster_path)}" alt="" loading="lazy">
        ${item.on_plex ? `<div class="on-plex-badge">On Plex</div>` : ""}
      </div>
      <div class="cap">${title}</div>
    </a>`;
  }

  // Tags each item of a discover-shaped {results:[...]} response with its
  // media type — mixed Home rows combine a movie call + a TV call whose
  // raw TMDB items don't self-describe which one they are, and
  // posterCard takes mediaType as a plain function arg, not derived from
  // the item itself.
  function tagMediaType(items, mediaType) {
    return items.map((it) => ({ ...it, __mediaType: mediaType }));
  }

  // Netflix/Prime-style horizontal row. Wraps posterCard output in the
  // existing section.row/.hscroll shells — mediaType is either a fixed
  // string ("movie"/"tv") for a same-type row, or a function (item) =>
  // "movie"|"tv" for a mixed row (used with tagMediaType'd items).
  // expandHref, when given, turns the title into a link to a dedicated
  // full-list page for that one category (Prime-Video-style "click a row
  // title to see more") — a trailing chevron plus the accent color marks
  // it as clickable, since a plain <h2> alone doesn't read as tappable.
  function rowHtml(title, items, mediaType, expandHref) {
    if (!items || !items.length) return "";
    const cards = items
      .map((it) => posterCard(it, typeof mediaType === "function" ? mediaType(it) : mediaType))
      .join("");
    const heading = expandHref
      ? `<a class="row-title" href="${expandHref}">${escapeHtml(title)}<span class="row-title-arrow">→</span></a>`
      : `<h2>${escapeHtml(title)}</h2>`;
    return `<section class="row">${heading}<div class="hscroll">${cards}</div></section>`;
  }

  // Simplified hero for curated landing pages (Home, Movies, TV) — reuses
  // .hero/.hero-content/backdropUrl() verbatim, the same shape
  // renderMovie/renderShow use for their detail-page hero, just without
  // the poster/season/subscribe controls: title, a short overview, one
  // "More Info" link into the detail route.
  function homeHeroHtml(item, mediaType) {
    if (!item) return "";
    const isTv = mediaType === "tv";
    const title = escapeHtml(item.title || item.name || item.original_title || item.original_name || "");
    const backdrop = backdropUrl(item.backdrop_path);
    const raw = item.overview || "";
    const overview = raw.length > 220 ? raw.slice(0, 220).trim() + "…" : raw;
    const href = isTv ? `#/tv/${item.id}` : `#/movies/${item.id}`;
    return `<div class="hero" style="${backdrop ? `background-image:url('${backdrop}')` : ""}">
      <div class="hero-content">
        <div class="detail-info">
          <h1>${title}</h1>
          <div class="detail-overview">${escapeHtml(overview)}</div>
          <div class="hero-actions" style="margin-top:14px">
            <a class="add-btn" href="${href}">More Info</a>
          </div>
        </div>
      </div>
    </div>`;
  }

  function loadingHtml() { return `<div class="loading"><div class="spinner"></div></div>`; }
  function errorHtml(msg, retryHash) {
    return `<div class="error">Couldn't load that.<br>${escapeHtml(msg || "")}
      <br><a class="retry" href="${retryHash || "#/movies"}" onclick="location.reload()">Retry</a></div>`;
  }
  function emptyHtml(msg) { return `<div class="empty">${escapeHtml(msg)}</div>`; }

  // Plex-style grid density slider. Persisted per-device (localStorage),
  // applied as a CSS var so it affects every .grid on the page, not just
  // whichever view happens to render the slider control itself.
  const GRID_SIZE_KEY = "gridPosterMinPx";
  const GRID_SIZE_MIN = 80;
  const GRID_SIZE_MAX = 170;
  const GRID_SIZE_DEFAULT = 104;

  function getGridSize() {
    let stored = null;
    try { stored = Number(localStorage.getItem(GRID_SIZE_KEY)); } catch (e) {}
    return stored && stored >= GRID_SIZE_MIN && stored <= GRID_SIZE_MAX ? stored : GRID_SIZE_DEFAULT;
  }
  function setGridSize(px) {
    document.documentElement.style.setProperty("--poster-min", px + "px");
    try { localStorage.setItem(GRID_SIZE_KEY, String(px)); } catch (e) {}
  }
  function gridSizeHtml() {
    return `<div class="grid-size" title="Grid size">
      <span class="grid-size-icon small">▪</span>
      <input type="range" id="gridSizeSlider" min="${GRID_SIZE_MIN}" max="${GRID_SIZE_MAX}" step="1" value="${getGridSize()}">
      <span class="grid-size-icon large">▪</span>
    </div>`;
  }
  function wireGridSizeSlider() {
    const el = document.getElementById("gridSizeSlider");
    if (el) el.addEventListener("input", () => setGridSize(Number(el.value)));
  }
  setGridSize(getGridSize());

  // -- Router --

  const app = document.getElementById("app");
  const backBtn = document.getElementById("backBtn");
  let activePollTimer = null;
  // Which show groups are expanded on the Requests page — a plain Set
  // rather than per-row DOM state, since loadRequests() rebuilds the
  // whole list's innerHTML on every 5s poll and would otherwise silently
  // re-collapse anything the user had opened. Reset fresh each time
  // renderRequests() itself is entered (a new visit to the page).
  let requestsExpandedGroups = new Set();

  function stopPolling() {
    // setInterval (Requests list) and setTimeout (Settings' Plex-link
    // poll) share the same handle namespace in every major browser, so
    // clearing both is a safe no-op for whichever one wasn't actually used.
    if (activePollTimer) { clearInterval(activePollTimer); clearTimeout(activePollTimer); activePollTimer = null; }
  }

  // The search bar lives permanently in the top bar now (not a toggled
  // row), so there's no on-screen title left to set — `title` still
  // updates the browser tab/PWA title instead.
  function setChrome({ title, showBack, activeTab }) {
    document.title = title ? `${title} — Smithflix` : "Smithflix";
    backBtn.style.display = showBack ? "" : "none";
    document.querySelectorAll(".tab, .top-nav-link").forEach((t) => {
      t.classList.toggle("active", t.dataset.tab === activeTab);
    });
  }

  const SECTION_HASH = { home: "#/home", movies: "#/movies", tv: "#/tv" };
  function navigate(hash) { window.location.hash = hash; }
  backBtn.addEventListener("click", () => window.history.back());

  document.querySelectorAll(".tab, .top-nav-link").forEach((t) => {
    t.addEventListener("click", () => navigate(SECTION_HASH[t.dataset.tab] || "#/movies"));
  });

  // -- Global downloads FAB (Stage 14.x) — replaces Requests as a nav
  //    item. Polls independently of the per-view activePollTimer (which
  //    stopPolling() clears on every route change) so the badge count
  //    stays live no matter which page is showing. --
  const downloadsFab = document.getElementById("downloadsFab");
  const downloadsBadge = document.getElementById("downloadsBadge");
  downloadsFab.addEventListener("click", () => navigate("#/requests"));
  async function refreshDownloadsBadge() {
    try {
      const rows = await listRequests();
      const active = rows.filter((r) => NON_TERMINAL.has(r.status)).length;
      downloadsBadge.textContent = active > 99 ? "99+" : String(active);
      downloadsBadge.hidden = active === 0;
    } catch (err) { /* a transient fetch failure just leaves the last-known count showing */ }
  }
  refreshDownloadsBadge();
  setInterval(refreshDownloadsBadge, 5000);

  // Delegated once here (rather than re-attached on every view render)
  // since #app itself is never replaced, only its innerHTML — each
  // selector below only ever exists on one particular view, so this is a
  // no-op everywhere else.
  app.addEventListener("click", async (e) => {
    // Requests list group header: toggle expand/collapse, unless the
    // click actually landed on the show-title link, which should navigate
    // normally rather than also toggling the row it sits inside of.
    const groupToggle = e.target.closest("[data-toggle-group]");
    if (groupToggle && !e.target.closest("a")) {
      const showId = Number(groupToggle.dataset.toggleGroup);
      if (requestsExpandedGroups.has(showId)) requestsExpandedGroups.delete(showId);
      else requestsExpandedGroups.add(showId);
      await loadRequests();
      return;
    }

    const toggleShowBtn = e.target.closest(".toggle-show-btn");
    if (toggleShowBtn) {
      const showId = toggleShowBtn.dataset.toggleShow;
      const isPaused = toggleShowBtn.dataset.currentStatus === "paused";
      toggleShowBtn.disabled = true;
      try {
        await (isPaused ? resumeShow(showId) : pauseShow(showId));
        await renderWatching();
      } catch (err) {
        alert(`Couldn't update this show: ${err.message}`);
        toggleShowBtn.disabled = false;
      }
      return;
    }

    const unsubBtn = e.target.closest("[data-unsub-show]");
    if (unsubBtn) {
      if (!confirm("Unsubscribe from this show? Its download history stays in Requests.")) return;
      unsubBtn.disabled = true;
      try {
        await deleteShow(unsubBtn.dataset.unsubShow);
        await renderWatching();
      } catch (err) {
        alert(`Couldn't unsubscribe: ${err.message}`);
        unsubBtn.disabled = false;
      }
      return;
    }

    const cancelBtn = e.target.closest(".cancel-btn, .req-delete-btn");
    if (cancelBtn) {
      const isDelete = cancelBtn.classList.contains("req-delete-btn");
      const confirmMsg = cancelBtn.dataset.status === "queued"
        ? "Remove this request from the queue? This can't be undone."
        : "Delete this download and its files from qBittorrent? This can't be undone.";
      if (!confirm(confirmMsg)) return;
      cancelBtn.disabled = true;
      if (!isDelete) cancelBtn.textContent = "Cancelling…";
      try {
        await cancelRequest(cancelBtn.dataset.requestId);
        await loadRequests();
      } catch (err) {
        alert(`Couldn't cancel: ${err.message}`);
        cancelBtn.disabled = false;
        if (!isDelete) cancelBtn.textContent = "Cancel";
      }
      return;
    }

    const menu = document.getElementById("retentionMenu");
    if (!menu) return;
    if (e.target.closest("#retentionMenuBtn")) {
      menu.hidden = !menu.hidden;
      return;
    }
    const option = e.target.closest(".retention-option");
    if (option) {
      const days = option.dataset.days ? Number(option.dataset.days) : null;
      menu.hidden = true;
      try {
        await setRetention(days);
        menu.innerHTML = retentionOptionsHtml(days);
      } catch (err) {
        alert(`Couldn't update auto-clear: ${err.message}`);
      }
      return;
    }
    if (!menu.hidden && !e.target.closest("#retentionMenu")) menu.hidden = true;
  });

  const routes = [
    { re: /^#\/home$/, handler: renderHome },
    { re: /^#\/movies$/, handler: renderMovies },
    { re: /^#\/movies\/trending$/, handler: () => renderCategory("Trending Movies", getDiscoverTrending, "movie") },
    { re: /^#\/movies\/popular$/, handler: () => renderCategory("Popular Movies", getDiscoverPopular, "movie") },
    { re: /^#\/movies\/coming-soon$/, handler: () => renderCategory("New Releases", getComingSoon, "movie") },
    { re: /^#\/movies\/genre\/(\d+)\/(.*)$/, handler: (m) => renderCategory(decodeURIComponent(m[2]), (p) => getDiscoverByGenre(m[1], p), "movie") },
    { re: /^#\/movies\/provider\/(\d+)\/(.*)$/, handler: (m) => renderProvider(m[1], decodeURIComponent(m[2]), "movie") },
    { re: /^#\/movies\/(\d+)$/, handler: (m) => renderMovie(m[1]) },
    { re: /^#\/tv$/, handler: renderTv },
    { re: /^#\/tv\/trending$/, handler: () => renderCategory("Trending TV Shows", getTvDiscoverTrending, "tv") },
    { re: /^#\/tv\/popular$/, handler: () => renderCategory("Popular TV Shows", getTvDiscoverPopular, "tv") },
    { re: /^#\/tv\/genre\/(\d+)\/(.*)$/, handler: (m) => renderCategory(decodeURIComponent(m[2]), (p) => getTvDiscoverByGenre(m[1], p), "tv") },
    { re: /^#\/tv\/watching$/, handler: renderWatching },
    { re: /^#\/tv\/provider\/(\d+)\/(.*)$/, handler: (m) => renderProvider(m[1], decodeURIComponent(m[2]), "tv") },
    { re: /^#\/tv\/(\d+)$/, handler: (m) => renderShow(m[1]) },
    { re: /^#\/requests$/, handler: renderRequests },
    { re: /^#\/search\/(.*)$/, handler: (m) => renderSearch(decodeURIComponent(m[1])) },
    { re: /^#\/settings$/, handler: renderSettings },
  ];

  function route() {
    stopPolling();
    const hash = window.location.hash || "#/home";
    downloadsFab.hidden = hash.startsWith("#/requests");
    for (const r of routes) {
      const m = hash.match(r.re);
      if (m) { r.handler(m); return; }
    }
    navigate("#/home");
  }
  window.addEventListener("hashchange", route);

  // -- Views --

  // Subscribed-shows rows for Home/TV — listShows() alone doesn't carry
  // poster art or a real "when did this last air" signal, so each show
  // gets enriched with its own already-existing GET /api/tv/{id} detail
  // (poster_path, on_plex, and last_episode_to_air.air_date — real TMDB
  // data, so a show correctly jumps to the front the moment a new
  // episode actually airs, no extra polling/caching needed on this end).
  async function fetchEnrichedWatchingShows() {
    const shows = await listShows();
    return Promise.all(shows.map(async (s) => {
      let detail = {};
      try { detail = await getTvShow(s.tmdb_id); } catch (err) { /* fall through with no poster/air-date */ }
      return {
        id: s.tmdb_id,
        name: s.title,
        poster_path: detail.poster_path || null,
        on_plex: detail.on_plex || false,
        __mediaType: "tv",
        created_at: s.created_at,
        last_air_date: detail.last_episode_to_air?.air_date || null,
      };
    }));
  }

  // "New In Watching" (most recently *aired* episode first — a show with
  // an episode airing today jumps straight to the front) and "Subscribed
  // Shows" (most recently *subscribed* first) — two different orderings
  // of the same subscribed-shows list, both expanding to the existing
  // full Watching page (pause/resume/unsubscribe controls, unchanged).
  function watchingRowsHtml(enrichedShows) {
    const byNewestEpisode = [...enrichedShows].sort(
      (a, b) => (b.last_air_date || "").localeCompare(a.last_air_date || "")
    );
    const bySubscribed = [...enrichedShows].sort(
      (a, b) => (b.created_at || "").localeCompare(a.created_at || "")
    );
    return (
      rowHtml("New In Watching", byNewestEpisode, (it) => it.__mediaType, "#/tv/watching") +
      rowHtml("Subscribed Shows", bySubscribed, (it) => it.__mediaType, "#/tv/watching")
    );
  }

  // The merged Home feed — mixes movies and TV into one curated,
  // row-based landing page, at the user's explicit request, alongside
  // (not instead of) the separate movie-only/TV-only Movies/TV pages
  // below. No subnav — straight into a hero banner + rows.
  async function renderHome() {
    setChrome({ title: "", showBack: false, activeTab: "home" });
    app.innerHTML = loadingHtml();

    // One Promise.all resolves every row's data in parallel; a single
    // loadingHtml() covers the whole wait rather than a progressive
    // per-row reveal — simplest correct option, and every row is a
    // single page (~20 items, no pagination), so the wait is bounded by
    // the slowest of these parallel calls, not a serial chain.
    const jobs = [
      { key: "movieTrending", fn: () => getDiscoverTrending(1) },
      { key: "tvTrending", fn: () => getTvDiscoverTrending(1) },
      { key: "moviePopular", fn: () => getDiscoverPopular(1) },
      { key: "tvPopular", fn: () => getTvDiscoverPopular(1) },
      { key: "comingSoon", fn: () => getComingSoon(1) },
      { key: "watchingShows", fn: fetchEnrichedWatchingShows },
      ...HOME_GENRES.flatMap((g) => [
        { key: `gm-${g.movieId}`, fn: () => getDiscoverByGenre(g.movieId, 1) },
        { key: `gt-${g.tvId}`, fn: () => getTvDiscoverByGenre(g.tvId, 1) },
      ]),
    ];

    try {
      const results = await Promise.all(jobs.map((j) => j.fn()));
      const byKey = {};
      jobs.forEach((j, i) => { byKey[j.key] = results[i]; });

      const topMovie = byKey.movieTrending.results?.[0];
      const topTv = byKey.tvTrending.results?.[0];
      const heroIsTv = topTv && (!topMovie || (topTv.popularity || 0) > (topMovie.popularity || 0));
      const heroItem = heroIsTv ? topTv : topMovie;

      const mixedTrending = [
        ...tagMediaType(byKey.movieTrending.results || [], "movie"),
        ...tagMediaType(byKey.tvTrending.results || [], "tv"),
      ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0)).slice(0, 20);

      // Each named genre does a movie call + a TV call, interleaved into
      // one mixed row rather than split into two half-width rows — reads
      // as a single Netflix-style row.
      const genreRows = HOME_GENRES.map((g) => {
        const movieItems = tagMediaType(byKey[`gm-${g.movieId}`].results || [], "movie");
        const tvItems = tagMediaType(byKey[`gt-${g.tvId}`].results || [], "tv");
        const merged = [];
        for (let i = 0; i < Math.max(movieItems.length, tvItems.length); i++) {
          if (movieItems[i]) merged.push(movieItems[i]);
          if (tvItems[i]) merged.push(tvItems[i]);
        }
        return rowHtml(g.label, merged, (it) => it.__mediaType);
      });

      // Unlike the TV page (where the two Watching rows are always
      // pinned to the top), Home scatters them at a random point among
      // the other rows on every load — closer to how Netflix's own
      // "Continue Watching" surfaces among other rows rather than always
      // being the very first thing on the page. Kept as one adjacent
      // pair (not split apart) so the two stay visually associated.
      const contentRows = [
        rowHtml("Trending Now", mixedTrending, (it) => it.__mediaType),
        rowHtml("Popular Movies", byKey.moviePopular.results || [], "movie", "#/movies/popular"),
        rowHtml("Popular TV Shows", byKey.tvPopular.results || [], "tv", "#/tv/popular"),
        rowHtml("New Releases", byKey.comingSoon.results || [], "movie", "#/movies/coming-soon"),
        ...genreRows,
      ].filter(Boolean);

      const watchingBlock = watchingRowsHtml(byKey.watchingShows || []);
      if (watchingBlock) {
        contentRows.splice(Math.floor(Math.random() * (contentRows.length + 1)), 0, watchingBlock);
      }

      app.innerHTML = `
        ${homeHeroHtml(heroItem, heroIsTv ? "tv" : "movie")}
        ${contentRows.join("")}
        <section class="row">
          <h2>Browse a Service</h2>
          <div class="provider-row">${providerChipsHtml("#/movies/provider")}</div>
        </section>
      `;
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/home");
    }
  }

  // Shared paginated-grid markup + infinite-scroll wiring — backs Movies'
  // Popular/Trending/Coming Soon, TV's Popular/Trending, and Provider
  // browse, all of which are "fetch a {results, page, total_pages} page,
  // append the next one as the user scrolls" in the exact same shape.
  function gridSectionHtml(gridId, sentinelId, data, mediaType, emptyMessage) {
    const results = data.results || [];
    return `
      <div class="grid" id="${gridId}">${results.map((it) => posterCard(it, mediaType)).join("")}</div>
      ${!results.length && emptyMessage ? emptyHtml(emptyMessage) : ""}
      <div class="grid-sentinel" id="${sentinelId}"><div class="spinner" hidden></div></div>
    `;
  }

  function gridColumnCount(gridEl) {
    // .grid uses grid-template-columns: repeat(auto-fill, minmax(...)) —
    // the browser resolves that into an actual per-viewport track list
    // (varies with window width and the grid-size slider's --poster-min),
    // which is exactly the "how many posters fit per row right now"
    // this needs; reading it forces the layout pass that makes it accurate.
    const tracks = getComputedStyle(gridEl).gridTemplateColumns.split(" ").filter(Boolean);
    return tracks.length || 1;
  }

  // Auto-loads more pages as the user scrolls near the bottom of a grid,
  // via an IntersectionObserver on an invisible sentinel element —
  // replaces the old "Load more" button entirely, at the user's explicit
  // request. Also front-loads enough pages up front to fill at least 4
  // full rows before ever waiting on scroll: TMDB always returns a fixed
  // 20 results per page regardless of how many columns actually fit, so
  // one page is rarely "4 rows" on a wide desktop window or a small
  // grid-size slider setting.
  async function wireInfiniteGrid(gridId, sentinelId, fetchPage, mediaType, initialData) {
    const gridEl = document.getElementById(gridId);
    const sentinel = document.getElementById(sentinelId);
    if (!gridEl || !sentinel) return;
    const spinner = sentinel.querySelector(".spinner");
    let page = initialData.page || 1;
    let totalPages = initialData.total_pages || 1;
    let loading = false;

    async function loadNextPage() {
      if (loading || page >= totalPages) return false;
      loading = true;
      if (spinner) spinner.hidden = false;
      try {
        const next = await fetchPage(page + 1);
        page = next.page;
        totalPages = next.total_pages || totalPages;
        gridEl.insertAdjacentHTML(
          "beforeend", (next.results || []).map((it) => posterCard(it, mediaType)).join("")
        );
        return true;
      } finally {
        loading = false;
        if (spinner) spinner.hidden = true;
      }
    }

    const TARGET_ROWS = 4;
    while (page < totalPages && gridEl.children.length < gridColumnCount(gridEl) * TARGET_ROWS) {
      if (!(await loadNextPage())) break;
    }

    if (page >= totalPages) return; // nothing left to lazily load — no observer needed

    // IntersectionObserver only reports a *transition* across its
    // threshold, not "still intersecting" on every subsequent layout
    // change — so once the sentinel is continuously inside the rootMargin
    // zone (a short page, or a wide/dense grid), appending a page shifts
    // it without ever re-crossing that boundary, and the callback goes
    // silent forever even though there's more to load. Re-observing after
    // every successful load forces a fresh report of the sentinel's
    // *current* state (observe() always delivers one), so a still-close
    // sentinel immediately queues the next page instead of stalling.
    const observer = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) {
        observer.unobserve(sentinel);
        loadNextPage().then((loaded) => {
          if (loaded && page < totalPages) observer.observe(sentinel);
        });
      }
    }, { rootMargin: "800px 0px" });
    observer.observe(sentinel);
  }

  // Curated, row-based Movies page — no more Popular/Trending/Coming Soon
  // tabs (removed at the user's explicit request); each row's title is
  // now the way to reach that one category's own full list (see
  // renderCategory()), Prime-Video-style.
  async function renderMovies() {
    setChrome({ title: "", showBack: false, activeTab: "movies" });
    app.innerHTML = loadingHtml();
    try {
      const jobs = [
        { key: "trending", fn: () => getDiscoverTrending(1) },
        { key: "popular", fn: () => getDiscoverPopular(1) },
        { key: "comingSoon", fn: () => getComingSoon(1) },
        ...MOVIE_GENRES.map((g) => ({ key: `genre-${g.id}`, fn: () => getDiscoverByGenre(g.id, 1) })),
        ...ROW_PROVIDERS.map((p) => ({ key: `provider-${p.id}`, fn: () => getDiscoverByProvider(p.id, 1) })),
      ];
      const results = await Promise.all(jobs.map((j) => j.fn()));
      const byKey = {};
      jobs.forEach((j, i) => { byKey[j.key] = results[i]; });

      app.innerHTML = `
        ${homeHeroHtml(byKey.trending.results?.[0], "movie")}
        ${rowHtml("Trending Movies", byKey.trending.results || [], "movie", "#/movies/trending")}
        ${rowHtml("Popular", byKey.popular.results || [], "movie", "#/movies/popular")}
        ${rowHtml("New Releases", byKey.comingSoon.results || [], "movie", "#/movies/coming-soon")}
        ${MOVIE_GENRES.map((g) => rowHtml(
          g.label, byKey[`genre-${g.id}`].results || [], "movie",
          `#/movies/genre/${g.id}/${encodeURIComponent(g.label)}`
        )).join("")}
        <section class="row">
          <h2>Browse a Service</h2>
          <div class="provider-row">${providerChipsHtml("#/movies/provider")}</div>
        </section>
        ${ROW_PROVIDERS.map((p) => rowHtml(
          `Popular on ${p.name}`, byKey[`provider-${p.id}`].results || [], "movie",
          `#/movies/provider/${p.id}/${encodeURIComponent(p.name)}`
        )).join("")}
      `;
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/movies");
    }
  }

  // One category's full, paginated list — the row-title-click destination
  // for Trending/Popular/New Releases/genre rows on Home/Movies/TV.
  // Provider rows keep linking to the existing renderProvider instead
  // (unchanged, has its own within-provider search box).
  async function renderCategory(title, fetchPage, mediaType) {
    const backHash = mediaType === "tv" ? "#/tv" : "#/movies";
    setChrome({ title, showBack: true, activeTab: mediaType === "tv" ? "tv" : "movies" });
    app.innerHTML = loadingHtml();
    try {
      const data = await fetchPage(1);
      app.innerHTML = `
        <div class="subnav">
          <h1>${escapeHtml(title)}</h1>
          ${gridSizeHtml()}
        </div>
        ${gridSectionHtml("categoryGrid", "categoryMore", data, mediaType, "Nothing found.")}
      `;
      wireGridSizeSlider();
      wireInfiniteGrid("categoryGrid", "categoryMore", fetchPage, mediaType, data);
    } catch (err) {
      app.innerHTML = errorHtml(err.message, backHash);
    }
  }

  // mediaType: "movie" (default) or "tv" — same provider ids work for
  // both (TMDB's watch-provider ids are shared across media types), just
  // a different discover/search call and poster-card link target.
  async function renderProvider(id, name, mediaType) {
    const isTv = mediaType === "tv";
    const discoverByProvider = isTv ? getTvDiscoverByProvider : getDiscoverByProvider;
    const searchFn = isTv ? postSearchTv : postSearch;
    setChrome({ title: name || "Browse", showBack: true, activeTab: isTv ? "tv" : "movies" });
    app.innerHTML = `
      <input type="search" class="inline-search" id="providerSearchInput"
             placeholder="Search within ${escapeHtml(name || "this service")}…">
      <div id="providerResults">${loadingHtml()}</div>
    `;
    const input = document.getElementById("providerSearchInput");
    const resultsEl = document.getElementById("providerResults");

    async function showBrowse() {
      resultsEl.innerHTML = loadingHtml();
      try {
        const data = await discoverByProvider(id, 1);
        resultsEl.innerHTML = gridSectionHtml("providerGrid", "providerMore", data, mediaType, "No titles found for this service.");
        wireInfiniteGrid("providerGrid", "providerMore", (p) => discoverByProvider(id, p), mediaType, data);
      } catch (err) {
        resultsEl.innerHTML = errorHtml(err.message);
      }
    }

    async function showProviderSearch(query) {
      resultsEl.innerHTML = loadingHtml();
      try {
        const results = await searchFn(query, Number(id));
        resultsEl.innerHTML = results.length
          ? `<div class="grid">${results.map((it) => posterCard(it, mediaType)).join("")}</div>`
          : emptyHtml(`No titles on ${name || "this service"} matched “${query}”.`);
      } catch (err) {
        resultsEl.innerHTML = errorHtml(err.message);
      }
    }

    function submitProviderSearch() {
      const query = input.value.trim();
      if (query) showProviderSearch(query); else showBrowse();
    }
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitProviderSearch(); });
    input.addEventListener("search", submitProviderSearch);

    await showBrowse();
  }

  // -- TV section (Stage 14) --

  // Curated, row-based TV Shows page — same treatment as Movies, TV-only.

        </section>

          `Popular on ${p.name}`, byKey[`provider-${p.id}`].results || [], "tv",
          `#/tv/provider/${p.id}/${encodeURIComponent(p.name)}`
