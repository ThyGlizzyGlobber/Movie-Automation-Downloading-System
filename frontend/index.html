<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Family Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Downloader">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --bg-elevated: #181b21;
    --bg-card: #20242c;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #1e88e5;
    --accent-text: #ffffff;
    --border: #2a2e37;
    --status-queued: #6b7280;
    --status-searching: #3b82f6;
    --status-downloading: #a855f7;
    --status-complete: #22c55e;
    --status-nomatch: #f59e0b;
    --status-nospace: #ef4444;
    --status-failed: #dc2626;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior-y: none;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  #topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  #topbar h1 {
    font-size: 19px; margin: 0; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #searchToggle, #backBtn {
    background: none; border: none; color: var(--text);
    font-size: 20px; padding: 6px 8px; border-radius: 8px; line-height: 1;
  }
  #searchToggle:active, #backBtn:active { background: var(--bg-card); }
  #searchBar {
    display: none; padding: 0 14px 12px; gap: 8px;
  }
  #searchBar.open { display: flex; }
  #searchInput {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px;
  }
  #searchInput:focus { outline: 2px solid var(--accent); }

  main { padding: 14px 14px calc(90px + var(--safe-bottom)); min-height: 60vh; }

  section.row { margin-bottom: 26px; }
  section.row h2 {
    font-size: 15px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 10px 2px;
  }

  .hscroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .hscroll::-webkit-scrollbar { display: none; }

  .poster-card {
    display: block; flex: 0 0 auto; width: 112px; scroll-snap-align: start;
  }
  .poster-card img {
    width: 112px; height: 168px; object-fit: cover; border-radius: 10px;
    background: var(--bg-card); display: block;
  }
  .poster-card .cap {
    font-size: 12.5px; margin-top: 6px; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.25;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 14px 10px;
  }
  .grid .poster-card { width: auto; }
  .grid .poster-card img { width: 100%; height: auto; aspect-ratio: 2 / 3; }

  .provider-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
  .provider-row::-webkit-scrollbar { display: none; }
  .provider-chip {
    flex: 0 0 auto; width: 60px; height: 60px; border-radius: 16px;
    overflow: hidden; background: var(--bg-card); border: 1px solid var(--border);
  }
  .provider-chip img { width: 100%; height: 100%; object-fit: cover; }
  .provider-label { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 4px; width: 60px; }

  .loadmore {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; font-size: 15px;
  }
  .loadmore:active { background: var(--bg-elevated); }

  .empty, .error, .loading {
    color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 15px;
  }
  .error { color: var(--status-nospace); }
  .retry {
    display: inline-block; margin-top: 10px; padding: 8px 16px;
    background: var(--bg-card); border-radius: 8px; color: var(--text);
  }

  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Detail view */
  .detail-backdrop {
    width: calc(100% + 28px); margin: 0 -14px; height: 200px;
    object-fit: cover; background: var(--bg-card); display: block;
  }
  .detail-head { display: flex; gap: 14px; margin-top: -50px; padding: 0 4px; }
  .detail-poster {
    width: 110px; height: 165px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5); background: var(--bg-card);
    border: 2px solid var(--bg);
  }
  .detail-info { flex: 1; padding-top: 54px; min-width: 0; }
  .detail-info h1 { font-size: 20px; margin: 0 0 4px; line-height: 1.2; }
  .detail-meta { color: var(--text-dim); font-size: 13px; }
  .detail-overview { margin-top: 18px; font-size: 15px; line-height: 1.5; color: #d7d9dd; }
  .genre-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .genre-pill {
    font-size: 12px; padding: 4px 10px; background: var(--bg-card);
    border-radius: 999px; color: var(--text-dim);
  }

  .add-btn {
    width: 100%; margin-top: 22px; padding: 15px; font-size: 16.5px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border: none; border-radius: 12px;
  }
  .add-btn:active { opacity: 0.85; }
  .add-btn[disabled] { background: var(--bg-card); color: var(--text-dim); }
  .add-confirm {
    margin-top: 14px; padding: 12px 14px; background: var(--bg-card);
    border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 10px;
  }

  /* Status pills, shared between detail confirm + requests list */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .status-queued   { background: color-mix(in srgb, var(--status-queued) 22%, transparent); color: var(--status-queued); }
  .status-searching{ background: color-mix(in srgb, var(--status-searching) 22%, transparent); color: var(--status-searching); }
  .status-downloading{ background: color-mix(in srgb, var(--status-downloading) 22%, transparent); color: var(--status-downloading); }
  .status-complete { background: color-mix(in srgb, var(--status-complete) 22%, transparent); color: var(--status-complete); }
  .status-nomatch  { background: color-mix(in srgb, var(--status-nomatch) 22%, transparent); color: var(--status-nomatch); }
  .status-nospace  { background: color-mix(in srgb, var(--status-nospace) 22%, transparent); color: var(--status-nospace); }
  .status-failed   { background: color-mix(in srgb, var(--status-failed) 22%, transparent); color: var(--status-failed); }
  .status-dot.status-queued { background: var(--status-queued); }
  .status-dot.status-searching { background: var(--status-searching); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-downloading { background: var(--status-downloading); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-complete { background: var(--status-complete); }
  .status-dot.status-nomatch { background: var(--status-nomatch); }
  .status-dot.status-nospace { background: var(--status-nospace); }
  .status-dot.status-failed { background: var(--status-failed); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* Requests list */
  .req-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 4px; border-bottom: 1px solid var(--border);
  }
  .req-main { min-width: 0; }
  .req-title { font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }

  /* Bottom nav */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: rgba(15,17,21,0.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 6px 0 calc(6px + var(--safe-bottom));
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 0; color: var(--text-dim); font-size: 11px; background: none; border: none;
  }
  .tab .icon { font-size: 21px; }
  .tab.active { color: var(--accent); }
</style>
</head>
<body>

<div id="topbar">
  <button id="backBtn" style="display:none" aria-label="Back">&larr;</button>
  <h1 id="pageTitle">The Family Downloader</h1>
  <button id="searchToggle" aria-label="Search">&#128269;</button>
</div>
<div id="searchBar">
  <input id="searchInput" type="search" placeholder="Search movies&hellip;" enterkeyhint="search">
</div>

<main id="app"><div class="loading"><div class="spinner"></div></div></main>

<nav id="tabbar">
  <button class="tab" data-tab="home"><span class="icon">&#127968;</span>Home</button>
  <button class="tab" data-tab="requests"><span class="icon">&#128229;</span>Requests</button>
</nav>

<script>
(function () {
  "use strict";

  const IMG_BASE = "https://image.tmdb.org/t/p/";
  const POSTER_SIZE = "w342";
  const BACKDROP_SIZE = "w780";
  const PLACEHOLDER_POSTER =
    "data:image/svg+xml;utf8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300">' +
      '<rect width="100%" height="100%" fill="#20242c"/></svg>'
    );

  // Curated set of major providers for the home-row chips — TMDB's full
  // provider list runs to 100+ entries; names/logos still come live from
  // the API, this just picks which ones get a tap target.
  const CURATED_PROVIDERS = [
    { id: 8, name: "Netflix" },
    { id: 9, name: "Prime Video" },
    { id: 337, name: "Disney+" },
    { id: 1899, name: "Max" },
    { id: 15, name: "Hulu" },
    { id: 2, name: "Apple TV" },
    { id: 531, name: "Paramount+" },
    { id: 386, name: "Peacock" },
  ];

  const STATUS_META = {
    "queued": { label: "Queued", cls: "status-queued" },
    "searching": { label: "Searching…", cls: "status-searching" },
    "downloading": { label: "Downloading…", cls: "status-downloading" },
    "complete": { label: "Ready", cls: "status-complete" },
    "no qualifying results": { label: "No matches found", cls: "status-nomatch" },
    "insufficient free space": { label: "Not enough space", cls: "status-nospace" },
    "failed": { label: "Failed", cls: "status-failed" },
  };
  const NON_TERMINAL = new Set(["queued", "searching", "downloading"]);

  function statusMeta(status) {
    return STATUS_META[status] || { label: status, cls: "status-queued" };
  }

  function statusPillHtml(status) {
    const m = statusMeta(status);
    return `<span class="status-pill ${m.cls}"><span class="status-dot ${m.cls}"></span>${m.label}</span>`;
  }

  function posterUrl(path) {
    return path ? IMG_BASE + POSTER_SIZE + path : PLACEHOLDER_POSTER;
  }
  function backdropUrl(path) {
    return path ? IMG_BASE + BACKDROP_SIZE + path : "";
  }
  function yearOf(dateStr) {
    return dateStr && dateStr.length >= 4 ? dateStr.slice(0, 4) : "";
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  // -- API --

  async function api(path, opts) {
    const res = await fetch(path, opts);
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      const err = new Error(detail);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }
  const getDiscoverPopular = (page) => api(`/api/discover/popular?page=${page || 1}`);
  const getDiscoverTrending = () => api(`/api/discover/trending`);
  const getDiscoverProviders = () => api(`/api/discover/providers`);
  const getDiscoverByProvider = (id, page) => api(`/api/discover/providers/${id}?page=${page || 1}`);
  const getMovie = (id) => api(`/api/movies/${id}`);
  const postSearch = (query) => api(`/api/search`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }),
  });
  const listRequests = () => api(`/api/requests`);
  const createRequest = (tmdb_id, query) => api(`/api/requests`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tmdb_id, query: query || null }),
  });
  const getRequest = (id) => api(`/api/requests/${id}`);

  // -- Rendering helpers --

  function posterCard(movie) {
    const title = escapeHtml(movie.title || movie.original_title || "Untitled");
    return `<a class="poster-card" href="#/movie/${movie.id}">
      <img src="${posterUrl(movie.poster_path)}" alt="" loading="lazy">
      <div class="cap">${title}</div>
    </a>`;
  }

  function loadingHtml() { return `<div class="loading"><div class="spinner"></div></div>`; }
  function errorHtml(msg, retryHash) {
    return `<div class="error">Couldn't load that.<br>${escapeHtml(msg || "")}
      <br><a class="retry" href="${retryHash || "#/home"}" onclick="location.reload()">Retry</a></div>`;
  }
  function emptyHtml(msg) { return `<div class="empty">${escapeHtml(msg)}</div>`; }

  // -- Router --

  const app = document.getElementById("app");
  const pageTitle = document.getElementById("pageTitle");
  const backBtn = document.getElementById("backBtn");
  let activePollTimer = null;

  function stopPolling() {
    if (activePollTimer) { clearInterval(activePollTimer); activePollTimer = null; }
  }

  function setChrome({ title, showBack, activeTab }) {
    pageTitle.textContent = title;
    backBtn.style.display = showBack ? "" : "none";
    document.querySelectorAll(".tab").forEach((t) => {
      t.classList.toggle("active", t.dataset.tab === activeTab);
    });
  }

  function navigate(hash) { window.location.hash = hash; }
  backBtn.addEventListener("click", () => window.history.back());

  document.querySelectorAll(".tab").forEach((t) => {
    t.addEventListener("click", () => navigate(t.dataset.tab === "home" ? "#/home" : "#/requests"));
  });

  const routes = [
    { re: /^#\/home$/, handler: renderHome },
    { re: /^#\/requests$/, handler: renderRequests },
    { re: /^#\/movie\/(\d+)$/, handler: (m) => renderMovie(m[1]) },
    { re: /^#\/provider\/(\d+)\/(.*)$/, handler: (m) => renderProvider(m[1], decodeURIComponent(m[2])) },
    { re: /^#\/search\/(.*)$/, handler: (m) => renderSearch(decodeURIComponent(m[1])) },
  ];

  function route() {
    stopPolling();
    const hash = window.location.hash || "#/home";
    for (const r of routes) {
      const m = hash.match(r.re);
      if (m) { r.handler(m); return; }
    }
    navigate("#/home");
  }
  window.addEventListener("hashchange", route);

  // -- Views --

  async function renderHome() {
    setChrome({ title: "The Family Downloader", showBack: false, activeTab: "home" });
    app.innerHTML = loadingHtml();
    try {
      const [trending, popular, providers] = await Promise.all([
        getDiscoverTrending(), getDiscoverPopular(1), getDiscoverProviders(),
      ]);
      const providerById = new Map((providers || []).map((p) => [p.provider_id, p]));
      const chips = CURATED_PROVIDERS.map((cp) => {
        const p = providerById.get(cp.id);
        const logo = p && p.logo_path ? IMG_BASE + "w92" + p.logo_path : "";
        return `<a href="#/provider/${cp.id}/${encodeURIComponent(cp.name)}" style="text-align:center">
          <div class="provider-chip">${logo ? `<img src="${logo}" alt="">` : ""}</div>
          <div class="provider-label">${escapeHtml(cp.name)}</div>
        </a>`;
      }).join("");

      app.innerHTML = `
        <section class="row">
          <h2>Trending this week</h2>
          <div class="hscroll">${(trending.results || []).map(posterCard).join("") || emptyHtml("Nothing trending right now.")}</div>
        </section>
        <section class="row">
          <h2>Browse a service</h2>
          <div class="provider-row">${chips}</div>
        </section>
        <section class="row">
          <h2>Popular</h2>
          <div class="grid" id="popularGrid">${(popular.results || []).map(posterCard).join("")}</div>
          ${popular.page < (popular.total_pages || 1) ? `<button class="loadmore" id="popularMore">Load more</button>` : ""}
        </section>
      `;
      let page = popular.page || 1;
      const moreBtn = document.getElementById("popularMore");
      if (moreBtn) {
        moreBtn.addEventListener("click", async () => {
          moreBtn.textContent = "Loading…";
          moreBtn.disabled = true;
          const next = await getDiscoverPopular(page + 1);
          page = next.page;
          document.getElementById("popularGrid").insertAdjacentHTML("beforeend", (next.results || []).map(posterCard).join(""));
          if (page >= (next.total_pages || 1)) moreBtn.remove();
          else { moreBtn.textContent = "Load more"; moreBtn.disabled = false; }
        });
      }
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/home");
    }
  }

  async function renderProvider(id, name) {
    setChrome({ title: name || "Browse", showBack: true, activeTab: "home" });
    app.innerHTML = loadingHtml();
    try {
      const data = await getDiscoverByProvider(id, 1);
      let page = data.page || 1;
      app.innerHTML = `
        <div class="grid" id="providerGrid">${(data.results || []).map(posterCard).join("") || ""}</div>
        ${!data.results || !data.results.length ? emptyHtml("No titles found for this service.") : ""}
        ${data.page < (data.total_pages || 1) ? `<button class="loadmore" id="providerMore">Load more</button>` : ""}
      `;
      const moreBtn = document.getElementById("providerMore");
      if (moreBtn) {
        moreBtn.addEventListener("click", async () => {
          moreBtn.textContent = "Loading…";
          moreBtn.disabled = true;
          const next = await getDiscoverByProvider(id, page + 1);
          page = next.page;
          document.getElementById("providerGrid").insertAdjacentHTML("beforeend", (next.results || []).map(posterCard).join(""));
          if (page >= (next.total_pages || 1)) moreBtn.remove();
          else { moreBtn.textContent = "Load more"; moreBtn.disabled = false; }
        });
      }
    } catch (err) {
      app.innerHTML = errorHtml(err.message);
    }
  }

  async function renderSearch(query) {
    setChrome({ title: `“${query}”`, showBack: true, activeTab: "home" });
    app.innerHTML = loadingHtml();
    try {
      const results = await postSearch(query);
      app.innerHTML = results.length
        ? `<div class="grid">${results.map(posterCard).join("")}</div>`
        : emptyHtml("No movies matched that search.");
    } catch (err) {
      app.innerHTML = errorHtml(err.message);
    }
  }

  async function renderMovie(id) {
    setChrome({ title: "", showBack: true, activeTab: "home" });
    app.innerHTML = loadingHtml();
    try {
      const movie = await getMovie(id);
      pageTitle.textContent = movie.title || movie.original_title || "";
      const genres = (movie.genres || []).map((g) => `<span class="genre-pill">${escapeHtml(g.name)}</span>`).join("");
      const runtime = movie.runtime ? `${Math.floor(movie.runtime / 60)}h ${movie.runtime % 60}m` : "";
      const meta = [yearOf(movie.release_date), runtime].filter(Boolean).join(" · ");
      const backdrop = backdropUrl(movie.backdrop_path);

      app.innerHTML = `
        ${backdrop ? `<img class="detail-backdrop" src="${backdrop}" alt="">` : ""}
        <div class="detail-head" style="${backdrop ? "" : "margin-top:0"}">
          <img class="detail-poster" src="${posterUrl(movie.poster_path)}" alt="">
          <div class="detail-info">
            <h1>${escapeHtml(movie.title || movie.original_title)}</h1>
            <div class="detail-meta">${escapeHtml(meta)}</div>
          </div>
        </div>
        ${genres ? `<div class="genre-pills">${genres}</div>` : ""}
        <div class="detail-overview">${escapeHtml(movie.overview) || "<em>No synopsis available.</em>"}</div>
        <button class="add-btn" id="addBtn">Add to Plex</button>
        <div id="addResult"></div>
      `;

      document.getElementById("addBtn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "Adding…";
        const resultBox = document.getElementById("addResult");
        try {
          const req = await createRequest(Number(id), movie.title);
          btn.textContent = "Added";
          resultBox.innerHTML = `<div class="add-confirm" id="addConfirm">
            ${statusPillHtml(req.status)}
            <span>We'll grab the best copy automatically.</span>
          </div>`;
          const poll = setInterval(async () => {
            try {
              const updated = await getRequest(req.id);
              document.getElementById("addConfirm").innerHTML =
                `${statusPillHtml(updated.status)}<span>${statusFollowupText(updated)}</span>`;
              if (!NON_TERMINAL.has(updated.status)) clearInterval(poll);
            } catch (e) { clearInterval(poll); }
          }, 4000);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Add to Plex";
          resultBox.innerHTML = `<div class="add-confirm">Couldn't add that: ${escapeHtml(err.message)}</div>`;
        }
      });
    } catch (err) {
      app.innerHTML = errorHtml(err.message);
    }
  }

  function statusFollowupText(req) {
    switch (req.status) {
      case "downloading": return "It's on its way — check My Requests for progress.";
      case "complete": return "Done — it should show up in Plex shortly.";
      case "no qualifying results": return "Nothing that meets our quality bar was found.";
      case "insufficient free space": return "Found a match, but there's not enough space to add it.";
      case "failed": return "Something went wrong — see My Requests.";
      default: return "We'll grab the best copy automatically.";
    }
  }

  async function renderRequests() {
    setChrome({ title: "My Requests", showBack: false, activeTab: "requests" });
    app.innerHTML = loadingHtml();
    await loadRequests();
    activePollTimer = setInterval(loadRequests, 5000);
  }

  async function loadRequests() {
    try {
      const rows = await listRequests();
      if (!rows.length) { app.innerHTML = emptyHtml("Nothing requested yet — find a movie and tap Add to Plex."); return; }
      app.innerHTML = rows.map((r) => `
        <div class="req-row">
          <div class="req-main">
            <div class="req-title">${escapeHtml(r.title)}${r.release_year ? ` (${r.release_year})` : ""}</div>
            <div class="req-sub">${new Date(r.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</div>
          </div>
          ${statusPillHtml(r.status)}
        </div>
      `).join("");
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/requests");
    }
  }

  // -- Search bar toggle --

  const searchToggle = document.getElementById("searchToggle");
  const searchBar = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  searchToggle.addEventListener("click", () => {
    searchBar.classList.toggle("open");
    if (searchBar.classList.contains("open")) searchInput.focus();
  });
  function submitSearch() {
    if (searchInput.value.trim()) navigate(`#/search/${encodeURIComponent(searchInput.value.trim())}`);
  }
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSearch(); });
  // type="search" also fires a native "search" event on Enter/the clear-x —
  // catches it even if a keydown listener alone doesn't (e.g. Safari's own
  // handling of the field's built-in submit affordance).
  searchInput.addEventListener("search", submitSearch);

  route();
})();
</script>
</body>
</html>
