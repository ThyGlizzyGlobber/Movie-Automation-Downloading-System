      try { detail = (await res.json()).detail || detail; } catch (e) {}
      const err = new Error(detail);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }
  const getDiscoverPopular = (page) => api(`/api/discover/popular?page=${page || 1}`);
  const getDiscoverTrending = (page) => api(`/api/discover/trending?page=${page || 1}`);
  const getDiscoverByProvider = (id, page) => api(`/api/discover/providers/${id}?page=${page || 1}`);
  const getDiscoverByGenre = (id, page) => api(`/api/discover/genre/${id}?page=${page || 1}`);
  const getComingSoon = (page) => api(`/api/discover/coming-soon?page=${page || 1}`);
  const getMovie = (id) => api(`/api/movies/${id}`);
  const getMovieTrailer = (id) => api(`/api/movies/${id}/trailer`);
  const getPerson = (id) => api(`/api/person/${id}`);
  const postSearch = (query, providerId) => api(`/api/search`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, provider_id: providerId || null }),
  });

  // -- Stage 14: TV browse + subscription surface --
  const getTvDiscoverPopular = (page) => api(`/api/tv/discover/popular?page=${page || 1}`);
  const getTvDiscoverTrending = (page) => api(`/api/tv/discover/trending?page=${page || 1}`);
  const getTvDiscoverByProvider = (id, page) => api(`/api/tv/discover/providers/${id}?page=${page || 1}`);
  const getTvDiscoverByGenre = (id, page) => api(`/api/tv/discover/genre/${id}?page=${page || 1}`);
  const getTvComingSoon = (page) => api(`/api/tv/discover/coming-soon?page=${page || 1}`);
  const getTvShow = (id) => api(`/api/tv/${id}`);
  const getTvTrailer = (id) => api(`/api/tv/${id}/trailer`);
  const postSearchTv = (query, providerId) => api(`/api/tv/search`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, provider_id: providerId || null }),
  });
  const listShows = (status) => api(`/api/shows${status ? `?status=${status}` : ""}`);
  const createShow = (tmdb_id) => api(`/api/shows`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tmdb_id }),
  });
  const pauseShow = (id) => api(`/api/shows/${id}/pause`, { method: "POST" });
  const resumeShow = (id) => api(`/api/shows/${id}/resume`, { method: "POST" });
  const deleteShow = (id) => api(`/api/shows/${id}`, { method: "DELETE" });
  // Keyed by tmdb_id (not the local show id) — works whether or not the
  // show has ever been subscribed; the backend creates a paused show
  // record behind the scenes on first use if one doesn't exist yet.
  const bulkDownload = (tmdbId, body) => api(`/api/tv/${tmdbId}/bulk-download`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });

  const listRequests = () => api(`/api/requests`);
  const createRequest = (tmdb_id, query) => api(`/api/requests`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tmdb_id, query: query || null }),
  });
  const getRequest = (id) => api(`/api/requests/${id}`);
  const cancelRequest = (id) => api(`/api/requests/${id}/cancel`, { method: "POST" });
  const clearRequests = () => api(`/api/requests/clear`, { method: "POST" });
  const getRetention = () => api(`/api/settings/retention`);
  const setRetention = (days) => api(`/api/settings/retention`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days }),
  });
  const getStorage = () => api(`/api/storage`);
  const startPlexLink = () => api(`/api/plex/link`, { method: "POST" });
  const getPlexStatus = () => api(`/api/plex/status`);
  const unlinkPlex = () => api(`/api/plex/unlink`, { method: "POST" });
  const getPipelineSettings = () => api(`/api/settings/pipeline`);
  const setPipelineSettings = (body) => api(`/api/settings/pipeline`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const getTvSettings = () => api(`/api/settings/tv`);
  const setTvSettings = (body) => api(`/api/settings/tv`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const postDeploy = () => api(`/api/admin/deploy`, { method: "POST" });

  // -- Rendering helpers --

  // mediaType: "movie" (default) or "tv" — picks the title/date field and
  // the detail-page link target. Wraps the poster in .poster-art so the
  // "On Plex" badge (Stage 14) can sit pinned to its bottom edge, and so
  // the desktop hover-lift affects only the artwork, not the caption.
  function posterCard(item, mediaType) {
    const isTv = mediaType === "tv";
    const title = escapeHtml(item.title || item.name || item.original_title || item.original_name || "Untitled");
    const href = isTv ? `#/tv/${item.id}` : `#/movies/${item.id}`;
    return `<a class="poster-card" href="${href}">
      <div class="poster-art">
        <img src="${posterUrl(item.poster_path)}" alt="" loading="lazy">
        ${item.on_plex ? `<div class="on-plex-badge">On Plex</div>` : ""}
      </div>
      <div class="cap">${title}</div>
    </a>`;
  }

  // Tags each item of a discover-shaped {results:[...]} response with its
  // media type — mixed Home rows combine a movie call + a TV call whose
  // raw TMDB items don't self-describe which one they are, and
  // posterCard takes mediaType as a plain function arg, not derived from
  // the item itself.
  function tagMediaType(items, mediaType) {
    return items.map((it) => ({ ...it, __mediaType: mediaType }));
  }

  // Wraps any .hscroll's inner content with the desktop-only hover
  // click-to-scroll arrows (see .hscroll-wrap/.hscroll-arrow CSS and the
  // delegated click handler below) — shared by every horizontally
  // scrolling row in the app (poster rows, the cast-photos row on detail
  // pages), so a new row type gets this for free just by using it.
  function hscrollHtml(innerHtml) {
    // Starts with .at-start already applied — every row genuinely does
    // start at scrollLeft 0 on first render, so there's no flash of a
    // wrongly-visible left arrow before the scroll listener below has had
    // a chance to run.
    return `<div class="hscroll-wrap at-start">
      <div class="hscroll">${innerHtml}</div>
      <button class="hscroll-arrow hscroll-arrow-left" aria-label="Scroll left" data-scroll-dir="-1"><span class="material-symbols-rounded">chevron_left</span></button>
      <button class="hscroll-arrow hscroll-arrow-right" aria-label="Scroll right" data-scroll-dir="1"><span class="material-symbols-rounded">chevron_right</span></button>
    </div>`;
  }

  // Netflix/Prime-style horizontal row. Wraps posterCard output in the
  // existing section.row/.hscroll shells — mediaType is either a fixed
  // string ("movie"/"tv") for a same-type row, or a function (item) =>
  // "movie"|"tv" for a mixed row (used with tagMediaType'd items).
  // expandHref, when given, turns the title into a link to a dedicated
  // full-list page for that one category (Prime-Video-style "click a row
  // title to see more") — a trailing arrow plus the accent color marks
  // it as clickable, since a plain <h2> alone doesn't read as tappable.
  function rowHtml(title, items, mediaType, expandHref) {
    if (!items || !items.length) return "";
    const cards = items
      .map((it) => posterCard(it, typeof mediaType === "function" ? mediaType(it) : mediaType))
      .join("");
    const heading = expandHref
      ? `<a class="row-title" href="${expandHref}">${escapeHtml(title)}<span class="row-title-arrow">→</span></a>`
      : `<h2>${escapeHtml(title)}</h2>`;
    return `<section class="row">${heading}${hscrollHtml(cards)}</section>`;
  }

  // Simplified hero for curated landing pages (Home, Movies, TV) — reuses
  // .hero/.hero-content/backdropUrl() verbatim, the same shape
  // renderMovie/renderShow use for their detail-page hero, just without
  // the poster/season/subscribe controls: title, a short overview, one
  // "More Info" link into the detail route.
  function homeHeroHtml(item, mediaType) {
    if (!item) return "";
    const isTv = mediaType === "tv";
    const title = escapeHtml(item.title || item.name || item.original_title || item.original_name || "");
    const backdrop = backdropUrl(item.backdrop_path);
    const raw = item.overview || "";
    const overview = raw.length > 220 ? raw.slice(0, 220).trim() + "…" : raw;
    const href = isTv ? `#/tv/${item.id}` : `#/movies/${item.id}`;
    return `<div class="hero" style="${backdrop ? `background-image:url('${backdrop}')` : ""}">
      <div class="hero-content">
        <div class="detail-info">
          <h1>${title}</h1>
          <div class="detail-overview">${escapeHtml(overview)}</div>
          <div class="hero-actions" style="margin-top:14px">
            <a class="add-btn" href="${href}">More Info</a>
          </div>
        </div>
      </div>
    </div>`;
  }

  // -- Home hero carousel (Prime-Video-storefront style): several
  //    trending items, only the front couple ever carrying a background
  //    trailer video, cycling with dots/arrows/autoplay. Separate from
  //    homeHeroHtml above, which the Movies/TV landing pages still use
  //    unchanged (a single static-backdrop hero, no carousel). --

  const HERO_SLIDE_COUNT = 5;
  const HERO_TRAILER_COUNT = 2; // only the front slides ever get a background video
  const HERO_AUTOPLAY_MS = 7000; // flat dwell time for a poster-only slide (no trailer)
  // How long a trailer slide's poster shows on its own — both before the
  // trailer starts (a deliberate lead-in, not an instant cut) and again
  // after it finishes (before actually advancing to the next slide).
  const HERO_POSTER_LEAD_MS = 3000;
  const HERO_CERT_REGION = "AU";

  function homeHeroBadgeHtml(text) {
    return `<div class="home-hero-badge"><span class="material-symbols-rounded">campaign</span>${escapeHtml(text)}</div>`;
  }

  // TMDB's list/trending endpoints carry neither a TV show's
  // next_episode_to_air/last_episode_to_air nor either media type's
  // region-specific certification — only the full per-title detail call
  // does (same reason fetchEnrichedWatchingShows already does this exact
  // per-show fetch for the Watching rows elsewhere on this page) — so
  // both of these read from the enriched `detail` object wireHomeHero
  // fetches per slide, never the raw trending-list item.
  function tvHeroBadgeHtml(show) {
    const next = show.next_episode_to_air;
    if (next && next.air_date) {
      const day = new Date(`${next.air_date}T00:00:00`).toLocaleDateString(undefined, { weekday: "long" });
      return homeHeroBadgeHtml(`New episode ${day}`);
    }
    if (show.last_episode_to_air) return homeHeroBadgeHtml("All episodes available");
    return "";
  }

  function movieHeroBadgeHtml(movie) {
    if (movie.is_coming_soon) return homeHeroBadgeHtml("Coming Soon");
    if (movie.release_date) {
      const ageDays = (Date.now() - new Date(`${movie.release_date}T00:00:00`).getTime()) / 86400000;
      if (ageDays >= 0 && ageDays <= 30) return homeHeroBadgeHtml("Newly Released");
    }
    return "";
  }

  function tvCertOf(show) {
    return (show.content_ratings?.results || []).find((r) => r.iso_3166_1 === HERO_CERT_REGION)?.rating || "";
  }

  function movieCertOf(movie) {
    const entry = (movie.release_dates?.results || []).find((r) => r.iso_3166_1 === HERO_CERT_REGION);
    const withCert = (entry?.release_dates || []).find((rd) => rd.certification);
    return withCert ? withCert.certification : "";
  }

  function homeHeroSlideHtml(item, index) {
    const isTv = item.__mediaType === "tv";
    const title = escapeHtml(item.title || item.name || item.original_title || item.original_name || "");
    const backdrop = backdropUrl(item.backdrop_path);
    const href = isTv ? `#/tv/${item.id}` : `#/movies/${item.id}`;
    // "Watch on Plex" navigates into this same app's own detail page
    // (not a direct Plex deep link — this app only ever tracks a
    // title/year match against the Plex library, not a specific Plex
    // ratingKey to link straight into playback with); "Add to Plex"
    // does the same, landing on the exact button that actually adds it
    // rather than duplicating that whole add/subscribe flow (polling,
    // retry, disabled-while-coming-soon) a second time inside a
    // carousel slide that can auto-advance out from under it.
    const onPlex = !!item.on_plex;
    const ctaIcon = onPlex ? "play_arrow" : "add";
    const ctaLabel = onPlex ? "Watch on Plex" : "Add to Plex";
    return `<div class="home-hero-slide${index === 0 ? " active" : ""}" data-index="${index}">
      <div class="home-hero-media">
        <img src="${backdrop}" alt="" loading="${index === 0 ? "eager" : "lazy"}">
        <div class="home-hero-video-wrap" id="heroVideoWrap${index}"></div>
      </div>
      <div class="home-hero-fade"></div>
      <div class="home-hero-content">
        <div class="home-hero-info">
          <div id="heroBadge${index}"></div>
          <h1>${title}</h1>
          <div class="home-hero-actions">
            <a class="add-btn" href="${href}"><span class="material-symbols-rounded">${ctaIcon}</span>${ctaLabel}</a>
            <a class="home-hero-info-btn" href="${href}" aria-label="More info"><span class="material-symbols-rounded">info</span></a>
            <span class="home-hero-mute-slot" id="heroMuteSlot${index}"></span>
          </div>
        </div>
      </div>
      <div class="home-hero-cert" id="heroCert${index}"></div>
    </div>`;
  }

  function homeHeroCarouselHtml(items) {
    if (!items.length) return "";
    return `<div class="home-hero" id="homeHero">
      ${items.map((it, i) => homeHeroSlideHtml(it, i)).join("")}
      <button class="home-hero-mute-btn" id="heroMuteBtn" aria-label="Unmute trailer" hidden>
        <span class="material-symbols-rounded">volume_off</span>
      </button>
      ${items.length > 1 ? `
        <button class="home-hero-arrow home-hero-arrow-left" data-dir="-1" aria-label="Previous slide"><span class="material-symbols-rounded">chevron_left</span></button>
        <button class="home-hero-arrow home-hero-arrow-right" data-dir="1" aria-label="Next slide"><span class="material-symbols-rounded">chevron_right</span></button>
        <div class="home-hero-dots">
          ${items.map((_, i) => `<button class="home-hero-dot${i === 0 ? " active" : ""}" data-index="${i}" aria-label="Slide ${i + 1}"></button>`).join("")}
        </div>
      ` : ""}
    </div>`;
  }

  // Wires arrows/dots/autoplay/mute, then progressively enhances the
  // hero with per-slide data fetched after the initial paint so none of
  // it ever blocks the hero from showing immediately with its poster:
  // a background trailer for the front couple of slides, and (every
  // slide, not just those) a status badge plus an AU age-rating pill.
  function wireHomeHero(items) {
    if (!items.length) return;
    const heroEl = document.getElementById("homeHero");
    if (!heroEl) return;
    let index = 0;
    // Plain <video> elements (indices 0/1, matching HERO_TRAILER_COUNT),
    // self-hosted from our own trailer cache rather than a YouTube
    // iframe — see trailers.py's docstring for why. Created as soon as
    // each trailer's URL resolves (so the file starts buffering right
    // away), but never autoplaying on its own — playback is entirely
    // driven by scheduleAdvance() below, gated on the slide actually
    // being the active one (per direct request: a background slide's
    // trailer must not be playing at all, muted or not, until the user
    // is actually looking at it — previously every eligible slide's
    // video started autoplaying the instant the page loaded, so by the
    // time the user reached slide 2 its trailer was already most of the
    // way through). A native <video>'s own `muted` property is
    // synchronous and always accurate, so there's no separate mute-state
    // flag and no stale-icon race: every video is muted the instant it's
    // created and every time a slide becomes active again, regardless of
    // whatever an earlier visit to it left behind (per earlier explicit
    // request: always muted by default, never carried over between
    // titles in the carousel).
    const heroVideos = [];
    const muteBtn = document.getElementById("heroMuteBtn");

    function posterOf(i) {
      return heroEl.querySelector(`.home-hero-slide[data-index="${i}"] img`);
    }

    // Only ever shows/enables the mute button for a slide that actually
    // has a trailer video.
    function setMuteButtonIcon(muted) {
      muteBtn.querySelector(".material-symbols-rounded").textContent = muted ? "volume_off" : "volume_up";
      muteBtn.setAttribute("aria-label", muted ? "Unmute trailer" : "Mute trailer");
    }
    function refreshMuteButton() {
      // Only one mute button ever exists — reparented into whichever
      // slide is currently active's own slot (right after its info
      // button) rather than duplicated per slide, since there's only
      // ever one slide's audio to control at a time anyway.
      const slot = document.getElementById(`heroMuteSlot${index}`);
      if (slot && muteBtn.parentElement !== slot) slot.appendChild(muteBtn);
      const video = heroVideos[index];
      if (!video) { muteBtn.hidden = true; return; }
      muteBtn.hidden = false;
      setMuteButtonIcon(video.muted);
    }
    muteBtn.addEventListener("click", () => {
      const video = heroVideos[index];
      if (!video) return;
      video.muted = !video.muted;
      setMuteButtonIcon(video.muted);
    });

    function showSlide(newIndex) {
      index = ((newIndex % items.length) + items.length) % items.length;
      heroEl.querySelectorAll(".home-hero-slide").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
      heroEl.querySelectorAll(".home-hero-dot").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
      // Defensive, not just cosmetic: a background trailer (pre-loaded
      // but not currently shown) must never be the one making sound,
      // and the slide becoming active always starts muted too — see the
      // no-carried-over-mute-state note above.
      heroVideos.forEach((video, i) => { if (video && i !== index) video.muted = true; });
      const activeVideo = heroVideos[index];
      if (activeVideo) activeVideo.muted = true;
      refreshMuteButton();
    }

    // A slide being left behind — whether by autoplay advancing past it
    // or a manual arrow/dot click — always pauses its trailer and rewinds
    // it to the start, and makes sure its poster is showing again. Per
    // direct request: coming back to a slide later should replay its
    // trailer from the beginning, never resume wherever it happened to
    // be left off.
    function deactivateSlide(i) {
      const video = heroVideos[i];
      if (!video) return;
      video.pause();
      video.currentTime = 0;
    }

    // Advance timing: a flat HERO_AUTOPLAY_MS timer for a poster-only
    // slide. A slide with a trailer follows a fixed sequence instead —
    // poster alone for HERO_POSTER_LEAD_MS, then the trailer plays all
    // the way through *once* (no loop) before the poster reappears for
    // another HERO_POSTER_LEAD_MS and the carousel actually advances.
    // Poster visibility itself is driven by the video's own persistent
    // event listeners below (hidePoster/revealPoster), not by this
    // function directly — this only decides *when* to call play() and
    // *when* a finished trailer should lead to the next slide.
    // `scheduleToken` invalidates any in-flight timer/listener from a
    // previous call (a manual arrow/dot click, hover pause/resume, or
    // the active slide's trailer only just finishing its fetch) so a
    // stale continuation becomes a harmless no-op instead of firing late.
    let scheduleToken = 0;
    function clearSchedule() {
      if (activePollTimer) { clearTimeout(activePollTimer); activePollTimer = null; }
    }
    function scheduleAdvance() {
      clearSchedule();
      const token = ++scheduleToken;
      if (items.length <= 1) return;
      const advance = () => {
        if (token !== scheduleToken) return;
        const leavingIndex = index;
        showSlide(index + 1);
        deactivateSlide(leavingIndex);
        scheduleAdvance();
      };
      const video = heroVideos[index];
      if (!video) { activePollTimer = setTimeout(advance, HERO_AUTOPLAY_MS); return; }
      activePollTimer = setTimeout(() => {
        if (token !== scheduleToken) return;
        video.currentTime = 0;
        video.play().catch(() => {});
        video.addEventListener("ended", function onEnded() {
          video.removeEventListener("ended", onEnded);
          if (token !== scheduleToken) return;
          activePollTimer = setTimeout(advance, HERO_POSTER_LEAD_MS);
        });
      }, HERO_POSTER_LEAD_MS);
    }

    function goToSlide(newIndex) {
      const leavingIndex = index;
      showSlide(newIndex);
      if (leavingIndex !== index) deactivateSlide(leavingIndex);
      scheduleAdvance();
    }
    heroEl.querySelectorAll(".home-hero-arrow").forEach((btn) => btn.addEventListener("click", () => {
      goToSlide(index + Number(btn.dataset.dir));
    }));
    heroEl.querySelectorAll(".home-hero-dot").forEach((btn) => btn.addEventListener("click", () => {
      goToSlide(Number(btn.dataset.index));
    }));
    heroEl.addEventListener("mouseenter", () => { scheduleToken++; clearSchedule(); });
    heroEl.addEventListener("mouseleave", scheduleAdvance);
    scheduleAdvance();

    items.slice(0, HERO_TRAILER_COUNT).forEach(async (item, i) => {
      const isTv = item.__mediaType === "tv";
      try {
        const { url } = isTv ? await getTvTrailer(item.id) : await getMovieTrailer(item.id);
        if (!url) return;
        const wrap = document.getElementById(`heroVideoWrap${i}`);
        if (!wrap) return;
        const poster = posterOf(i);
        const video = document.createElement("video");
        video.src = url;
        video.muted = true;
        video.loop = false; // plays through once per activation — see scheduleAdvance
        video.playsInline = true;
        video.preload = "auto"; // starts buffering now even though play() is gated on activation
        video.setAttribute("aria-hidden", "true");
        // Self-hosted, chromeless <video> — no YouTube iframe, so none
        // of the old end-of-clip Cards-overlay/watermark workarounds are
        // needed. Poster visibility mirrors genuine playback state via
        // these persistent listeners, independent of whatever triggered
        // play()/pause() (scheduleAdvance's own timers, deactivateSlide,
        // a real network stall) — "waiting" fires on any buffer refill,
        // including a brief, normal blip mid-playback over a real
        // network, not just a genuine stall, so revealing the poster
        // (which spans the full hero, not just the video's own box) for
        // something that resolves in well under a second read as a
        // bright flash next to the video rather than a helpful fallback
        // — confirmed live. So a stall only actually reveals it if still
        // ongoing half a second later; "playing" cancels that pending
        // reveal immediately since it means real playback resumed.
        // "pause" (which also fires right before "ended", per spec) and
        // "error" are terminal enough to reveal right away.
        let posterRevealTimer = null;
        function clearPosterRevealTimer() {
          if (posterRevealTimer) { clearTimeout(posterRevealTimer); posterRevealTimer = null; }
        }
        function hidePoster() {
          clearPosterRevealTimer();
          if (poster) poster.classList.add("home-hero-poster-hidden");
          video.classList.add("home-hero-video-visible");
        }
        function revealPoster() {
          clearPosterRevealTimer();
          if (poster) poster.classList.remove("home-hero-poster-hidden");
          video.classList.remove("home-hero-video-visible");
        }
        function revealPosterAfterStall() {
          if (posterRevealTimer) return;
          posterRevealTimer = setTimeout(() => { posterRevealTimer = null; revealPoster(); }, 500);
        }
        video.addEventListener("playing", hidePoster);
        video.addEventListener("pause", revealPoster);
        video.addEventListener("waiting", revealPosterAfterStall);
        video.addEventListener("error", revealPoster);
        wrap.appendChild(video);
        const slideEl = heroEl.querySelector(`.home-hero-slide[data-index="${i}"]`);
        if (slideEl) slideEl.classList.add("home-hero-has-video");
        heroVideos[i] = video;
        // If this is the currently-active slide, upgrade its schedule
        // from the initial poster-only guess (the trailer fetch is async
        // and hadn't resolved yet when scheduleAdvance() first ran) to
        // the real lead-in/play-through/hold sequence now that a video
        // actually exists.
        if (i === index) { refreshMuteButton(); scheduleAdvance(); }
      } catch (err) { /* no trailer on file — the poster stays as the slide's art */ }
    });

    items.forEach(async (item, i) => {
      const isTv = item.__mediaType === "tv";
      try {
        const detail = isTv ? await getTvShow(item.id) : await getMovie(item.id);
        const badgeEl = document.getElementById(`heroBadge${i}`);
        if (badgeEl) badgeEl.innerHTML = isTv ? tvHeroBadgeHtml(detail) : movieHeroBadgeHtml(detail);
        const certEl = document.getElementById(`heroCert${i}`);
        const cert = isTv ? tvCertOf(detail) : movieCertOf(detail);
        if (certEl && cert) certEl.textContent = cert;
      } catch (err) { /* badge/cert just stay empty */ }
    });
  }

  function loadingHtml() { return `<div class="loading"><div class="spinner"></div></div>`; }
  function errorHtml(msg, retryHash) {
    return `<div class="error">Couldn't load that.<br>${escapeHtml(msg || "")}
      <br><a class="retry" href="${retryHash || "#/movies"}" onclick="location.reload()">Retry</a></div>`;
  }
  function emptyHtml(msg) { return `<div class="empty">${escapeHtml(msg)}</div>`; }

  // -- Router --

  const app = document.getElementById("app");
  let activePollTimer = null;
  // Which show groups are expanded on the Requests page — a plain Set
  // rather than per-row DOM state, since loadRequests() rebuilds the
  // whole list's innerHTML on every 5s poll and would otherwise silently
  // re-collapse anything the user had opened. Reset fresh each time
  // renderRequests() itself is entered (a new visit to the page).
  let requestsExpandedGroups = new Set();

  function stopPolling() {
    // setInterval (Requests list) and setTimeout (Settings' Plex-link
    // poll) share the same handle namespace in every major browser, so
    // clearing both is a safe no-op for whichever one wasn't actually used.
    if (activePollTimer) { clearInterval(activePollTimer); clearTimeout(activePollTimer); activePollTimer = null; }
  }

  // The search bar lives permanently in the top bar now (not a toggled
  // row), so there's no on-screen title left to set — `title` still
  // updates the browser tab/PWA title instead.
  function setChrome({ title, activeTab, hasHero }) {
    document.title = title ? `${title} — Smithflix` : "Smithflix";
    document.querySelectorAll(".tab, .top-nav-link").forEach((t) => {
      t.classList.toggle("active", t.dataset.tab === activeTab);
    });
    // Only #topbar itself reads this now (the see-through gradient scrim
    // vs. the plain blurred bar) — main's own padding is unconditional
    // regardless of hasHero, see main's CSS.
    document.body.classList.toggle("has-hero", !!hasHero);
  }

  // #topbar is fixed (see its CSS) so it no longer reserves space in
  // normal flow — main's own top padding stands in for that space instead,
  // so it has to track the topbar's real rendered height rather than a
  // guessed constant. Re-measured on resize
  // and once fonts finish loading, since the wordmark/search input's
  // fallback-vs-loaded-font line height can shift it by a few px.
  const topbarEl = document.getElementById("topbar");
  function updateTopbarHeight() {
    document.documentElement.style.setProperty("--topbar-h", `${topbarEl.offsetHeight}px`);
  }
  updateTopbarHeight();
  window.addEventListener("resize", updateTopbarHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateTopbarHeight);

  // .scrolled fades the header in to a flatter, more opaque fill (see
  // body.has-hero.scrolled #topbar) as soon as the page scrolls at
  // all, including while still over the hero itself — per direct
  // request, replacing an earlier version that waited until the hero
  // had scrolled up far enough to no longer reach the header at all
  // (a hero.getBoundingClientRect() check). A small threshold, not a
  // flat scrollY>0, avoids flickering the state on trackpad rubber-
  // banding right at the top. Toggling this on a hero-less page is
  // harmless — nothing but the has-hero variants above key off it.
  function updateTopbarScrolled() {
    document.body.classList.toggle("scrolled", window.scrollY > 4);
  }
  window.addEventListener("scroll", updateTopbarScrolled, { passive: true });
  window.addEventListener("hashchange", () => setTimeout(updateTopbarScrolled, 0));

  const SECTION_HASH = { home: "#/home", movies: "#/movies", tv: "#/tv" };
  function navigate(hash) { window.location.hash = hash; }

  document.querySelectorAll(".tab, .top-nav-link").forEach((t) => {
    t.addEventListener("click", () => navigate(SECTION_HASH[t.dataset.tab] || "#/movies"));
  });

  // -- Global downloads FAB (Stage 14.x) — replaces Requests as a nav
  //    item. Polls independently of the per-view activePollTimer (which
  //    stopPolling() clears on every route change) so the badge count
  //    stays live no matter which page is showing. --
  const downloadsFab = document.getElementById("downloadsFab");
  const downloadsBadge = document.getElementById("downloadsBadge");
  downloadsFab.addEventListener("click", () => navigate("#/requests"));
  async function refreshDownloadsBadge() {
    try {
      const rows = await listRequests();
      const active = rows.filter((r) => NON_TERMINAL.has(r.status)).length;
      downloadsBadge.textContent = active > 99 ? "99+" : String(active);
      downloadsBadge.hidden = active === 0;
    } catch (err) { /* a transient fetch failure just leaves the last-known count showing */ }
  }
  refreshDownloadsBadge();
  setInterval(refreshDownloadsBadge, 5000);

  // -- Global storage indicator — same "outside #app, polls
  //    independently of route changes" treatment as the downloads FAB
  //    above. Disk usage moves far slower than the request queue, so this
  //    polls on its own, much longer interval rather than reusing
  //    refreshDownloadsBadge's 5s one. Stays hidden entirely (not just
  //    zeroed) whenever /api/storage reports unavailable — no real mount
  //    is the normal case for local dev, and a broken readout would be
  //    worse than no readout at all. --
  const storageIndicator = document.getElementById("storageIndicator");
  const storageBarFill = document.getElementById("storageBarFill");
  const storagePctLabel = document.getElementById("storagePctLabel");
  async function refreshStorageIndicator() {
    try {
      const s = await getStorage();
      if (!s.available) { storageIndicator.hidden = true; return; }
      storageBarFill.style.width = `${Math.max(0, Math.min(100, s.used_percent))}%`;
      storagePctLabel.textContent = `${Math.round(s.used_percent)}%`;
      storageIndicator.hidden = false;
    } catch (err) { /* a transient fetch failure just leaves the last-known readout showing */ }
  }
  refreshStorageIndicator();
  setInterval(refreshStorageIndicator, 60000);

  // Keeps every row's .at-start class in sync with its own real scroll
  // position (see .hscroll-arrow-left's CSS) — delegated on #app the same
  // way the click handler below is, rather than wired per-row on every
  // render. "scroll" doesn't bubble, but it does fire during the capture
  // phase on ancestors, which is what the trailing `true` is for.
  app.addEventListener("scroll", (e) => {
    const track = e.target;
    if (!track.classList || !track.classList.contains("hscroll")) return;
    const wrap = track.closest(".hscroll-wrap");
    if (wrap) wrap.classList.toggle("at-start", track.scrollLeft <= 2);
  }, true);

  // Delegated once here (rather than re-attached on every view render)
  // since #app itself is never replaced, only its innerHTML — each
  // selector below only ever exists on one particular view, so this is a
  // no-op everywhere else.
  app.addEventListener("click", async (e) => {
    // Row scroll arrows (desktop hover-only, see .hscroll-arrow) — one
    // "page" of the row per click, matching the row's own current width
    // rather than a small nudge. Revolves once it's already at the end:
    // rather than a right arrow that just goes dead, another click loops
    // back to the start (the left arrow is what's hidden at the *other*
    // end — see .at-start — so only this direction needs the wrap-around).
    const scrollArrow = e.target.closest(".hscroll-arrow");
    if (scrollArrow) {
      const track = scrollArrow.parentElement.querySelector(".hscroll");
      if (track) {
        const dir = Number(scrollArrow.dataset.scrollDir);
        const atEnd = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2;
        if (dir > 0 && atEnd) track.scrollTo({ left: 0, behavior: "smooth" });
        else track.scrollBy({ left: dir * track.clientWidth, behavior: "smooth" });
      }
      return;
    }

    // Requests list group header: toggle expand/collapse, unless the
    // click actually landed on the show-title link, which should navigate
    // normally rather than also toggling the row it sits inside of.
    const groupToggle = e.target.closest("[data-toggle-group]");
    if (groupToggle && !e.target.closest("a")) {
      const showId = Number(groupToggle.dataset.toggleGroup);
      if (requestsExpandedGroups.has(showId)) requestsExpandedGroups.delete(showId);
      else requestsExpandedGroups.add(showId);
      await loadRequests();
      return;
    }

    const toggleShowBtn = e.target.closest(".toggle-show-btn");
    if (toggleShowBtn) {
      const showId = toggleShowBtn.dataset.toggleShow;
      const isPaused = toggleShowBtn.dataset.currentStatus === "paused";
      toggleShowBtn.disabled = true;
      try {
        await (isPaused ? resumeShow(showId) : pauseShow(showId));
        await renderWatching();
      } catch (err) {
        alert(`Couldn't update this show: ${err.message}`);
        toggleShowBtn.disabled = false;
      }
      return;
    }

    const unsubBtn = e.target.closest("[data-unsub-show]");
    if (unsubBtn) {
      if (!confirm("Unsubscribe from this show? Its download history stays in Requests.")) return;
      unsubBtn.disabled = true;
      try {
        await deleteShow(unsubBtn.dataset.unsubShow);
        await renderWatching();
      } catch (err) {
        alert(`Couldn't unsubscribe: ${err.message}`);
        unsubBtn.disabled = false;
      }
      return;
    }

    const cancelBtn = e.target.closest(".cancel-btn, .req-delete-btn");
    if (cancelBtn) {
      const isDelete = cancelBtn.classList.contains("req-delete-btn");
      const confirmMsg = cancelBtn.dataset.status === "queued"
        ? "Remove this request from the queue? This can't be undone."
        : "Delete this download and its files from qBittorrent? This can't be undone.";
      if (!confirm(confirmMsg)) return;
      cancelBtn.disabled = true;
      if (!isDelete) cancelBtn.textContent = "Cancelling…";
      try {
        await cancelRequest(cancelBtn.dataset.requestId);
        await loadRequests();
      } catch (err) {
        alert(`Couldn't cancel: ${err.message}`);
        cancelBtn.disabled = false;
        if (!isDelete) cancelBtn.textContent = "Cancel";
      }
      return;
    }

    const menu = document.getElementById("retentionMenu");
    if (!menu) return;
    if (e.target.closest("#retentionMenuBtn")) {
      menu.hidden = !menu.hidden;
      return;
    }
    const option = e.target.closest(".retention-option");
    if (option) {
      const days = option.dataset.days ? Number(option.dataset.days) : null;
      menu.hidden = true;
      try {
        await setRetention(days);
        menu.innerHTML = retentionOptionsHtml(days);
      } catch (err) {
        alert(`Couldn't update auto-clear: ${err.message}`);
      }
      return;
    }
    if (!menu.hidden && !e.target.closest("#retentionMenu")) menu.hidden = true;
  });

  const routes = [
    { re: /^#\/home$/, handler: renderHome },
    { re: /^#\/movies$/, handler: renderMovies },
    { re: /^#\/movies\/trending$/, handler: () => renderCategory("Trending Movies", getDiscoverTrending, "movie") },
    { re: /^#\/movies\/popular$/, handler: () => renderCategory("Popular Movies", getDiscoverPopular, "movie") },
    { re: /^#\/movies\/coming-soon$/, handler: () => renderCategory("New Releases", getComingSoon, "movie") },
    { re: /^#\/movies\/genre\/(\d+)\/(.*)$/, handler: (m) => renderCategory(decodeURIComponent(m[2]), (p) => getDiscoverByGenre(m[1], p), "movie") },
    { re: /^#\/movies\/provider\/(\d+)\/(.*)$/, handler: (m) => renderProvider(m[1], decodeURIComponent(m[2]), "movie") },
    { re: /^#\/movies\/(\d+)$/, handler: (m) => renderMovie(m[1]) },
    { re: /^#\/tv$/, handler: renderTv },
    { re: /^#\/tv\/trending$/, handler: () => renderCategory("Trending TV Shows", getTvDiscoverTrending, "tv") },
    { re: /^#\/tv\/popular$/, handler: () => renderCategory("Popular TV Shows", getTvDiscoverPopular, "tv") },
    { re: /^#\/tv\/coming-soon$/, handler: () => renderCategory("Coming Soon", getTvComingSoon, "tv") },
    { re: /^#\/tv\/genre\/(\d+)\/(.*)$/, handler: (m) => renderCategory(decodeURIComponent(m[2]), (p) => getTvDiscoverByGenre(m[1], p), "tv") },
    { re: /^#\/tv\/watching$/, handler: renderWatching },
    { re: /^#\/tv\/provider\/(\d+)\/(.*)$/, handler: (m) => renderProvider(m[1], decodeURIComponent(m[2]), "tv") },
    { re: /^#\/tv\/(\d+)$/, handler: (m) => renderShow(m[1]) },
    { re: /^#\/person\/(\d+)$/, handler: (m) => renderPerson(m[1]) },
    { re: /^#\/requests$/, handler: renderRequests },
    { re: /^#\/search\/(.*)$/, handler: (m) => renderSearch(decodeURIComponent(m[1])) },
    { re: /^#\/settings$/, handler: renderSettings },
  ];

  function route() {
    stopPolling();
    const hash = window.location.hash || "#/home";
    downloadsFab.hidden = hash.startsWith("#/requests");
    for (const r of routes) {
      const m = hash.match(r.re);
      if (m) { r.handler(m); return; }
    }
    navigate("#/home");
  }
  window.addEventListener("hashchange", route);

  // -- Views --

  // Subscribed-shows rows for Home/TV — listShows() alone doesn't carry
  // poster art or a real "when did this last air" signal, so each show
  // gets enriched with its own already-existing GET /api/tv/{id} detail
  // (poster_path, on_plex, and last_episode_to_air.air_date — real TMDB
  // data, so a show correctly jumps to the front the moment a new
  // episode actually airs, no extra polling/caching needed on this end).
  async function fetchEnrichedWatchingShows() {
    const shows = await listShows();
    return Promise.all(shows.map(async (s) => {
      let detail = {};
      try { detail = await getTvShow(s.tmdb_id); } catch (err) { /* fall through with no poster/air-date */ }
      return {
        id: s.tmdb_id,
        name: s.title,
        poster_path: detail.poster_path || null,
        on_plex: detail.on_plex || false,
        __mediaType: "tv",
        created_at: s.created_at,
        last_air_date: detail.last_episode_to_air?.air_date || null,
      };
    }));
  }

  // "New In Watching" (most recently *aired* episode first — a show with
  // an episode airing today jumps straight to the front) and "Subscribed
  // Shows" (most recently *subscribed* first) — two different orderings
  // of the same subscribed-shows list, both expanding to the existing
  // full Watching page (pause/resume/unsubscribe controls, unchanged).
  function watchingRowsHtml(enrichedShows) {
    const byNewestEpisode = [...enrichedShows].sort(
      (a, b) => (b.last_air_date || "").localeCompare(a.last_air_date || "")
    );
    const bySubscribed = [...enrichedShows].sort(
      (a, b) => (b.created_at || "").localeCompare(a.created_at || "")
    );
    return (
      rowHtml("New In Watching", byNewestEpisode, (it) => it.__mediaType, "#/tv/watching") +
      rowHtml("Subscribed Shows", bySubscribed, (it) => it.__mediaType, "#/tv/watching")
    );
  }

  // The merged Home feed — mixes movies and TV into one curated,
  // row-based landing page, at the user's explicit request, alongside
  // (not instead of) the separate movie-only/TV-only Movies/TV pages
  // below. No subnav — straight into a hero banner + rows.
  async function renderHome() {
    setChrome({ title: "", showBack: false, activeTab: "home", hasHero: true });
    app.innerHTML = loadingHtml();

    // One Promise.all resolves every row's data in parallel; a single
    // loadingHtml() covers the whole wait rather than a progressive
    // per-row reveal — simplest correct option, and every row is a
    // single page (~20 items, no pagination), so the wait is bounded by
    // the slowest of these parallel calls, not a serial chain.
    const jobs = [
      { key: "movieTrending", fn: () => getDiscoverTrending(1) },
      { key: "tvTrending", fn: () => getTvDiscoverTrending(1) },
      { key: "moviePopular", fn: () => getDiscoverPopular(1) },
      { key: "tvPopular", fn: () => getTvDiscoverPopular(1) },
      { key: "comingSoon", fn: () => getComingSoon(1) },
      { key: "watchingShows", fn: fetchEnrichedWatchingShows },
      ...HOME_GENRES.flatMap((g) => [
        { key: `gm-${g.movieId}`, fn: () => getDiscoverByGenre(g.movieId, 1) },
        { key: `gt-${g.tvId}`, fn: () => getTvDiscoverByGenre(g.tvId, 1) },
      ]),
    ];

    try {
      const results = await Promise.all(jobs.map((j) => j.fn()));
      const byKey = {};
      jobs.forEach((j, i) => { byKey[j.key] = results[i]; });

      const mixedTrending = [
        ...tagMediaType(byKey.movieTrending.results || [], "movie"),
        ...tagMediaType(byKey.tvTrending.results || [], "tv"),
      ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0)).slice(0, 20);

      // The hero carousel's own candidates — a title with no backdrop art
      // isn't usable as a hero slide at all, so that filter runs first,
      // before taking the top HERO_SLIDE_COUNT off the front of the same
      // already-popularity-sorted list the Trending Now row below uses.
      const heroItems = mixedTrending.filter((it) => it.backdrop_path).slice(0, HERO_SLIDE_COUNT);

      // Each named genre does a movie call + a TV call, interleaved into
      // one mixed row rather than split into two half-width rows — reads
      // as a single Netflix-style row.
      const genreRows = HOME_GENRES.map((g) => {
        const movieItems = tagMediaType(byKey[`gm-${g.movieId}`].results || [], "movie");
        const tvItems = tagMediaType(byKey[`gt-${g.tvId}`].results || [], "tv");
        const merged = [];
        for (let i = 0; i < Math.max(movieItems.length, tvItems.length); i++) {
          if (movieItems[i]) merged.push(movieItems[i]);
          if (tvItems[i]) merged.push(tvItems[i]);
        }
        return rowHtml(g.label, merged, (it) => it.__mediaType);
      });

      // Unlike the TV page (where the two Watching rows are always
      // pinned to the top), Home scatters them at a random point among
      // the other rows on every load — closer to how Netflix's own
      // "Continue Watching" surfaces among other rows rather than always
      // being the very first thing on the page. Kept as one adjacent
      // pair (not split apart) so the two stay visually associated.
      const contentRows = [
        rowHtml("Trending Now", mixedTrending, (it) => it.__mediaType),
        rowHtml("Popular Movies", byKey.moviePopular.results || [], "movie", "#/movies/popular"),
        rowHtml("Popular TV Shows", byKey.tvPopular.results || [], "tv", "#/tv/popular"),
        rowHtml("New Releases", byKey.comingSoon.results || [], "movie", "#/movies/coming-soon"),
        ...genreRows,
      ].filter(Boolean);

      const watchingBlock = watchingRowsHtml(byKey.watchingShows || []);
      if (watchingBlock) {
        contentRows.splice(Math.floor(Math.random() * (contentRows.length + 1)), 0, watchingBlock);
      }

      app.innerHTML = `
        ${homeHeroCarouselHtml(heroItems)}
        ${contentRows.join("")}
        <section class="row">
          <h2>Browse a Service</h2>
          <div class="provider-row">${providerChipsHtml("#/movies/provider")}</div>
        </section>
      `;
      wireHomeHero(heroItems);
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/home");
    }
  }

  // Shared paginated-grid markup + infinite-scroll wiring — backs Movies'
  // Popular/Trending/Coming Soon, TV's Popular/Trending, and Provider
  // browse, all of which are "fetch a {results, page, total_pages} page,
  // append the next one as the user scrolls" in the exact same shape.
  function gridSectionHtml(gridId, sentinelId, data, mediaType, emptyMessage) {
    const results = data.results || [];
    return `
      <div class="grid" id="${gridId}">${results.map((it) => posterCard(it, mediaType)).join("")}</div>
      ${!results.length && emptyMessage ? emptyHtml(emptyMessage) : ""}
      <div class="grid-sentinel" id="${sentinelId}"><div class="spinner" hidden></div></div>
    `;
  }

  function gridColumnCount(gridEl) {
    // .grid's column count is a fixed 2/5/9 per breakpoint (see its CSS) —
    // reading the resolved grid-template-columns back out here (rather
    // than hardcoding the same breakpoint logic a second time in JS) keeps
    // this in sync with that CSS automatically if the breakpoints change.
    const tracks = getComputedStyle(gridEl).gridTemplateColumns.split(" ").filter(Boolean);
    return tracks.length || 1;
  }

  // Auto-loads more pages as the user scrolls near the bottom of a grid,
  // via an IntersectionObserver on an invisible sentinel element —
  // replaces the old "Load more" button entirely, at the user's explicit
  // request. Also front-loads enough pages up front to fill at least 4
  // full rows before ever waiting on scroll: TMDB always returns a fixed
  // 20 results per page regardless of how many columns actually fit, so
  // one page is rarely "4 rows" on a wide desktop window.
  async function wireInfiniteGrid(gridId, sentinelId, fetchPage, mediaType, initialData) {
    const gridEl = document.getElementById(gridId);
    const sentinel = document.getElementById(sentinelId);
    if (!gridEl || !sentinel) return;
    const spinner = sentinel.querySelector(".spinner");
    let page = initialData.page || 1;
    let totalPages = initialData.total_pages || 1;
    let loading = false;

    async function loadNextPage() {
      if (loading || page >= totalPages) return false;
      loading = true;
      if (spinner) spinner.hidden = false;
      try {
        const next = await fetchPage(page + 1);
        page = next.page;
        totalPages = next.total_pages || totalPages;
        gridEl.insertAdjacentHTML(
          "beforeend", (next.results || []).map((it) => posterCard(it, mediaType)).join("")
        );
        return true;
      } finally {
        loading = false;
        if (spinner) spinner.hidden = true;
      }
    }

    const TARGET_ROWS = 4;
    while (page < totalPages && gridEl.children.length < gridColumnCount(gridEl) * TARGET_ROWS) {
      if (!(await loadNextPage())) break;
    }

    if (page >= totalPages) return; // nothing left to lazily load — no observer needed

    // IntersectionObserver only reports a *transition* across its
    // threshold, not "still intersecting" on every subsequent layout
    // change — so once the sentinel is continuously inside the rootMargin
    // zone (a short page, or a wide/dense grid), appending a page shifts
    // it without ever re-crossing that boundary, and the callback goes
    // silent forever even though there's more to load. Re-observing after
    // every successful load forces a fresh report of the sentinel's
    // *current* state (observe() always delivers one), so a still-close
    // sentinel immediately queues the next page instead of stalling.
    const observer = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) {
        observer.unobserve(sentinel);
        loadNextPage().then((loaded) => {
          if (loaded && page < totalPages) observer.observe(sentinel);
        });
      }
    }, { rootMargin: "800px 0px" });
    observer.observe(sentinel);
  }

  // Curated, row-based Movies page — no more Popular/Trending/Coming Soon

  async function renderMovies() {

  // One category's full, paginated list — the row-title-click destination
  // for Trending/Popular/New Releases/genre rows on Home/Movies/TV.
  // Provider rows keep linking to the existing renderProvider instead
  // (unchanged, has its own within-provider search box).
  async function renderCategory(title, fetchPage, mediaType) {
    const backHash = mediaType === "tv" ? "#/tv" : "#/movies";
    setChrome({ title, showBack: true, activeTab: mediaType === "tv" ? "tv" : "movies" });
    app.innerHTML = loadingHtml();
    try {
      const data = await fetchPage(1);
      app.innerHTML = `
        <h1 class="page-title">${escapeHtml(title)}</h1>
        ${gridSectionHtml("categoryGrid", "categoryMore", data, mediaType, "Nothing found.")}
      `;
      wireInfiniteGrid("categoryGrid", "categoryMore", fetchPage, mediaType, data);
    } catch (err) {
      app.innerHTML = errorHtml(err.message, backHash);

  // mediaType: "movie" (default) or "tv" — same provider ids work for
  // both (TMDB's watch-provider ids are shared across media types), just
  // a different discover/search call and poster-card link target.
  async function renderProvider(id, name, mediaType) {
    const isTv = mediaType === "tv";
    const discoverByProvider = isTv ? getTvDiscoverByProvider : getDiscoverByProvider;
    const searchFn = isTv ? postSearchTv : postSearch;
    setChrome({ title: name || "Browse", showBack: true, activeTab: isTv ? "tv" : "movies" });
    app.innerHTML = `
      <input type="search" class="inline-search" id="providerSearchInput"
             placeholder="Search within ${escapeHtml(name || "this service")}…">
      <div id="providerResults">${loadingHtml()}</div>
    `;
    const input = document.getElementById("providerSearchInput");
    const resultsEl = document.getElementById("providerResults");

    async function showBrowse() {
      resultsEl.innerHTML = loadingHtml();
      try {
        const data = await discoverByProvider(id, 1);
        resultsEl.innerHTML = gridSectionHtml("providerGrid", "providerMore", data, mediaType, "No titles found for this service.");
        wireInfiniteGrid("providerGrid", "providerMore", (p) => discoverByProvider(id, p), mediaType, data);
      } catch (err) {
        resultsEl.innerHTML = errorHtml(err.message);
      }
    }

    async function showProviderSearch(query) {
      resultsEl.innerHTML = loadingHtml();
      try {
        const results = await searchFn(query, Number(id));
        resultsEl.innerHTML = results.length
          ? `<div class="grid">${results.map((it) => posterCard(it, mediaType)).join("")}</div>`
          : emptyHtml(`No titles on ${name || "this service"} matched “${query}”.`);
      } catch (err) {
        resultsEl.innerHTML = errorHtml(err.message);
      }
    }

    function submitProviderSearch() {
      const query = input.value.trim();
      if (query) showProviderSearch(query); else showBrowse();
    }
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitProviderSearch(); });
    input.addEventListener("search", submitProviderSearch);

    await showBrowse();
  }

  // The full subscribed-shows list — pause/resume/unsubscribe controls,
  // unchanged from before; both new curated-page Watching rows expand
  // here.
  async function renderWatching() {
    setChrome({ title: "Watching", showBack: true, activeTab: "tv" });
    app.innerHTML = loadingHtml();
    try {
      const shows = await listShows();
      app.innerHTML = watchingListHtml(shows);
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/tv");
    }
  }

  function relativeTime(iso) {
    if (!iso) return "never";
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.round(hours / 24)}d ago`;
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  function watchStatusPillHtml(status) {
    const cls = status === "paused" ? "status-queued" : "status-complete";
    const label = status === "paused" ? "Paused" : "Watching";
    return `<span class="status-pill ${cls}"><span class="status-dot ${cls}"></span>${label}</span>`;
  }

  // The second pill on a Watching row: what the show's most recent
  // episode/pack request actually did, or a plain "not checked yet" when
  // there's no history (just subscribed, catch-up still queued).
  function latestRequestPillHtml(req) {
    if (!req) return `<span class="status-pill status-queued"><span class="status-dot status-queued"></span>Not checked yet</span>`;
    const label = req.media_type === "episode" ? `S${pad2(req.season_number)}E${pad2(req.episode_number)}` : packScopeLabel(req);
    const m = statusMeta(req.status);
    return `<span class="status-pill ${m.cls}"><span class="status-dot ${m.cls}"></span>${label} — ${m.label}</span>`;
  }

  function watchingListHtml(shows) {
    if (!shows.length) return emptyHtml("Not watching anything yet — find a show and tap Add Show.");
    return shows.map((s) => `
      <div class="req-row">
        <div class="req-main">
          <a class="req-title" href="#/tv/${s.tmdb_id}">${escapeHtml(s.title)}</a>
          <div class="req-sub">Last checked ${relativeTime(s.last_checked_at)}</div>
          <div class="watch-pills" style="margin-top:6px">
            ${watchStatusPillHtml(s.status)}
            ${latestRequestPillHtml(s.latest_request)}
          </div>
        </div>
        <div class="req-actions">
          <button class="toggle-show-btn" data-toggle-show="${s.id}" data-current-status="${s.status}">
            ${s.status === "paused" ? "Resume" : "Pause"}
          </button>
          <button class="watch-link" data-unsub-show="${s.id}">Unsubscribe</button>
        </div>
      </div>
    `).join("");
  }

  // -- Show detail (Stage 14) --

  // Split from the unsubscribe link (below) so the primary button can sit
  // in the hero's action row, TMDB-Play-Trailer-style, while Unsubscribe
  // stays a small, separate affordance below the hero — there's no TMDB
  // equivalent to mirror for that one, so it's kept deliberately minimal.
  function subscribeButtonHtml(subscription, isComingSoon) {
    if (!subscription) {
      return isComingSoon
        ? `<button class="add-btn" id="subscribeBtn" disabled title="Not out digitally yet">+ Add Show</button>`
        : `<button class="add-btn" id="subscribeBtn">+ Add Show</button>`;
    }
    if (subscription.status === "paused") {
      return `<button class="add-btn" id="resumeBtn">Paused — Tap to Resume</button>`;
    }
    return `<button class="add-btn" id="pauseBtn">Watching &#10003;</button>`;
  }

  function unsubscribeLinkHtml(subscription) {
    return subscription ? `<button class="unsubscribe-link" id="unsubBtn">Unsubscribe</button>` : "";
  }

  // Bulk-download (Stage 13/14.x) works whether or not the show is
  // subscribed — the backend anchors a one-off download to a paused show
  // record on first use if it needs to (see api.py's bulk_download_show),
  // so there's nothing to gate here on subscription state any more.
  function bulkAreaHtml(isEndedOrCanceled, seasons) {
    const seriesBtn = `<button class="bulk-btn ${isEndedOrCanceled ? "primary" : ""}" id="bulkSeriesBtn">Download complete series</button>`;
    const seasonRows = seasons.length
      ? `<div class="season-list">${seasons.map((s) => `
          <div class="season-row">
            <span>${escapeHtml(s.name || `Season ${s.season_number}`)}</span>
            <button class="season-btn" data-bulk-season="${s.season_number}">Download</button>
          </div>
        `).join("")}</div>`
      : "";
    return `
      <h2 class="section-heading">Bulk download</h2>
      ${seriesBtn}
      ${seasonRows}
      <div id="bulkResult"></div>
    `;
  }

  function bulkResultHtml(req) {
    return `<div class="add-confirm">${statusPillHtml(req.status)}<span>Added to <a href="#/requests">Requests</a>.</span></div>`;
  }

  async function renderShow(id) {
    setChrome({ title: "", showBack: true, activeTab: "tv", hasHero: true });
    app.innerHTML = loadingHtml();
    try {
      const [show, shows] = await Promise.all([getTvShow(id), listShows()]);
      document.title = `${show.name || show.original_name || ""} — Smithflix`;
      let subscription = shows.find((s) => s.tmdb_id === Number(id)) || null;

      const backdrop = backdropUrl(show.backdrop_path);
      const cast = show.credits?.cast;
      const crew = show.credits?.crew;
      const isEndedOrCanceled = show.status === "Ended" || show.status === "Canceled";
      const seasons = (show.seasons || []).filter((s) => s.season_number > 0);
      const year = yearOf(show.first_air_date);

      app.innerHTML = `
        <div class="hero" style="${backdrop ? `background-image:url('${backdrop}')` : ""}">
          <div class="hero-content">
            <div class="detail-poster-wrap">
              <img class="detail-poster" src="${posterUrl(show.poster_path)}" alt="">
              ${show.on_plex ? `<div class="on-plex-badge">On Plex</div>` : ""}
            </div>
            <div class="detail-info">
              <h1>${escapeHtml(show.name || show.original_name)}${year ? ` <span class="hero-year">(${year})</span>` : ""}</h1>
              <div class="detail-meta">
                ${show.status ? `<span class="cert-badge">${escapeHtml(show.status)}</span>` : ""}
                <span>${escapeHtml(genreLine(show.genres))}</span>
              </div>
              <div class="hero-actions">
                ${scoreRowHtml(show.vote_average)}
                <div id="subscribeButtonArea">${subscribeButtonHtml(subscription, show.is_coming_soon)}</div>
              </div>
              ${show.tagline ? `<div class="tagline">${escapeHtml(show.tagline)}</div>` : ""}
            </div>
          </div>
        </div>
        <div id="unsubscribeArea">${unsubscribeLinkHtml(subscription)}</div>
        <h2 class="section-heading">Overview</h2>
        <div class="detail-overview">${escapeHtml(show.overview) || "<em>No synopsis available.</em>"}</div>
        ${crewRowHtml(crew)}
        <div id="bulkArea">${bulkAreaHtml(isEndedOrCanceled, seasons)}</div>
        ${castSectionHtml(cast)}
      `;

      function refreshSubscribeAreas() {
        document.getElementById("subscribeButtonArea").innerHTML = subscribeButtonHtml(subscription, show.is_coming_soon);
        document.getElementById("unsubscribeArea").innerHTML = unsubscribeLinkHtml(subscription);
        document.getElementById("bulkArea").innerHTML = bulkAreaHtml(isEndedOrCanceled, seasons);
        wireSubscribeArea();
        wireBulkArea();
      }

      function wireSubscribeArea() {
        const addBtn = document.getElementById("subscribeBtn");
        if (addBtn && !addBtn.disabled) addBtn.addEventListener("click", async () => {
          addBtn.disabled = true;
          addBtn.textContent = "Adding…";
          try {
            subscription = await createShow(Number(id));
            refreshSubscribeAreas();
          } catch (err) {
            addBtn.disabled = false;
            addBtn.textContent = "+ Add Show";
            alert(`Couldn't add this show: ${err.message}`);
          }
        });
        const pauseBtn = document.getElementById("pauseBtn");
        if (pauseBtn) pauseBtn.addEventListener("click", async () => {
          if (!confirm("Pause this show? New episodes won't be grabbed until you resume.")) return;
          subscription = await pauseShow(subscription.id);
          refreshSubscribeAreas();
        });
        const resumeBtn = document.getElementById("resumeBtn");
        if (resumeBtn) resumeBtn.addEventListener("click", async () => {
          subscription = await resumeShow(subscription.id);
          refreshSubscribeAreas();
        });
        const unsubBtn = document.getElementById("unsubBtn");
        if (unsubBtn) unsubBtn.addEventListener("click", async () => {
          if (!confirm("Unsubscribe from this show? Its download history stays in Requests.")) return;
          await deleteShow(subscription.id);
          subscription = null;
          refreshSubscribeAreas();
        });
      }

      function wireBulkArea() {
        const resultBox = document.getElementById("bulkResult");
        async function runBulkDownload(btn, body) {
          btn.disabled = true;
          const originalText = btn.textContent;
          btn.textContent = "Adding…";
          try {
            const req = await bulkDownload(Number(id), body);
            resultBox.innerHTML = bulkResultHtml(req);
            // The backend may have just silently created a paused show
            // record to anchor this download (no prior subscription) —
            // re-check so the hero button/Unsubscribe link stop showing
            // stale "not subscribed" state.
            if (!subscription) {
              const shows = await listShows();
              subscription = shows.find((s) => s.tmdb_id === Number(id)) || null;
              document.getElementById("subscribeButtonArea").innerHTML = subscribeButtonHtml(subscription, show.is_coming_soon);
              document.getElementById("unsubscribeArea").innerHTML = unsubscribeLinkHtml(subscription);
              wireSubscribeArea();
            }
          } catch (err) {
            resultBox.innerHTML = `<div class="add-confirm">Couldn't add that: ${escapeHtml(err.message)}</div>`;
          } finally {
            btn.disabled = false;
            btn.textContent = originalText;
          }
        }
        const seriesBtn = document.getElementById("bulkSeriesBtn");
        if (seriesBtn) seriesBtn.addEventListener("click", () => runBulkDownload(seriesBtn, { scope: "series" }));
        document.querySelectorAll("[data-bulk-season]").forEach((btn) => {
          btn.addEventListener("click", () => runBulkDownload(btn, { scope: "season", season_number: Number(btn.dataset.bulkSeason) }));
        });
      }

      wireSubscribeArea();
      wireBulkArea();
    } catch (err) {
      app.innerHTML = errorHtml(err.message);
    }
  }

  // -- Unified search (Stage 14): movies and TV shows in parallel,
  //    grouped into two independently-empty-stated sections. --

  async function renderSearch(query) {
    setChrome({ title: `“${query}”`, showBack: true, activeTab: null });
    // The bar lives in the top bar permanently now, independent of this
    // view — reflect whatever query got us here (e.g. landed on directly,

    searchInput.value = query;
    updateSearchClearBtn();
    app.innerHTML = loadingHtml();
    try {
      const [movies, shows] = await Promise.all([
        postSearch(query).catch(() => []),
        postSearchTv(query).catch(() => []),
      ]);
      if (!movies.length && !shows.length) {
        app.innerHTML = emptyHtml(`Nothing matched “${query}”.`);
        return;
      }
      app.innerHTML = `
        <section class="row">
          <h2>Movies</h2>
          ${movies.length ? `<div class="grid">${movies.map((it) => posterCard(it, "movie")).join("")}</div>` : emptyHtml("No movies matched.")}
        </section>
        <section class="row">
          <h2>TV Shows</h2>
          ${shows.length ? `<div class="grid">${shows.map((it) => posterCard(it, "tv")).join("")}</div>` : emptyHtml("No TV shows matched.")}
        </section>
      `;

      app.innerHTML = errorHtml(err.message);

  function certificationOf(movie) {
    const usEntry = (movie.release_dates?.results || []).find((r) => r.iso_3166_1 === "US");
    if (!usEntry) return "";
    const withCert = (usEntry.release_dates || []).find((rd) => rd.certification);
    return withCert ? withCert.certification : "";
  }

  // "Drama, Mystery, and Sci-Fi & Fantasy" — TMDB's own genre-line style,
  // shown inline in .detail-meta instead of a separate row of pill badges.
  function genreLine(genres) {
    const names = (genres || []).map((g) => g.name);
    if (names.length <= 1) return names[0] || "";
    if (names.length === 2) return `${names[0]} and ${names[1]}`;
    return `${names.slice(0, -1).join(", ")}, and ${names[names.length - 1]}`;
  }

  function scoreRowHtml(voteAverage) {
    if (!voteAverage) return "";
    const pct = Math.round(voteAverage * 10);
    const color = pct >= 70 ? "var(--status-complete)" : pct >= 40 ? "var(--status-nomatch)" : "var(--status-nospace)";
    return `<div class="score-row">
      <div class="score-ring" style="--score-pct:${pct};--score-color:${color}"><span>${pct}%</span></div>
      <span class="score-label">User Score</span>
    </div>`;
  }

  function crewRowHtml(crew) {
    const director = (crew || []).find((c) => c.job === "Director");
    const writerJobs = new Set(["Screenplay", "Writer", "Story"]);
    const items = [];
    if (director) items.push({ name: director.name, job: "Director" });
    const seen = new Set(items.map((i) => i.name));
    for (const c of crew || []) {
      if (items.length >= 4) break;
      if (writerJobs.has(c.job) && !seen.has(c.name)) {
        seen.add(c.name);
        items.push({ name: c.name, job: "Writer" });
      }
    }
    if (!items.length) return "";
    return `<div class="crew-row">${items
      .map((i) => `<div><div class="crew-name">${escapeHtml(i.name)}</div><div class="crew-job">${i.job}</div></div>`)
      .join("")}</div>`;
  }

  function castSectionHtml(cast) {
    const top = (cast || []).slice(0, 15);
    if (!top.length) return "";
    const cards = top
      .map(
        (c) => `<a class="cast-card" href="#/person/${c.id}">
          <img src="${c.profile_path ? IMG_BASE + "w185" + c.profile_path : PLACEHOLDER_POSTER}" alt="" loading="lazy">
          <div class="cast-name">${escapeHtml(c.name)}</div>
