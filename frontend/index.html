<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smithflix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<!-- Dark is the only theme (light mode removed per direct request) —
     this stays a plain static value, no JS needed to keep it in sync
     with a toggle that no longer exists. -->
<meta name="theme-color" content="#141312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smithflix">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/brand-icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter previously stopped at 600 — every font-weight:700/800
     declaration on body text (the hero title among many others) was
     silently font-matching down to that 600 face (or faux-bolding it)
     instead of actually rendering bold/extra-bold, since no heavier
     Inter face was ever loaded. Added 700/800 to cover every weight
     this file actually declares. -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,700,1,0" rel="stylesheet">
<style>
  /* Smithflix brand palette — charcoal ground + a cool blue accent,
     picked live via the theme-lab exercise against a "cool/moody blue"
     Coolors board (superseding the original teal/cream/coral kit in
     brand_identity/, and before that a light-red repaint; that folder is
     left as-is, this is a live in-app repaint, not yet folded back into
     the reference kit). Dark is the only theme — no light mode, no
     toggle: removed per direct request rather than left dormant, since
     the header icon slot it used is earmarked for a future profile icon
     instead. --accent-secondary (also from the same board) is a second,
     independent accent for elements that need to read as visually
     distinct from the primary one (currently just the storage-used
     fill, sitting right next to primary-accent buttons in the same
     corner of the screen). */
  :root {
    --smithflix-cream: #f3ede2;
    /* Literal black, not a dark charcoal — per direct request, so the
       page background blends seamlessly with the hero's own (also
       literal-black) fade instead of reading as two adjacent, slightly
       different dark tones. --bg-card/--bg-elevated (card/surface
       layering) are deliberately untouched — this is scoped to the
       page background specifically, not every dark surface in the app. */
    --smithflix-charcoal: #000000;
    --smithflix-charcoal-card: #201e1c;
    --smithflix-accent: #b4c5e4;
    /* Near-white with just enough of the board's own cream cast to not
       read as flatly pure white — the hero carousel's active dot. */
    --smithflix-dot-active: #fbfff1;

    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    --bg: var(--smithflix-charcoal);
    --bg-elevated: #1a1816;
    --bg-card: var(--smithflix-charcoal-card);
    --text: var(--smithflix-cream);
    --text-dim: #a39a8b;
    --accent: var(--smithflix-accent);
    --accent-text: #141312;
    --accent-secondary: #3d52d5;
    --border: #332f2b;
    --status-queued: #6b7280;
    --status-searching: #3b82f6;
    --status-downloading: #a855f7;
    --status-complete: #22c55e;
    --status-nomatch: #f59e0b;
    --status-nospace: #ef4444;
    --status-failed: #dc2626;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --row-gap: 10px;
    /* Left-aligns a row's title and first poster with the header/hero
       column at --edge-inset, on top of #app's own 14px edge padding
       this sits inside of (so the two track together if --edge-inset
       ever changes again, rather than needing to stay in sync by hand —
       was a flat, independent 20px before). Shared by .hscroll's own
       left padding and the row title's left margin below. Deliberately
       asymmetric: the right side is NOT mirrored at this same inset —
       see .hscroll/.provider-row, which instead cancel #app's own right
       padding so a row's content reaches the true viewport edge, per
       direct request. */
    --row-inset: calc(var(--edge-inset) - 14px);
    /* Poster card width scales continuously with viewport width (14vw)
       between a mobile floor and a desktop ceiling, rather than jumping
       between a handful of hand-picked breakpoint values — see .hscroll/
       .grid below. Scaled down slightly from an earlier 140/275px pass
       per feedback that the cards were reading a touch too large. */
    --poster-w: clamp(120px, 14vw, 240px);
    /* Same continuous-scaling idea as --poster-w, just a smaller range —
       a circular cast photo reads fine noticeably smaller than a poster,
       and the row would otherwise dominate the page at desktop widths. */
    --cast-w: clamp(64px, 7vw, 104px);
    /* Shared horizontal inset for the app's own "chrome" — the header
       logo/icons, the home hero's text column, and the floating
       downloads/storage pills — so they all line up on the same edge.
       Deliberately NOT used by row-inset/content rows (.hscroll/.grid),
       which stay full-bleed by their own separate design. Matches
       Prime Video's own wider storefront-header margin, bumped up first
       from an earlier, tighter 32px pass, then again from 48px per
       direct request for more breathing room. */
    --edge-inset: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* Every icon in the app is Material Symbols Rounded at one fixed style
     (filled, weight 700, grade 0, optical size 48 — set on the element
     itself as a fallback/override in case the URL-baked @48,700,1,0
     defaults from the <link> in <head> don't apply for any reason).
     Google's own standard boilerplate for using the variable font as an
     icon set; font-size controls the rendered size per placement below,
     independent of the opsz axis. color inherits from the parent, same
     as the SVG icons this replaces (fill: currentColor). */
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    overscroll-behavior-y: none;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* Fixed (not sticky/in-flow), floating above everything else — main's
     own top padding compensates for the space this no longer occupies in
     normal flow (see main's CSS), and .hero separately reaches its own
     background up behind this via a negative margin (see .hero's CSS). */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    /* --edge-inset left/right — same shared inset as the downloads FAB/
       storage pill and the home hero's own text column, so they all
       line up on the same vertical edge. */
    padding: calc(25px + var(--safe-top)) var(--edge-inset) 25px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
  }
  /* Hero-topped pages (see body.has-hero, set in setChrome): the header
     carries no background of its own at all at the top of the page —
     no gradient scrim, no blur — per direct request to remove that
     state entirely. The hero's own top fade now carries icon/text
     legibility instead (see .home-hero-fade's top layer, matching its
     bottom fade's distance at half the opacity). Once scrolled past
     the hero (.scrolled below) it's over ordinary rows instead, so it
     gets its normal frosted fill there. */
  body.has-hero #topbar {
    background: transparent;
    backdrop-filter: none;
    transition: background 0.2s ease;
  }
  /* The transparency above is specifically for reading over the hero
     image — once the page has scrolled far enough that the header is no
     longer floating over the hero at all (.scrolled, toggled in JS by
     comparing .hero's own position to the header's height), it's just
     floating over ordinary rows instead, so it fades in to a flatter,
     more legible fill: a black frosted glass, not the see-through hero
     gradient above — literal black, same "read as black specifically"
     rule as everything else on this hero, rather than var(--bg) (a
     warm-tinted charcoal in this theme). Kept genuinely translucent
     (not near-opaque, confirmed live that reads as a flat bar with the
     blur barely registering) so the blur has actual scrolled content
     behind it to visibly soften — per direct follow-up request. Stronger
     blur than the base non-hero #topbar's 10px either way, so it still
     reads as frosted rather than just a dimmed bar. */
  body.has-hero.scrolled #topbar {
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(20px);
  }
  /* While the search overlay (below) is open, #topbar needs to look
     IDENTICAL to the dimmed/blurred page beneath it, not its own
     separately-tinted bar — two different attempts at giving #topbar its
     own matching background (first the overlay's exact rgba(0,0,0,0.7),
     then a more opaque 0.92 to compensate) both still read as a visibly
     different bar poking out above the rest of the page, confirmed live
     both times. Root cause: two independently-rendered backdrop-filter
     elements (this one, and the overlay) don't reliably composite to
     the same result even with identical declared values. Fixed at the
     source instead — #searchOverlay (below) now extends up to cover the
     header's own area too (top:0, not var(--topbar-h)), so there's only
     ONE blur/tint layer for the entire viewport. #topbar itself just
     goes fully transparent here, letting that single layer show through
     uniformly behind it — guarantees an exact match since it's
     literally the same paint, not two separate approximations of it.
     Each variant below matches (a search-open class added to) an
     existing #topbar background rule's own selector, so it's specific
     enough to actually override that rule rather than losing the
     cascade to it. */
  body.search-open #topbar,
  body.has-hero.search-open #topbar,
  body.has-hero.scrolled.search-open #topbar {
    background: transparent;
    backdrop-filter: none;
  }
  /* Inactive nav-link color is intentionally muted (--text-dim) on every
     other page, where the background is always a flat, predictable app
     color — but that same dim tone is close enough to a light or
     mid-grey hero image's own tones that it can nearly disappear there,
     leaning entirely on the hero's own top fade for contrast now (see
     .home-hero-fade's top layer — #topbar itself carries no background
     of its own here any more). Full-strength --text on hero pages instead.
     The active link needs its own repeat here even though
     .top-nav-link.active above already sets its own color: this
     selector's #topbar id outweighs that plain two-class one, so
     without a same-specificity override here the active link's text
     would get silently overridden back to the same neutral --text
     every inactive link gets — its white pill background is the only
     thing that'd still look right. Every page a nav link actually
     points to (home, movies, tv) is a hero page, so this isn't a rare
     edge case. */
  body.has-hero #topbar .top-nav-link { color: var(--text); }
  body.has-hero #topbar .top-nav-link.active { color: var(--smithflix-charcoal); }
  /* Fixed width/height (not padding-driven) matching .top-nav-link.
     active's own rendered height exactly (measured live: 35.5px) —
     set at rest, not just on :hover, so hovering only ever changes
     background/color/border-radius, never the box's own size. An
     earlier version sized this box on :hover alone, which shifted
     both this button and its neighbors (flex siblings in #topbar)
     every time the pointer entered/left it — confirmed live. */
  #searchToggleBtn, #settingsToggle {
    flex: 0 0 auto; background: none; border: none; color: var(--text);
    font-size: 20px; width: 35.5px; height: 35.5px; border-radius: 8px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #searchToggleBtn:active, #settingsToggle:active { background: var(--bg-card); }
  /* Hover: a true circle (not the 8px-radius rounded-square the tap
     state above uses) — same white-fill/black-icon language as
     .top-nav-link.active (var(--smithflix-charcoal), not
     --bg-card/--text, so it's theme-invariant like that pill is).
     The same look also applies as a persistent "active" state per
     direct request: #searchToggleBtn while the search overlay is
     open (body.search-open, already toggled by openSearchOverlay/
     closeSearchOverlay) and #settingsToggle while actually on the Settings
     page (.active, toggled by updateSettingsActive() below — the
     Settings route has no activeTab of its own in setChrome() since
     it isn't one of the shared tab-bar sections, so this icon needs
     its own dedicated hash check rather than reusing that system). */
  #searchToggleBtn:hover, #settingsToggle:hover,
  body.search-open #searchToggleBtn, #settingsToggle.active {
    background: #fff; color: var(--smithflix-charcoal);
    border-radius: 50%;
  }
  /* Pushes this whole trailing icon group (search/settings) to the
     right edge, same job .search-input-wrap's margin-left:auto used to
     do before search moved into its own overlay below. */
  #searchToggleBtn { margin-left: auto; }
  #topbarLogo {
    /* margin-right (on top of #topbar's shared gap:10px) widens the
       logo-to-nav gap specifically, without touching the uniform gap
       between the other topbar icons. */
    flex: 0 0 auto; display: flex; align-items: center; min-width: 0; margin-right: 22px;
  }
  /* Real text, not an image, colored via the same CSS vars as everything
     else — no separate SVG asset to keep in sync with the brand
     palette. */
  #topbarLogo .brand-wordmark {
    font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1;
  }
  #topbarLogo .brand-word-smith { color: var(--text); }
  #topbarLogo .brand-word-flix { color: var(--accent); }
  /* Prime-Video-style search overlay: the header icon (#searchToggleBtn)
     toggles this. Covers the FULL viewport (top:0), including behind
     the header — not just below it — so there's exactly one blur/tint
     layer for the whole page (see the body.search-open #topbar comment
     above for why: two separately-rendered backdrop-filter layers don't
     reliably composite to an identical result, even with matching
     values). #topbar sits above this in z-index (10 vs. 9) and goes
     transparent while search is open, so its own icons/logo stay
     visible and interactive on top of this single tinted/blurred
     surface rather than being hidden behind it. Literal black tint (not
     var(--bg)), same "read as black specifically" rule the hero/header
     scrims already follow. */
  #searchOverlay {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
    /* align-items defaults to stretch — without flex-start here the
       pill (an auto-height flex child) stretches to fill this overlay's
       full remaining viewport height instead of sitting near the top at
       its own content height. Confirmed live: without this the pill
       rendered as a giant vertical capsule spanning most of the screen. */
    display: flex; justify-content: center; align-items: flex-start;
    /* Top padding now has to clear the header's own height itself (this
       overlay extends behind it, unlike before), plus the original 28px
       breathing room below that. */
    padding: calc(var(--topbar-h, 64px) + 28px) var(--edge-inset) 0;
  }
  #searchOverlay[hidden] { display: none; }
  .search-overlay-pill {
    position: relative; width: 100%; max-width: 720px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 12px 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  }
  .search-overlay-pill:focus-within { outline: 2px solid #fff; }
  .search-overlay-icon-btn {
    flex: 0 0 auto; background: none; border: none; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  #searchInput {
    flex: 1 1 auto; min-width: 0; width: 100%; background: none; border: none;
    color: var(--text); font-size: 17px;
    -webkit-appearance: none; appearance: none;
  }
  #searchInput:focus { outline: none; }
  #searchInput::-webkit-search-cancel-button { display: none; }
  .search-clear-btn {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    background: none; border: none; color: var(--text-dim); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  /* Same-specificity tie with the UA's [hidden]{display:none} — without
     this, source order lets the rule above win and the button shows even
     while hidden. */
  .search-clear-btn[hidden] { display: none; }
  .search-overlay-icon-btn:active, .search-clear-btn:active { background: var(--bg-elevated); }

  .inline-search {
    display: block; width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px;
    margin-bottom: 18px;
  }
  .inline-search:focus { outline: 2px solid var(--accent); }

  /* 130px (not just the tab bar's ~90px) so scrolled content on the
     Requests view clears the floating .clear-requests-fab/.downloads-fab
     above the tab bar. No max-width — the row-based layout should fill
     the real browser width edge to edge on desktop (Prime/Netflix-style),
     not sit centered with visible gaps down the sides; an earlier
     max-width:1600px cap (from before the curated-rows redesign, meant to
     stop a single sparse grid from stretching too wide) was exactly that
     gap the user was seeing. */
  main {
    /* Top padding compensates for #topbar now being fixed/out-of-flow
       (--topbar-h is measured and kept in sync by JS — see
       updateTopbarHeight()). Applied unconditionally, including on
       hero-topped pages: an earlier pass zeroed this out for .has-hero so
       the hero could reach the true viewport top, but that also pulled
       everything else at the top of main up with it — the loading
       spinner shown before the hero itself has even rendered, most
       visibly, ended up cramped directly under the floating header. Only
       .hero's own background needs to reach behind the header, not
       main's other content — see .hero's negative margin below, which
       does that independently of this padding. */
    padding: calc(var(--topbar-h, 64px) + 14px) 14px calc(130px + var(--safe-bottom));
    min-height: 60vh;
  }

  .top-nav-links { display: none; }
  .top-nav-link {
    padding: 8px 14px; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: var(--text-dim); background: none; border: none;
  }
  .top-nav-link:hover { color: var(--text); background: var(--bg-card); }
  /* Same pill language as .storage-indicator/.status-pill — a fixed
     white fill with the site's own "black" token (--smithflix-charcoal,
     the same #141312 already used as --accent-text in dark theme) for
     text, deliberately theme-invariant rather than --bg-card/--text
     (which would go charcoal-on-cream in dark mode) — a consistent,
     branded high-contrast chip in either theme, readable against any
     hero image behind it. */
  .top-nav-link.active { color: var(--smithflix-charcoal); background: #fff; }

  section.row { margin-bottom: 26px; }
  section.row h2 {
    font-size: 15px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 10px var(--row-inset);
  }
  /* A row whose title expands to a dedicated full-list page (Prime-Video-
     style) — same type scale as the plain h2 above, but accent-colored
     with a trailing chevron so it visibly reads as tappable, not just a
     label. */
  section.row .row-title {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 15px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 10px var(--row-inset);
  }
  section.row .row-title-arrow { font-size: 21px; line-height: 1; font-weight: 700; }
  section.row .row-title:active { opacity: 0.7; }

  .hscroll {
    /* overflow-x:auto forces overflow-y to compute as auto too (CSS spec —
       explicitly setting overflow-y:visible here wouldn't override that),
       which clips the top of a poster's hover scale-up below. Top padding
       gives the scaled card room inside the box instead. Left padding is
       the row's own breathing room (see --row-inset) — where the first
       poster actually starts, lined up with the header. The right side
       is deliberately NOT mirrored: margin-right cancels #app's own 14px
       right padding so the scrollable track reaches the true viewport
       edge instead, letting the last poster sit flush against it (or get
       cut off mid-card while scrolling) — the same "there's more, keep
       going" signal every other streaming app's own rows use, per direct
       request. */
    display: flex; gap: var(--row-gap); overflow-x: auto; padding: 8px 0 4px var(--row-inset);
    margin-right: -14px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
    /* Cross-browser scrollbar hiding — the ::-webkit-scrollbar rule
       below only ever covered Chrome/Safari/Edge; Firefox (and old
       Edge/IE) need these two instead, and without them Firefox's own
       native scrollbar track reserved extra height at the bottom of
       this row, which (since .hscroll-arrow's top:0/bottom:4px span —
       see below — is measured against .hscroll-wrap's own real
       height) shifted the hover arrow's vertically-centered position
       down along with it — confirmed live. */
    scrollbar-width: none; -ms-overflow-style: none;
    /* Without this, scroll-snap-align:start on the first card fights the
       padding above: "start" alignment is measured against the snapport
       (scroll-padding, default 0), not the visual padding box, so the
       browser auto-scrolls the row on load just far enough to erase the
       left inset entirely. Matching scroll-padding to the visual padding
       tells the snap logic the padded position *is* "start" — only the
       left value matters now that the right side has no padding of its
       own to protect. */
    scroll-padding-inline: var(--row-inset) 0;
  }

  /* Desktop-only click-to-scroll arrows, overlaid on a row and only shown
     while that row is actually hovered (native touch-swipe already
     covers mobile — these would just be dead visual clutter there, so
     they're gated behind (hover:hover) rather than a viewport breakpoint,
     since that's the real signal "does a mouse make sense here"). */
  .hscroll-wrap { position: relative; }
  .hscroll-arrow {
    position: absolute; top: 0; bottom: 4px; width: 56px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    border: none; color: var(--text); padding: 0; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
  }
  .hscroll-arrow .material-symbols-rounded { font-size: 34px; }
  .hscroll-arrow-left {
    left: 0; background: linear-gradient(to right, color-mix(in srgb, var(--bg) 75%, transparent), transparent);
  }
  /* right:-14px, not 0 — .hscroll-wrap (this button's own positioning
     parent) never got .hscroll's matching margin-right:-14px (its
     sibling, the actual scrolling track), since giving it to the wrap
     too would double up with .hscroll's own already-negative margin
     (a normal-flow child measures its negative margin against its
     containing block's *own* width, so a second -14px on the parent
     would let .hscroll overshoot the true edge by 28px total, not
     14) — confirmed by reasoning through the box model rather than
     risking that live. Repositioning just this button instead reaches
     the same true edge .hscroll's cards already do, without touching
     that shared box. */
  .hscroll-arrow-right {
    right: -14px; background: linear-gradient(to left, color-mix(in srgb, var(--bg) 75%, transparent), transparent);
  }
  @media (hover: hover) {
    .hscroll-wrap:hover .hscroll-arrow { opacity: 1; pointer-events: auto; }
    /* At the true start of a row there's nothing behind it to scroll
       back to — .at-start (toggled by a scroll listener, see the JS
       delegated on #app) keeps the left arrow hidden there even on
       hover, rather than showing a "go back" control with nowhere to go.
       Higher specificity than the rule above so it wins while active. */
    .hscroll-wrap.at-start:hover .hscroll-arrow-left { opacity: 0; pointer-events: none; }
  }
  .hscroll::-webkit-scrollbar { display: none; }

  /* One shared card size (--poster-w, see :root), everywhere — bigger
     than the old density-slider range, closer to Prime Video's own card
     scale. Not a set of manual breakpoints: a row is a plain flex strip
     of fixed-width cards, so how many happen to be visible before the
     overflow starts is already a direct function of viewport width
     (narrower window → fewer fit), and --poster-w's own `clamp(...,
     16vw, ...)` scales the card size itself continuously with that same
     width too, rather than a value that jumps at hand-picked widths — see
     .grid below for the wrapping-grid equivalent of the same idea. */
  .poster-card { display: block; scroll-snap-align: start; }
  .hscroll .poster-card { flex: 0 0 var(--poster-w); }
  .poster-art { position: relative; border-radius: 10px; overflow: hidden; }
  .poster-card img {
    width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px;
    background: var(--bg-card); display: block;
  }
  .poster-card .cap {
    font-size: 12.5px; margin-top: 6px; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.25;
  }
  /* "On Plex" badge (Stage 14) — a quick-glance band across the bottom of
     any poster already in the household's Plex library, distinct from
     "I requested this" (the app's own status pills). Green, matching the
     existing --status-complete "done/good" color language. */
  .on-plex-badge {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--status-complete) 30%, black 55%);
    color: var(--status-complete);
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    text-align: center; padding: 4px 2px;
  }
  @media (hover: hover) {
    .poster-art { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .poster-card:hover .poster-art {
      transform: scale(1.045); box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 1;
    }
  }

  /* Same --poster-w as .hscroll, same continuous-not-tiered idea —
     auto-fill's own column math (not a hand-picked breakpoint list)
     decides how many columns of at least --poster-w fit the real
     available width, shrinking that count by exactly one whenever the
     window gets narrow enough to no longer fit the current count, at
     whatever width that happens to be — and --poster-w's own vw-based
     scaling on top of that means even the *width* of a given column
     count keeps adjusting smoothly, not just the count itself. */
  /* Same asymmetric-inset treatment as .hscroll/.provider-row (left
     lined up with the header at --row-inset, right side cancels
     main's own 14px padding instead of mirroring it) — per direct
     request, category/provider-search/search-result/person-credit
     pages (all of which render into this) should line up with Home's
     own rows rather than sitting at main's plain 14px inset, which
     this was doing before. */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--poster-w), 1fr));
    gap: 14px 10px;
    padding-left: var(--row-inset); margin-right: -14px;
  }
  .grid .poster-card { width: auto; }
  .grid .poster-card img { width: 100%; height: auto; aspect-ratio: 2 / 3; }
  /* Actor/person credit and category/genre/provider-browse pages
     (gridSectionHtml's own .grid, shared by renderCategory and
     renderProvider's browse view) only — symmetric padding-right
     instead of .grid's own reach-the-true-edge margin-right:-14px,
     per direct request (this grid's last column was flush against the
     true viewport edge, unlike every other edge-aligned element on
     the page, which all stop at the header's own right inset). A
     smaller --poster-w (only redefined here, not globally — Search's
     own plain .grid keeps the original reach-the-edge treatment,
     wasn't asked to change) keeps the same column density despite the
     narrower available width, rather than just dropping a column at
     any given viewport width. */
  .grid.person-grid, .grid.category-grid {
    --poster-w: clamp(104px, 12vw, 210px);
    padding-right: var(--row-inset); margin-right: 0;
  }

  /* Symmetric --row-inset on both sides (== --edge-inset, 64px, on
     top of main's own 14px) — NOT .hscroll's asymmetric left-inset/
     reach-the-true-edge treatment, despite starting from the same
     left-aligned-with-the-header idea. This wraps to more rows
     instead of scrolling, so there's no "more to scroll" affordance
     to preserve on the right; the old margin-right:-14px just pushed
     its last column past the header's own right inset instead,
     visibly misaligned with it — confirmed live, fixed per direct
     request. */
  .provider-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 16px 12px;
    padding-left: var(--row-inset); padding-right: var(--row-inset);
  }
  .provider-chip {
    /* ~22% is the standard CSS approximation of Apple's App Store icon
       "squircle" ratio (percentage, not a fixed px, so it holds at any
       chip size the responsive grid lands on). */
    width: 100%; aspect-ratio: 1; border-radius: 22%;
    overflow: hidden; background: var(--bg-card); border: 1px solid var(--border);
  }
  .provider-chip img { width: 100%; height: 100%; object-fit: cover; }
  .provider-label {
    text-align: center; font-size: 12.5px; color: var(--text-dim); margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* margin-left: var(--row-inset), matching section.row h2's own left
     edge, so a category/person page's heading lines up with Home's
     row titles instead of sitting at main's plain 14px inset. */
  .page-title { font-size: 21px; margin: 0 0 22px var(--row-inset); }
  /* Pulls up into .page-title's own bottom margin rather than stacking
     under it, so a title+subtitle pair (person filmography) reads as one
     tight header block instead of two evenly-spaced lines. */
  .page-title + .page-subtitle { margin-top: -14px; }
  .page-subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 22px var(--row-inset); }

  /* Invisible trigger an IntersectionObserver watches to auto-load the
     next page as the user scrolls near it — see wireInfiniteGrid(). Its
     own spinner only shows while a background page fetch is in flight. */
  .grid-sentinel { height: 1px; margin-top: 12px; }
  .grid-sentinel .spinner { margin-top: 16px; }

  .empty, .error, .loading {
    color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 15px;
  }
  .error { color: var(--status-nospace); }
  .retry {
    display: inline-block; margin-top: 10px; padding: 8px 16px;
    background: var(--bg-card); border-radius: 8px; color: var(--text);
  }

  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Detail view — Prime Video's own movie/show page layout (per direct
     request, matched exactly where this app has an equivalent): a
     full-bleed backdrop reaching the true viewport top/width — same fade
     treatment as the home-hero carousel, copied verbatim below — with a
     left action column (poster, score ring, add/subscribe-state icon,
     big primary button) and a right info column (title, meta tags,
     overview, a short cast list) overlaid near the bottom. */
  /* Same negative-margin-behind-the-header trick .home-hero uses (see its
     own comment) — but the backdrop image itself spans the full width via
     width:100% rather than .home-hero's right-anchored native-aspect box,
     per direct request ("enlarged to the entire viewport width, top of
     poster aligned with top of viewport"). */
  .detail-hero {
    position: relative; width: calc(100% + 28px); overflow: hidden;
    /* Bottom margin bumped 18px -> 40px — whatever sits right after
       this in the page flow (the Related row, or the old crew row
       before it moved into the Creators and Cast card) read as cramped
       underneath the action column's own button, almost like part of
       it rather than a separate section below, confirmed live. */
    margin: calc(-1 * (var(--topbar-h, 64px) + 14px)) -14px 40px;
    padding-top: calc(var(--topbar-h, 64px) + 14px);
    min-height: clamp(450px, 38vw, 720px);
    background: #000;
  }
  .detail-hero-backdrop {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    /* Same left-fade formula as .home-hero-media img, copied verbatim —
       a mask (not an overlay div) so it's always anchored to this
       image's own left edge, per direct request to copy the hero
       banner's poster fade settings exactly. Trivially the viewport's
       own left edge here, since this image is already full-width,
       unlike the carousel's native-aspect box. */
    mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
  }
  /* Same top+bottom fade as .home-hero-fade, copied verbatim. */
  .detail-hero-fade {
    position: absolute; inset: 0; z-index: 1;
    background-image:
      linear-gradient(to bottom,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0.325) 20%,
        rgba(0, 0, 0, 0) 50%),
      linear-gradient(to top,
        rgba(0, 0, 0, 1) 0%,
        rgba(0, 0, 0, 0.65) 20%,
        rgba(0, 0, 0, 0) 50%);
  }
  .detail-hero-content {
    position: relative; z-index: 2; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap;
    min-height: clamp(450px, 38vw, 720px); padding: 24px var(--edge-inset) 32px;
  }
  .detail-action-col {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px;
    /* The poster's own width, shared with .detail-action-col .add-btn
       below (see its own comment) so the big Add to Plex/Add Show pill
       always matches the poster sitting above it, at every breakpoint,
       rather than tracking the two independently. */
    --detail-poster-w: 130px;
  }
  /* Score ring + add/subscribe-state icon share one row — per direct
     request, matching Prime's own icon row (a horizontal strip) more
     closely than the fully-stacked column this was before. */
  .detail-icon-row { display: flex; align-items: center; gap: 10px; }
  /* Service icon (Netflix/Prime Video/Apple TV+/etc.) — sits left of the
     score ring in the icon row, matching its 48px height exactly (see
     originalServiceIconHtml for the same is-this-an-original detection
     this used to drive a wordmark badge above the title instead, per
     direct request to move it here as a plain app icon). Same squircle
     treatment as the home page's own .provider-chip, for consistency.
     Omitted entirely (no gap) when there's no match. */
  .detail-provider-icon {
    width: 48px; height: 48px; border-radius: 22%; overflow: hidden; flex: 0 0 auto;
    background: var(--bg-card); border: 1px solid var(--border);
  }
  .detail-provider-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-poster-wrap {
    position: relative; border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }
  .detail-poster { width: var(--detail-poster-w); height: 195px; object-fit: cover; background: var(--bg-card); display: block; }
  .detail-info { flex: 1 1 320px; min-width: 260px; padding-bottom: 2px; }
  .detail-info h1 { font-size: 34px; font-weight: 800; margin: 0 0 10px; line-height: 1.15; }
  .detail-info h1 .hero-year { font-weight: 400; color: var(--text-dim); }
  /* This dim-toned text (genre/runtime/certification/overview/cast) sits
     directly on the hero image itself: --text-dim can read fine against
     .detail-hero-fade's own overlay over a typical dark still, but
     blends into a lighter or grey one regardless of how dark that fade
     gets tuned, so a shadow that doesn't depend on the backdrop is the
     more robust fix. */
  .detail-meta, .cert-badge, .detail-overview, .detail-cast-line, .detail-overview-more-btn {
    text-shadow: 0 1px 4px color-mix(in srgb, var(--bg) 90%, transparent);
  }
  .detail-meta {
    color: var(--text-dim); font-size: 14px; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .cert-badge {
    font-size: 11px; font-weight: 700; padding: 1px 6px; border: 1px solid var(--text-dim);
    border-radius: 4px; color: var(--text-dim); line-height: 1.4;
  }
  .detail-overview { margin-top: 8px; font-size: 17px; line-height: 1.5; color: var(--text); max-width: 640px; }
  /* Same clamp/"More" pattern as .detail-panel-overview-text below —
     the hero repeats the overview, so it gets the same overflow
     treatment rather than always running full-length on the image. */
  .detail-overview.clamped {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* display:block, NOT [hidden] — an explicit display value on this
     rule was silently overriding wireMoreToggle's own btn.hidden=true
     (author CSS always beats the UA stylesheet's [hidden]{display:none}
     regardless of selector specificity), so the button never actually
     disappeared even once the JS correctly decided to hide it. Scoping
     display:block to :not([hidden]) lets the attribute win again, same
     as .detail-panel-more-btn (which never had this problem only
     because it happens to rely on a <button>'s own default display
     instead of setting one explicitly). */
  .detail-overview-more-btn:not([hidden]) {
    display: block; margin: 6px 0 0; padding: 0; background: none; border: none; color: var(--accent);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .detail-overview-more-btn:hover { text-decoration: underline; }
  /* Matches the Prime screenshot's own "Cast: Name, Name, Name" line —
     just the first handful of names as plain #/person/{id} links, not
     the photo-card row (that one's still here too, further down the
     page — see castSectionHtml). Stacked under the overview by default
     (mobile/narrow) — .detail-overview-row below switches this to
     sitting alongside it once there's room, per direct request. */
  .detail-cast-line { margin-top: 12px; font-size: 15px; color: var(--text-dim); max-width: 260px; }
  .detail-cast-line a { color: var(--text); }
  .detail-cast-line a:hover { text-decoration: underline; }
  /* Same 860px breakpoint as .settings-grid/.detail-poster above — the
     overview and cast line share one row once there's room for both
     side by side, per direct request ("only go underneath it when the
     viewport... narrows"); default (mobile) stacks them, same as any
     other narrow-viewport wrap. */
  @media (min-width: 860px) {
    .detail-overview-row { display: flex; align-items: flex-start; gap: 32px; margin-top: 8px; }
    /* .detail-overview-col (overview text + its "More" button, stacked)
       is the actual flex item here, not .detail-overview itself — the
       button has to sit as a sibling below the clamped text rather than
       inside it, so the two need a shared wrapper to grow together as
       one flex item. */
    .detail-overview-row .detail-overview-col { flex: 1 1 auto; }
    .detail-overview-row .detail-overview { margin-top: 0; }
    /* margin-left:auto, not just flex:0 0 220px on its own — .detail-
       overview's own max-width:640px means it stops growing well short
       of a wide screen's real right edge, so without this the cast line
       just sat adjacent to wherever the overview text happened to end,
       not out at the right side of the row. This pushes it flush to
       the row's own right edge instead, independent of overview length
       — the text inside stays left-aligned, only its box moves. */
    .detail-overview-row .detail-cast-line { flex: 0 0 220px; margin-top: 0; margin-left: auto; }
  }

  /* Lower half of the detail page (below the hero) — a Prime-Video-style
     "Related" row (plain rowHtml, no new CSS needed — .row/.hscroll
     already left-align to the header via --row-inset, same as every
     other carousel row) followed by a two-column grid of self-contained
     cards, reusing the same card/border/radius language .settings-card
     already established. Unlike a carousel row, this grid isn't meant to
     bleed to the viewport edge on either side — it needs the SAME inset
     as --row-inset gives the left edge, but mirrored on the right too,
     so its cards line up with the header/hero column on both sides
     rather than just sitting inside main's own bare 14px padding. Single
     column until there's room for two side by side, same 860px
     breakpoint as .detail-overview-row above. */
  .detail-panels-grid {
    display: flex; flex-direction: column; gap: 16px; margin-top: 28px;
    padding: 0 calc(var(--edge-inset) - 14px);
  }
  @media (min-width: 860px) {
    .detail-panels-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 20px; }
  }
  .detail-panels-col { display: flex; flex-direction: column; gap: 16px; }
  .detail-panel {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 18px 20px;
  }
  /* Whatever heading starts a card (the title-repeat h2 below, or a
     .section-heading reused from elsewhere, e.g. relocated bulkAreaHtml)
     shouldn't carry its own top margin once it's the first thing in the
     card — .section-heading's 20px top margin assumes it's following
     other content, which isn't true here. */
  .detail-panel > :first-child { margin-top: 0; }

  /* Left column's first card repeats the title/genres/overview — Prime
     does this too (the same overview text shown twice on the page is
     deliberate, confirmed against their own layout), so this isn't
     read as a mistake once it's styled as its own separate card. */
  .detail-panel-title { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  .detail-panel-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .detail-panel-tag {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .detail-panel-overview-text { font-size: 16px; line-height: 1.5; color: var(--text); }
  .detail-panel-overview-text.clamped {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .detail-panel-more-btn {
    margin: 6px 0 0; padding: 0; background: none; border: none; color: var(--accent);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .detail-panel-more-btn:hover { text-decoration: underline; }

  /* "Creators and Cast" card — Directors/Producers/Cast/Studio, each a
     labeled row of comma-separated person links. Replaces the old
     crewRowHtml row that used to sit directly under the hero. */
  .creators-row { margin-top: 12px; font-size: 14px; }
  .creators-row:first-of-type { margin-top: 0; }
  .creators-row .label { color: var(--text-dim); font-size: 12px; margin-bottom: 2px; }
  .creators-row .value a { color: var(--text); }
  .creators-row .value a:hover { text-decoration: underline; }

  /* "Details" card — real fields only (certification/original language/
     release status); no fabricated content-advisory or subtitle data,
     since there's no source for either in this app. */
  .details-list { display: flex; flex-direction: column; gap: 10px; }
  .details-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .details-row .label { color: var(--text-dim); }
  .details-row .value { color: var(--text); text-align: right; }

  /* Page footer — sits after the cast carousel, the very bottom of the
     detail page. Reuses the header's own wordmark markup/colors
     (#topbarLogo .brand-wordmark) rather than a new logo treatment. */
  .detail-footer { margin-top: 56px; padding: 32px 0 40px; text-align: center; }
  .detail-footer .brand-wordmark { font-family: var(--font-display); font-weight: 800; font-size: 28px; }
  .detail-footer .brand-word-smith { color: var(--text); }
  .detail-footer .brand-word-flix { color: var(--accent); }

  /* Score ring: rounded stroke ends (matching the site's own pill
     language everywhere else — a plain conic-gradient div, the previous
     implementation, can only draw a hard-edged pie-slice arc with no
     rounded-cap option) via an inline SVG circle with stroke-linecap:
     round, filled with the site's own accent color rather than the
     traffic-light red/yellow/green this used before — reads as on-brand
     rather than a status indicator, per direct request. Sits in the
     action column where Prime's own like/dislike circles are, alongside
     the poster above it and the add/subscribe-state icon below. */
  .score-ring { width: 48px; height: 48px; position: relative; flex: 0 0 auto; }
  .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring circle { fill: none; stroke-width: 4; }
  .score-ring circle.track { stroke: var(--bg-card); }
  .score-ring circle.fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.3s ease; }
  .score-ring span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  /* Add/subscribe-state indicator — a tick (not yet added/subscribed,
     click adds) or a cross (already subscribed, click unsubscribes —
     movies have no unsubscribe concept, so this just mirrors the primary
     button's own state there instead of a second independent action).
     Same hover treatment as the header's own #searchToggleBtn/
     #settingsToggle (white circle, black icon) for consistency, per
     direct request. title carries the actual action in words, since an
     icon alone left it a guess. */
  /* Same 48px size as .score-ring, per direct request — they sit
     side by side in .detail-icon-row. */
  .detail-state-icon {
    width: 48px; height: 48px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg-card) 70%, transparent); border: 1px solid var(--border);
    color: var(--text); font-size: 22px;
  }
  .detail-state-icon:hover { background: #fff; color: var(--smithflix-charcoal); border-radius: 50%; }
  .detail-state-icon[disabled] { opacity: 0.5; pointer-events: none; }

  /* Big primary button (Prime's own "Play" pill) — reuses .add-btn's
     existing request/subscribe click handlers and ids verbatim (see
     renderMovie/renderShow), just sized up and set to the same white-
     pill look Prime's own Play button uses instead of this app's usual
     accent-colored add-btn fill. Width matches the poster above it
     (--detail-poster-w, see .detail-action-col) rather than being
     driven by its own text/padding, per direct request — .add-btn's
     shared nowrap/inline-flex is overridden here since a fixed width
     narrower than "+ Add to Plex" needs to wrap onto a second line
     instead of clipping. */
  .detail-action-col .add-btn {
    width: var(--detail-poster-w); min-height: 48px; height: auto;
    padding: 12px 14px; font-size: 16px; font-weight: 700;
    white-space: normal; text-align: center; justify-content: center;
    background: #fff; color: var(--smithflix-charcoal); border: none;
  }
  /* .unsubscribe-link keeps its real id/click-handler (wireSubscribeArea
     wires it exactly as before) but isn't shown as its own button here —
     the state icon above proxies a click onto it when showing the cross,
     so this only needs to exist in the DOM, not be visible. Standard
     visually-hidden pattern (not display:none, which would also block
     the programmatic .click() from working in some engines). */
  .detail-action-col .unsubscribe-link {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .section-heading { font-size: 15px; font-weight: 700; margin: 20px 0 10px; }

  /* Home's Prime-Video-style hero carousel — deliberately its own class
     rather than reusing .hero (which the movie/show detail pages and the
     Movies/TV landing pages still use, with its own bottom-up fade and
     poster+meta layout). Same negative-margin bleed-under-the-fixed-
     topbar trick as .hero. Only the first couple of slides ever carry a
     background video (see wireHomeHero's own trailer-fetch cap) — every
     other slide is a plain backdrop image, exactly like Prime's own
     storefront hero mixes video and poster slides in one carousel. */
  .home-hero {
    position: relative; width: calc(100% + 28px);
    margin: calc(-1 * (var(--topbar-h, 64px) + 14px)) -14px 18px;
    /* Literal black, not var(--bg-card) (a warm-tinted dark charcoal,
       #201e1c) — every fade/gradient on this hero is deliberately pure
       black per direct request, but this base layer was never updated
       to match, leaving a subtly warm tint showing wherever nothing else
       covers it (before a slide's art loads, or the gap beside a video
       before its own edge-blend). */
    /* Fluid, not a single min-width:640px jump — per direct request
       that the whole hero scale responsively, not just step between two
       fixed heights. Floor matches the old mobile height; by ~1310px
       viewport width it's already at the old desktop height (640px) and
       keeps growing a bit further before capping, so a genuinely wide
       desktop window gets a taller hero than either old fixed value. */
    min-height: clamp(450px, 38vw, 720px); overflow: hidden; background: #000;
  }
  .home-hero-slide {
    position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .home-hero-slide.active { opacity: 1; visibility: visible; pointer-events: auto; z-index: 1; }
  /* Explicit z-index (not auto) so this — poster and video together —
     forms its own stacking context: .home-hero-video-wrap's z-index
     below then only has to outrank the poster <img> *within* this box,
     not compete directly against .home-hero-fade/.home-hero-content at
     the slide level. Without this, a tied z-index between the fade and
     the video (both nested at different depths but landing in the same
     effective stacking context) left the fade painting *below* the
     video on real hero-width/video-width ratios — confirmed live: the
     gradient simply never reached the video at all, reading as a flat
     dark panel with a hard seam instead of a blend into it. */
  /* An <a>, not a <div>, per direct request — clicking the poster or
     the trailer itself goes straight to the title's own page, same
     href as the actions row's own info button. Safe to make the whole
     box clickable despite containing the video: both
     .home-hero-video-wrap and the <video> inside it are already
     pointer-events:none (unrelated reasons — see their own comments),
     so a click anywhere over them passes straight through to this
     anchor instead of being swallowed. .home-hero-content's own
     buttons/text sit in a separate sibling above this in paint order,
     so clicks there still hit those first, unaffected. */
  .home-hero-media { position: absolute; inset: 0; overflow: hidden; background: #000; z-index: 0; }
  /* Sits ABOVE the video (z-index 2 vs. its 1, both scoped inside
     .home-hero-media's own stacking context now) until wireHomeHero
     fades it out once the <video>'s own "playing" event actually fires.
     Poster-only slides simply never get that class added. */
  /* Right-anchored at its own native aspect ratio (height locked to the
     hero's, width left to auto) rather than stretched/cropped to fill
     the full hero width — matches Prime Video's own hero art exactly,
     confirmed against several of their real banners side by side: a
     backdrop that's natively wider reaches further left on its own
     (more of the actual photo visible before the gradient/black takes
     over), while a narrower one runs out of width sooner and sits
     further right, leaving more solid black on the left for the title
     text — entirely a side effect of height:100%/width:auto on a
     right-anchored image, no per-title logic needed. .home-hero-media's
     own overflow:hidden (and .home-hero's, above it) clips whatever
     spills past the left edge on a very wide one. */
  /* The left fade lives on the image itself (a mask, not a separate
     overlay div) specifically so it always starts at the image's own
     actual left edge — a plain overlay positioned against the HERO's
     edge instead (an earlier attempt) went fully transparent at a
     fixed distance from the hero's own edge regardless of where the
     image itself actually started, so a narrower image (whose edge
     sits well past that fixed distance on a wide window) got no
     visible blend at all, just a hard cut where its real pixels
     began. A mask's own gradient is positioned against the masked
     element's box, i.e. the image's own auto-width box, so this
     follows the image no matter how far left or right it lands.
     Distance is 2x the bottom fade's own 0%-to-clear span (50% of
     .home-hero-fade's height) per direct request — absolute calc()
     off the same clamp() as .home-hero's own height, same reasoning
     as that fade's own px conversion. */
  .home-hero-media img {
    position: absolute; top: 0; right: 0; height: 100%; width: auto;
    z-index: 2; transition: opacity 0.6s ease;
    mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
  }
  .home-hero-media img.home-hero-poster-hidden { opacity: 0; }
  /* Right-anchored, width auto (shrink-to-fit its own content — valid
     for an absolutely positioned box with only one of left/right set)
     so it's determined by the <video> element's own real rendered box,
     not an independent formula. Previously a fluid clamp() instead,
     specifically to avoid a pure 16:9-from-height box's "too much
     negative space on the left" on a wide desktop window (direct
     report) — reverted per a later direct request, since that
     independent width also meant the video's own left-edge mask
     fade started at a totally different x-position than the poster's
     own (native-aspect-driven) fade above it, leaving a gap neither
     fade actually covered where the two handed off. Auto-width
     guarantees they now share the same edge, at the cost of
     reintroducing the negative-space tradeoff.
     transform: scale() on the video below is paint-only and doesn't
     factor into this box's own layout size — it's sized off the
     video's true native aspect ratio regardless of zoom level, and
     the zoomed overflow gets clipped by this box's own
     overflow:hidden, same crop mechanism as before.
     The left-fade mask lives HERE, on the wrap, not on the video
     itself — confirmed live with a real downloaded trailer (native
     2.35:1, no baked-in letterboxing) that masking the video directly
     left a hard, still-partially-opaque edge instead of a clean fade
     to transparent. Root cause: mask-image is evaluated in an
     element's own local coordinate space and THEN the whole masked
     result gets transformed — scale(1.25) on the video zooms that
     already-masked output outward from center, pushing the mask's
     true "transparent" starting point (meant to sit at the video's
     left edge) off past this wrap's own clipping boundary, so a
     different, already-partway-faded point of the gradient ends up at
     the actual visible edge instead. The wrap has no transform of its
     own, so masking it instead — after the scaled video is clipped
     into it — keeps the mask's coordinate space undistorted. The
     poster img never had this problem since it has no transform to
     begin with. */
  .home-hero-video-wrap {
    position: absolute; top: 0; right: 0; height: 100%; width: auto;
    overflow: hidden; z-index: 1; pointer-events: none;
    mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0,
      rgba(0, 0, 0, 0.35) calc(0.4 * clamp(450px, 38vw, 720px)),
      black clamp(450px, 38vw, 720px));
  }
  /* A lot of trailers are cut at a wider cinematic aspect (e.g. 2.35:1)
     but delivered inside a plain 16:9 frame, with the difference baked
     in as literal black letterboxing bars — object-fit: cover alone
     can't crop that out on its own, since the video's *reported*
     dimensions are still 16:9 and cover only kicks in when the box and
     content ratios actually differ (now that this box is itself sized
     off the video's own true aspect ratio, box and content always
     match, so cover would never fire — dropped, no longer doing
     anything). A uniform zoom, clipped by the wrap's own
     overflow:hidden (a normal-flow, non-absolute child now, so it
     drives that wrap's own shrink-to-fit width instead of being forced
     to fill an independently-sized box), pushes those bars (and a
     little of the left/right edges) outside the visible box instead.
     There's no way to detect a given trailer's real embedded aspect
     from CSS, so this is one fixed factor tuned for the common
     2.35:1-in-16:9 case — a trailer with no letterboxing at all loses
     a bit more of its own edges than strictly needed, but that's a
     smaller cost than visible black bars. History: 1.28 originally,
     eased to 1.18 per direct request ("allowing for the zoom in to
     zoom out a bit"), up to 1.25 per a later direct request, then
     1.35 per a further direct request — shared by all three hero
     carousels (Home/Movies/TV all reuse this same rule now), so one
     change here covers all of them.
     The left fade itself is the wrap's own mask-image now (see its
     comment above), not this element's — a mask combined with a
     transform on the *same* element left a hard, still-partially-
     opaque edge instead of a clean fade, confirmed live. */
  /* Invisible until wireHomeHero explicitly reveals it (.home-hero-
     video-visible, toggled in lockstep with the poster's own hide/
     reveal) — a paused, merely-buffered <video> still renders its own
     first frame once it has enough data, with or without play() ever
     being called, so relying only on the (now partially transparent,
     see the wrap's own mask-image comment) poster/wrap sitting on top
     let that buffered frame bleed through during the lead-in, well
     before the trailer was meant to be visible at all — confirmed
     live with a real video file. */
  .home-hero-video-wrap video {
    display: block; height: 100%; width: auto; border: none; pointer-events: none;
    transform: scale(1.35);
    opacity: 0; transition: opacity 0.6s ease;
  }
  .home-hero-video-wrap video.home-hero-video-visible { opacity: 1; }
  /* .home-hero-video-wrap::before stays empty — the poster gradient
     below (a slide-level sibling that paints above the *entire* media
     box, poster and video-wrap alike — see the .home-hero-slide.active
     stacking-context comment above) already reaches over the trailer
     too, so a second one here would just double up. */
  .home-hero-video-wrap::before {
    content: ""; position: absolute; inset: 0; z-index: 2;
  }
  /* Bottom fade into the page's own black beneath the hero, plus a top
     fade carrying icon/text legibility for #topbar now that it no
     longer supplies its own gradient scrim over the hero (removed per
     direct request — this replaces it). The top fade is the bottom
     one's own curve mirrored top-to-bottom at half the peak opacity
     (0.5/0.325 vs. 1/0.65) but the *same* 0%/20%/50% distances, per
     direct request to match it exactly apart from the opacity. The
     matching left-to-right fade lives on .home-hero-media img itself
     now (a mask, not a layer here) — see its own comment for why a
     hero-relative overlay here couldn't work for every image
     position. */
  .home-hero-fade {
    position: absolute; inset: 0; z-index: 1;
    background-image:
      linear-gradient(to bottom,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0.325) 20%,
        rgba(0, 0, 0, 0) 50%),
      linear-gradient(to top,
        rgba(0, 0, 0, 1) 0%,
        rgba(0, 0, 0, 0.65) 20%,
        rgba(0, 0, 0, 0) 50%);
  }
  .home-hero-content {
    position: relative; z-index: 2; display: flex; align-items: flex-end;
    /* Same fluid height as .home-hero itself — the two have always
       needed to track each other exactly (this is what the hero's
       actual visible content height resolves to), so this repeats the
       identical clamp() rather than a shared variable so each is
       independently readable, matching the rest of the file's style. */
    min-height: clamp(450px, 38vw, 720px); padding: 24px var(--edge-inset) 44px;
  }
  /* Widened from a fixed 560px — necessary once the title itself
     roughly doubled (see .home-hero-info h1 below): unchanged, that box
     would only fit a handful of characters per line at the new size.
     Grows more modestly than the title/video do, though — some wrapping
     onto a second line is normal for a hero title at this size (Prime's
     own does the same for longer titles), and growing this as
     aggressively as the video box widens risked the two visually
     colliding, since they're independently positioned (this in normal
     flow, the video position:absolute; right:0) rather than sharing a
     flex row that would naturally keep them apart. */
  .home-hero-info { max-width: clamp(560px, 45vw, 760px); }
  /* ~2x the old fixed 44px/64px sizes, per direct request, and fluid
     rather than a single min-width:640px jump between them — floor is
     exactly double the old mobile size, ceiling exactly double the old
     desktop size, scaling smoothly by viewport width between. */
  .home-hero-info h1 { font-size: clamp(88px, 6vw + 58px, 128px); font-weight: 800; margin: 0 0 10px; line-height: 1.1; }
  .home-hero-badge {
    display: flex; align-items: center; gap: 6px; color: var(--status-complete);
    font-size: 17px; font-weight: 800; margin-bottom: 10px;
  }
  /* 2pt larger than the badge's own text, per direct request. */
  .home-hero-badge .material-symbols-rounded { font-size: 19px; }
  .home-hero-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  /* Explicit height (not padding-driven, like the shared .add-btn this
     overrides) so .home-hero-info-btn below can size its own circle to
     match exactly, per direct request — a padding-based height is a
     font-metrics-dependent guess, an explicit one is a number the icon
     button can just reuse directly. */
  .home-hero-actions .add-btn {
    display: inline-flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 26px; font-size: 16px;
  }
  /* Icon-only now (per direct request to drop the "More Info" label) —
     a circle sized to match .home-hero-actions .add-btn's own height
     exactly, so the two sit flush together at the same scale rather
     than the pill towering over a smaller circle or vice versa. */
  .home-hero-info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; font-size: 20px;
    border-radius: 50%; background: color-mix(in srgb, var(--bg-card) 70%, transparent);
    border: 1px solid var(--border); color: var(--text);
  }
  .home-hero-info-btn:active { background: var(--bg-card); }
  /* Same hover treatment as .home-hero-mute-btn's own (opacity:1,
     background:var(--bg-card)), per direct request. */
  .home-hero-info-btn:hover { opacity: 1; background: var(--bg-card); }
  .home-hero-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--text);
    display: flex; align-items: center; justify-content: center; opacity: 0.7;
  }
  /* Same hover treatment as .home-hero-mute-btn's own, per direct
     request — was its own color-mix(var(--bg)) tint before. */
  .home-hero-arrow:hover { opacity: 1; background: var(--bg-card); }
  .home-hero-arrow-left { left: 14px; }
  .home-hero-arrow-right { right: 14px; }
  /* Centered on the banner as a whole (not the text column) — matches
     Prime's own dot position exactly. */
  .home-hero-dots {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 32px; z-index: 3;
    display: flex; gap: 6px;
  }
  .home-hero-dot {
    width: 8px; height: 8px; border-radius: 999px; border: none;
    background: rgba(255, 255, 255, 0.4); transition: width 0.25s ease, background 0.25s ease; padding: 0;
  }
  .home-hero-dot.active { width: 22px; background: var(--smithflix-dot-active); }
  /* Age-rating badge (AU) — bottom-right corner, same small muted-pill
     treatment as Prime's own. Empty (and invisible — no border/padding
     shows on an empty element) until wireHomeHero's per-slide detail
     fetch resolves; a title with no AU rating on file just never gets
     one, same "quietly omit, don't show broken" rule the rest of this
     hero already follows for trailers/badges. */
  .home-hero-cert {
    position: absolute; right: var(--edge-inset); bottom: 32px; z-index: 3;
  }
  .home-hero-cert:not(:empty) {
    padding: 3px 8px; font-size: 12px; font-weight: 700; color: var(--text-dim);
    background: color-mix(in srgb, var(--bg) 55%, transparent); border: 1px solid var(--border); border-radius: 4px;
  }
  /* Muted by default (autoplay requires it anyway) — toggles the active
     slide's own <video>.muted directly, no postMessage/API round trip.
     Lives in the actions row now, right after .home-hero-info-btn (moved
     out of its own floating top-right circle per direct request — JS
     reparents this single shared button into whichever slide's own
     .home-hero-mute-slot is currently active, see wireHomeHero's
     refreshMuteButton), sized to match that button exactly rather than
     an independent guess. */
  .home-hero-mute-slot { display: contents; }
  .home-hero-mute-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; font-size: 20px; z-index: 3;
    border-radius: 50%; background: color-mix(in srgb, var(--bg-card) 70%, transparent);
    border: 1px solid var(--border); color: var(--text); opacity: 0.85;
  }
  .home-hero-mute-btn:hover { opacity: 1; background: var(--bg-card); }
  .home-hero-mute-btn[hidden] { display: none; }
  /* Hero height and title size used to step here at 640px — both are
     fluid clamp()s on their own base rules now (see .home-hero,
     .home-hero-content, .home-hero-info h1 above), so this breakpoint
     only has the button sizing left, which is a deliberate two-step
     jump rather than something that needs to track viewport width
     continuously. */
  @media (min-width: 640px) {
    .home-hero-actions .add-btn { height: 56px; padding: 0 32px; font-size: 17px; }
    .home-hero-info-btn, .home-hero-mute-btn { width: 56px; height: 56px; font-size: 22px; }
  }

  /* Scoped override, not the global --cast-w default (see :root) — this
     row alone scales up so a common desktop viewport shows exactly 9
     people at once, per direct request; every other consumer of
     --cast-w (there are none currently, but the variable stays global
     for any future one) keeps the smaller default. Now the very last
     content element on the page (see renderMovie/renderShow), so it
     gets more breathing room above it than the old 8px. */
  .cast-section { --cast-w: clamp(90px, 10vw, 150px); margin-top: 32px; }
  .cast-card { flex: 0 0 auto; width: var(--cast-w); }
  .cast-card img {
    width: var(--cast-w); height: var(--cast-w); border-radius: 50%; object-fit: cover;
    background: var(--bg-card); display: block;
  }
  .cast-card:hover .cast-name { color: var(--accent); }
  .cast-card .cast-name {
    font-size: 12.5px; font-weight: 600; margin-top: 6px; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cast-card .cast-character { font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 1px; }

  /* The primary action button (Add to Plex / Add Show / Watching /
     Paused) — a compact pill sitting next to the score ring, same slot
     TMDB's own "Play Trailer" button occupies. */
  .add-btn {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 12px 22px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: var(--accent-text); border: none; border-radius: 999px;
  }
  .add-btn:active { opacity: 0.85; }
  .add-btn[disabled] { background: var(--bg-card); color: var(--text-dim); }
  .add-confirm {
    margin-top: 14px; padding: 12px 14px; background: var(--bg-card);
    border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 10px;
  }

  @media (min-width: 860px) {
    /* .detail-hero-content's own min-height is already a fluid clamp()
       (matching .home-hero's), not a fixed size — no breakpoint jump
       needed for it the way the old .hero-content had. Poster width
       lives on --detail-poster-w (see .detail-action-col) so the add-btn
       below picks up the same jump automatically. */
    .detail-action-col { --detail-poster-w: 200px; }
    .detail-poster { height: 300px; }
    .detail-info h1 { font-size: 40px; }
    .add-btn { padding: 14px 28px; font-size: 16px; }
  }

  /* Show detail (Stage 14): subscribe state + bulk-download actions,
     styled alongside .add-btn above rather than as a separate system. */
  .unsubscribe-link {
    display: block; width: 100%; text-align: center; margin-top: 10px;
    background: none; border: none; color: var(--text-dim); font-size: 13.5px; text-decoration: underline;
  }
  .bulk-btn {
    width: 100%; margin-top: 10px; padding: 13px; font-size: 15px; font-weight: 600;
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
  }
  .bulk-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .bulk-btn:active { opacity: 0.85; }
  .bulk-btn[disabled] { color: var(--text-dim); opacity: 0.6; }
  /* Hover matches the header's own #searchToggleBtn/#settingsToggle
     treatment (white fill, charcoal content) for consistency across the
     site, per direct request — beats .bulk-btn.primary's own accent
     fill on specificity (3 class-level selectors vs. 2), so "Download
     complete series" (always accent blue at rest now, not just when the
     show has ended) still gets the same white hover as every other
     button here. :not([disabled]) so a disabled button doesn't flash
     this on hover. */
  .bulk-btn:not([disabled]):hover { background: #fff; color: var(--smithflix-charcoal); border-color: #fff; }
  .season-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .season-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px; background: var(--bg-card); border-radius: 10px; font-size: 14px;
  }
  .season-btn {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    background: none; color: var(--accent); border: 1px solid var(--accent);
  }
  .season-btn:active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .season-btn[disabled] { color: var(--text-dim); border-color: var(--border); }
  /* Same header-icon-matched hover as .bulk-btn above, for consistency
     across every download button in this card. */
  .season-btn:not([disabled]):hover { background: #fff; color: var(--smithflix-charcoal); border-color: #fff; }

  /* Status pills, shared between detail confirm + requests list */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .status-queued   { background: color-mix(in srgb, var(--status-queued) 22%, transparent); color: var(--status-queued); }
  .status-searching{ background: color-mix(in srgb, var(--status-searching) 22%, transparent); color: var(--status-searching); }
  .status-downloading{ background: color-mix(in srgb, var(--status-downloading) 22%, transparent); color: var(--status-downloading); }
  .status-complete { background: color-mix(in srgb, var(--status-complete) 22%, transparent); color: var(--status-complete); }
  .status-nomatch  { background: color-mix(in srgb, var(--status-nomatch) 22%, transparent); color: var(--status-nomatch); }
  .status-nospace  { background: color-mix(in srgb, var(--status-nospace) 22%, transparent); color: var(--status-nospace); }
  .status-failed   { background: color-mix(in srgb, var(--status-failed) 22%, transparent); color: var(--status-failed); }
  .status-dot.status-queued { background: var(--status-queued); }
  .status-dot.status-searching { background: var(--status-searching); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-downloading { background: var(--status-downloading); animation: pulse 1.1s ease-in-out infinite; }
  .status-dot.status-complete { background: var(--status-complete); }
  .status-dot.status-nomatch { background: var(--status-nomatch); }
  .status-dot.status-nospace { background: var(--status-nospace); }
  .status-dot.status-failed { background: var(--status-failed); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* Requests list */
  /* Symmetric --row-inset on top of main's own 14px (== --edge-inset,
     64px, on both sides) rather than the asymmetric left-only/reach-
     the-edge treatment .hscroll/.grid use — this is a plain vertical
     list, not a horizontally-scrolling row, so there's no "reaches
     the true edge" affordance to preserve on the right. Per direct
     request to line other pages' content up with Home's own spacing,
     which this sat inside of at main's plain 14px inset before. */
  #requestsList { padding: 0 var(--row-inset); }
  .req-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 4px; border-bottom: 1px solid var(--border);
  }
  .req-main { min-width: 0; flex: 1; }
  .req-title {
    display: block; font-size: 15.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .req-title:active { opacity: 0.7; }
  .req-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .req-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

  /* Requests list grouping (Stage 14.x): a show's episode/pack requests
     collapse into one "Lanterns"-style row with an expand arrow, instead
     of one flat row per episode. Movies stay ungrouped. The header row
     itself toggles on click (see the delegated handler, which skips the
     toggle when the click actually landed on the <a> title so navigating
     to the show still works); the arrow button is just a visual/keyboard
     affordance for the same action. */
  .req-group-header { cursor: pointer; }
  .req-group-header:active { background: var(--bg-card); }
  .req-group-toggle-btn {
    flex: 0 0 auto; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-dim); font-size: 11px;
  }
  .req-group-children { padding-left: 30px; }
  .req-child-row { padding: 10px 4px; }
  .req-child-row .req-title { font-size: 14px; font-weight: 500; color: var(--text-dim); }

  .watch-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .watch-link {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  }
  .watch-link:active { background: var(--bg-card); }
  .cancel-btn {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: transparent; color: var(--status-nospace); border: 1px solid var(--status-nospace);
  }
  .cancel-btn:active { background: color-mix(in srgb, var(--status-nospace) 18%, transparent); }
  .cancel-btn[disabled] { opacity: 0.5; }
  /* A finished download's "Cancel" is really "delete" (there's nothing
     left in progress to cancel) — a plain circular X reads simpler than
     a text pill for that, same treatment as .search-clear-btn. */
  .req-delete-btn {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
