        </a>`
      )
      .join("");
    return `<section class="cast-section row">
      <h2 class="section-heading">Top Billed Cast</h2>
      ${hscrollHtml(cards)}
    </section>`;
  }

  // A cast member's own page — their filmography, reusing the exact same
  // posterCard/.grid this app already uses for every other mixed movie/TV
  // list, since /api/person/{id} already tags each credit with its own
  // media_type (see api.py's get_person_detail).
  async function renderPerson(id) {
    setChrome({ title: "", showBack: true, activeTab: null });
    app.innerHTML = loadingHtml();
    try {
      const person = await getPerson(id);
      document.title = `${person.name || ""} — Smithflix`;
      const count = person.credits.length;
      app.innerHTML = `
        <h1 class="page-title">${escapeHtml(person.name || "Unknown")}</h1>
        <div class="page-subtitle">${count} result${count === 1 ? "" : "s"} with ${escapeHtml(person.name || "this person")}</div>
        ${count
          ? `<div class="grid">${person.credits.map((c) => posterCard(c, c.media_type)).join("")}</div>`
          : emptyHtml("No filmography found.")}
      `;
    } catch (err) {
      app.innerHTML = errorHtml(err.message, "#/home");
    }
  }

  async function renderMovie(id) {
    setChrome({ title: "", showBack: true, activeTab: "movies", hasHero: true });
    app.innerHTML = loadingHtml();
    try {
      const movie = await getMovie(id);
      document.title = `${movie.title || movie.original_title || ""} — Smithflix`;
      const runtime = movie.runtime ? `${Math.floor(movie.runtime / 60)}h ${movie.runtime % 60}m` : "";
      const backdrop = backdropUrl(movie.backdrop_path);
      const certification = certificationOf(movie);
      const cast = movie.credits?.cast;
      const crew = movie.credits?.crew;
      const year = yearOf(movie.release_date);

      app.innerHTML = `
        <div class="hero" style="${backdrop ? `background-image:url('${backdrop}')` : ""}">
          <div class="hero-content">
            <div class="detail-poster-wrap">
              <img class="detail-poster" src="${posterUrl(movie.poster_path)}" alt="">
              ${movie.on_plex ? `<div class="on-plex-badge">On Plex</div>` : ""}
            </div>
            <div class="detail-info">
              <h1>${escapeHtml(movie.title || movie.original_title)}${year ? ` <span class="hero-year">(${year})</span>` : ""}</h1>
              <div class="detail-meta">
                ${certification ? `<span class="cert-badge">${escapeHtml(certification)}</span>` : ""}
                <span>${escapeHtml(genreLine(movie.genres))}</span>
                ${runtime ? `<span>${escapeHtml(runtime)}</span>` : ""}
              </div>
              <div class="hero-actions">
                ${scoreRowHtml(movie.vote_average)}
                ${movie.is_coming_soon
                  ? `<button class="add-btn" id="addBtn" disabled title="Not out digitally yet">+ Add to Plex</button>`
                  : `<button class="add-btn" id="addBtn">+ Add to Plex</button>`}
              </div>
              ${movie.tagline ? `<div class="tagline">${escapeHtml(movie.tagline)}</div>` : ""}
            </div>
          </div>
        </div>
        <div id="addResult"></div>
        <h2 class="section-heading">Overview</h2>
        <div class="detail-overview">${escapeHtml(movie.overview) || "<em>No synopsis available.</em>"}</div>
        ${crewRowHtml(crew)}
        ${castSectionHtml(cast)}
      `;

      // Coming Soon titles render the button disabled (see the markup
      // above) — skip wiring a handler onto it entirely rather than
      // relying only on the disabled attribute to block the click.
      if (!movie.is_coming_soon) document.getElementById("addBtn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "Adding…";
        const resultBox = document.getElementById("addResult");
        try {
          const req = await createRequest(Number(id), movie.title);
          btn.textContent = "Added";
          resultBox.innerHTML = `<div class="add-confirm" id="addConfirm">
            ${statusPillHtml(req.status)}
            <span>We'll grab the best copy automatically.</span>
          </div>`;
          const poll = setInterval(async () => {
            try {
              const updated = await getRequest(req.id);
              document.getElementById("addConfirm").innerHTML =
                `${statusPillHtml(updated.status)}<span>${statusFollowupText(updated)}</span>`;
              if (!NON_TERMINAL.has(updated.status)) clearInterval(poll);
            } catch (e) { clearInterval(poll); }
          }, 4000);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "+ Add to Plex";
          resultBox.innerHTML = `<div class="add-confirm">Couldn't add that: ${escapeHtml(err.message)}</div>`;
        }
      });
    } catch (err) {
      app.innerHTML = errorHtml(err.message);
    }
  }

  function statusFollowupText(req) {
    switch (req.status) {
      case "downloading": return "It's on its way — check My Requests for progress.";
      case "complete": return "Done — it should show up in Plex shortly.";
      case "no qualifying results": return "Nothing that meets our quality bar was found.";
      case "insufficient free space": return "Found a match, but there's not enough space to add it.";
      case "failed": return "Something went wrong — see My Requests.";
      default: return "We'll grab the best copy automatically.";
    }
  }

  const RETENTION_OPTIONS = [
    { days: "", label: "Keep forever" },
    { days: 30, label: "Clear after 30 days" },
    { days: 60, label: "Clear after 60 days" },
    { days: 90, label: "Clear after 90 days" },
    { days: 180, label: "Clear after 180 days" },
    { days: 365, label: "Clear after 1 year" },
  ];

  function retentionOptionsHtml(selectedDays) {
    return RETENTION_OPTIONS.map((o) => {
      const isSelected = (selectedDays || "") === o.days;
      return `<button class="retention-option" data-days="${o.days}">
        <span>${o.label}</span>${isSelected ? `<span class="check">&#10003;</span>` : ""}
      </button>`;
    }).join("");
  }

  async function renderRequests() {
    setChrome({ title: "My Requests", showBack: false, activeTab: "requests" });
    requestsExpandedGroups = new Set();
    app.innerHTML = `
      <div id="requestsList">${loadingHtml()}</div>
      <div class="clear-requests-fab">
        <div class="split-btn">
          <button id="clearRequestsBtn" class="split-btn-main">Clear My Requests</button>
          <div class="split-btn-divider"></div>
          <button id="retentionMenuBtn" class="split-btn-arrow" aria-label="Auto-clear options">&#9662;</button>
        </div>
        <div id="retentionMenu" class="retention-menu" hidden></div>
      </div>
    `;
    await loadRequests();
    activePollTimer = setInterval(loadRequests, 5000);

    try {
      const retention = await getRetention();
      document.getElementById("retentionMenu").innerHTML = retentionOptionsHtml(retention.days);
    } catch (err) { /* menu just stays empty if this fails */ }

    document.getElementById("clearRequestsBtn").addEventListener("click", async () => {
      if (!confirm("Clear finished, cancelled, and failed requests from history? Active downloads won't be affected.")) return;
      try {
        await clearRequests();
        await loadRequests();
      } catch (err) {
        alert(`Couldn't clear requests: ${err.message}`);
      }
    });
  }

  // A pack row's scope, as a short label — "Season N", "Season N-M"
  // (Stage 14.x's range packs), or "Complete Series".
  function packScopeLabel(r) {
    if (r.season_number == null) return "Complete Series";
    if (r.season_range_end != null) return `Season ${r.season_number}-${r.season_range_end}`;
    return `Season ${r.season_number}`;
  }

  // A standalone row's full label/link — used for movies (always
  // standalone) and as a fallback for any episode/pack row that somehow
  // has no show_id to group under.
  function requestLabelAndHref(r) {
    if (r.media_type === "episode") {
      return { label: `${r.title} S${pad2(r.season_number)}E${pad2(r.episode_number)}`, href: `#/tv/${r.tmdb_id}` };
    }
    if (r.media_type === "pack") {
      return { label: `${r.title} — ${packScopeLabel(r)}`, href: `#/tv/${r.tmdb_id}` };
    }
    return { label: `${r.title}${r.release_year ? ` (${r.release_year})` : ""}`, href: `#/movies/${r.tmdb_id}` };
  }

  // A child row's label omits the show title — that's already the group
  // header above it — just "which episode/season this row was for".
  function childLabelAndHref(r) {
    if (r.media_type === "episode") {
      return { label: `S${pad2(r.season_number)}E${pad2(r.episode_number)}`, href: `#/tv/${r.tmdb_id}` };
    }
    return { label: packScopeLabel(r), href: `#/tv/${r.tmdb_id}` };
  }

  // "Cancel" only really makes sense while something's still in progress
  // (queued/downloading) — a "complete" request has nothing left to
  // cancel, so its action is really "delete the download," shown as a
  // plain X instead of the same red text pill.
  function cancelActionHtml(r) {
    if (!CANCELLABLE.has(r.status)) return "";
    if (r.status === "complete") {
      return `<button class="req-delete-btn" data-request-id="${r.id}" data-status="${r.status}" aria-label="Delete">&#10005;</button>`;
    }
    return `<button class="cancel-btn" data-request-id="${r.id}" data-status="${r.status}">Cancel</button>`;
  }

  function requestRowHtml(r) {
    const { label, href } = requestLabelAndHref(r);
    return `
      <div class="req-row">
        <div class="req-main">
          <a class="req-title" href="${href}">${escapeHtml(label)}</a>
          <div class="req-sub">${new Date(r.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</div>
        </div>
        <div class="req-actions">
          ${statusPillHtml(r.status)}
          ${cancelActionHtml(r)}
        </div>
      </div>
    `;
  }

  function requestChildRowHtml(r) {
    const { label, href } = childLabelAndHref(r);
    return `
      <div class="req-row req-child-row">
        <div class="req-main">
          <a class="req-title" href="${href}">${escapeHtml(label)}</a>
          <div class="req-sub">${new Date(r.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</div>
        </div>
        <div class="req-actions">
          ${statusPillHtml(r.status)}
          ${cancelActionHtml(r)}
        </div>
      </div>
    `;
  }

  // Which single status best represents a whole group at a glance —
  // anything still actively in motion (downloading/searching/queued)
  // outranks a terminal one, so "one episode is still downloading" never
  // gets hidden behind five other episodes that already finished.
  const GROUP_STATUS_PRIORITY = [
    "downloading", "searching", "queued",
    "no qualifying results", "insufficient free space", "downloaded, not filed", "failed",
    "complete", "cancelled",
  ];
  function dominantStatus(rows) {
    for (const s of GROUP_STATUS_PRIORITY) {
      if (rows.some((r) => r.status === s)) return s;
    }
    return rows[0].status;
  }

  function requestGroupHtml(group, expanded) {
    const children = group.rows.slice().sort((a, b) => b.id - a.id).map(requestChildRowHtml).join("");
    return `
      <div class="req-group">
        <div class="req-row req-group-header" data-toggle-group="${group.showId}">
          <button class="req-group-toggle-btn" data-toggle-group="${group.showId}" aria-label="${expanded ? "Collapse" : "Expand"}">
            ${expanded ? "▼" : "▶"}
          </button>
          <div class="req-main">
            <a class="req-title" href="#/tv/${group.tmdbId}">${escapeHtml(group.title)}</a>
            <div class="req-sub">${group.rows.length} item${group.rows.length === 1 ? "" : "s"}</div>
          </div>
          <div class="req-actions">${statusPillHtml(dominantStatus(group.rows))}</div>
        </div>
        <div class="req-group-children" ${expanded ? "" : "hidden"}>${children}</div>
      </div>
    `;
  }

  // Groups episode/pack rows by show — "Lanterns" appears once with an
  // expandable list of its own requests underneath, instead of one flat
  // row per episode cluttering the page. Movies are always standalone.
  // Sorted by each item's most recent row id, so the merged list still
  // reads newest-first overall, same as the plain (ungrouped) order did.
  function groupRequestsForDisplay(rows) {
    const groupsById = new Map();
    const items = [];
    for (const r of rows) {
      if (r.media_type === "movie" || r.show_id == null) {
        items.push({ type: "movie", repId: r.id, row: r });
        continue;
      }
      let group = groupsById.get(r.show_id);
      if (!group) {
        group = { type: "group", showId: r.show_id, tmdbId: r.tmdb_id, title: r.title, rows: [], repId: r.id };
        groupsById.set(r.show_id, group);
        items.push(group);
      }
      group.rows.push(r);
      group.repId = Math.max(group.repId, r.id);
    }
    return items.sort((a, b) => b.repId - a.repId);
  }

  async function loadRequests() {
    const listEl = document.getElementById("requestsList");
    try {
      const rows = await listRequests();
      if (!rows.length) {
        listEl.innerHTML = emptyHtml("Nothing requested yet — find a movie or show and tap Add.");
        return;
      }
      listEl.innerHTML = groupRequestsForDisplay(rows)
        .map((item) => item.type === "movie" ? requestRowHtml(item.row) : requestGroupHtml(item, requestsExpandedGroups.has(item.showId)))
        .join("");
    } catch (err) {
      listEl.innerHTML = errorHtml(err.message, "#/requests");
    }
  }

  async function renderSettings() {
    setChrome({ title: "Settings", showBack: true, activeTab: null });
    app.innerHTML = `
      <div class="settings-grid">
        <section class="settings-card" id="pipelineSection">${loadingHtml()}</section>
        <section class="settings-card" id="tvScheduleSection">${loadingHtml()}</section>
        <section class="settings-card" id="plexSection">${loadingHtml()}</section>
        <section class="settings-card" id="updateSection">
          <h2>Update</h2>
          <button class="settings-btn" id="deployBtn">Check for updates</button>
        </section>
      </div>
      <div class="about-footer">Smithflix</div>
    `;
    await Promise.all([
      renderPipelineSection(),
      renderTvScheduleSection(),
      refreshPlexSettings(),
    ]);
    document.getElementById("deployBtn").addEventListener("click", triggerDeploy);
  }

  // -- Stage 7: pipeline preferences (resolution floor, size range,
  //    language lists). Takes effect on the very next request — no
  //    restart, no deploy. Whole-panel visibility is the same accepted-
  //    risk call as everything else in Settings: anyone with the frontend
  //    open on the LAN can edit these. --

  const RESOLUTION_OPTIONS = [
    { value: "2160p", label: "2160p / 4K" },
    { value: "1080p", label: "1080p" },
    { value: "720p", label: "720p" },
    { value: "480p", label: "480p" },
  ];

  // Fixed list rather than free text — a release's language tag is
  // matched literally (whole-word) against its filename, so picking from
  // known real-world tags beats typing them out by hand every time.
  const LANGUAGE_OPTIONS = [
    "English", "Spanish", "French", "German", "Italian", "Portuguese",
    "Dutch", "Russian", "Polish", "Swedish", "Norwegian", "Danish",
    "Finnish", "Turkish", "Arabic", "Hindi", "Japanese", "Korean",
    "Chinese", "Multi", "Dual Audio",
  ];

  function langSelectSummary(selected) {
    if (selected.length === 0) return "Any";
    if (selected.length <= 2) return selected.join(", ");
    return `${selected.length} selected`;
  }

  function languageMultiSelectHtml(id, selected) {
    const selectedLower = new Set(selected.map((s) => s.toLowerCase()));
    return `
      <details class="lang-select" id="${id}">
        <summary class="lang-select-summary">${escapeHtml(langSelectSummary(selected))}</summary>
        <div class="lang-select-panel">
          ${LANGUAGE_OPTIONS.map((opt) => `
            <label class="lang-select-option">
              <input type="checkbox" value="${opt}" ${selectedLower.has(opt.toLowerCase()) ? "checked" : ""}>
              ${opt}
            </label>
          `).join("")}
        </div>
      </details>
    `;
  }

  // Keeps the closed-state summary text in sync as boxes are (un)checked —
  // otherwise it'd only reflect the value as of the last full render.
  function wireLanguageMultiSelect(id) {
    const el = document.getElementById(id);
    const summaryEl = el.querySelector("summary");
    el.querySelectorAll("input[type=checkbox]").forEach((box) => {
      box.addEventListener("change", () => {
        const chosen = Array.from(el.querySelectorAll("input[type=checkbox]:checked")).map((b) => b.value);
        summaryEl.textContent = langSelectSummary(chosen);
      });
    });
  }

  function readLanguageMultiSelect(id) {
    return Array.from(document.querySelectorAll(`#${id} input[type=checkbox]:checked`)).map((b) => b.value);
  }

  // Stashed on render, sent back unchanged on save — the qBittorrent
  // category field isn't exposed in this UI (nothing here needs to touch
  // it), but the settings endpoint's "always send the full desired
  // state, null = reset to default" convention means simply omitting it
  // would silently reset any previously-customized value on every save.
  let pipelineCategory = null;

  async function renderPipelineSection() {
    const section = document.getElementById("pipelineSection");
    try {
      const s = await getPipelineSettings();
      pipelineCategory = s.category;
      section.innerHTML = `
        <h2>Download preferences</h2>
        <div class="settings-field">
          <label for="pfMinResolution">Minimum resolution</label>
          <select id="pfMinResolution">
            ${RESOLUTION_OPTIONS.map((r) => `<option value="${r.value}" ${r.value === s.min_resolution ? "selected" : ""}>${r.label}</option>`).join("")}
          </select>
          <div class="settings-hint">A better release still wins when one's found — this is just a floor.</div>
        </div>
        <div class="settings-field">
          <label>Size range (GB)</label>
          <div class="settings-size-range">
            <input type="number" id="pfMinSize" min="0" step="1" value="${s.min_size_gb}">
            <span>to</span>
            <input type="number" id="pfMaxSize" min="0" step="1" value="${s.max_size_gb}">
          </div>
        </div>
        <div class="settings-field">
          <label for="pfAllowlist">Only allow these languages</label>
          ${languageMultiSelectHtml("pfAllowlist", s.language_allowlist)}
        </div>
        <div class="settings-field">
          <label for="pfRequired">Must include all of these languages</label>
          ${languageMultiSelectHtml("pfRequired", s.language_required)}
          <div class="settings-hint">For multi-audio releases, e.g. requiring English and Spanish together.</div>
        </div>
        <div class="settings-field">
          <label for="pfBlocklist">Never allow these languages</label>
          ${languageMultiSelectHtml("pfBlocklist", s.language_blocklist)}
        </div>
        <button class="settings-btn" id="pipelineSaveBtn">Save</button>
        <div class="settings-save-error" id="pipelineSaveError" hidden></div>
      `;
      wireLanguageMultiSelect("pfAllowlist");
      wireLanguageMultiSelect("pfRequired");
      wireLanguageMultiSelect("pfBlocklist");
      document.getElementById("pipelineSaveBtn").addEventListener("click", savePipelineSettings);
    } catch (err) {
      section.innerHTML = `<h2>Download preferences</h2><div class="plex-error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function savePipelineSettings() {
    const btn = document.getElementById("pipelineSaveBtn");
    const errorEl = document.getElementById("pipelineSaveError");
    errorEl.hidden = true;

    const minSize = Number(document.getElementById("pfMinSize").value);
    const maxSize = Number(document.getElementById("pfMaxSize").value);
    if (!(minSize < maxSize)) {
      errorEl.textContent = "Minimum size must be less than maximum size.";
      errorEl.hidden = false;
      return;
    }

    const body = {
      category: pipelineCategory,
      min_resolution: document.getElementById("pfMinResolution").value,
      min_size_gb: minSize,
      max_size_gb: maxSize,
      language_allowlist: readLanguageMultiSelect("pfAllowlist"),
      language_blocklist: readLanguageMultiSelect("pfBlocklist"),
      language_required: readLanguageMultiSelect("pfRequired"),
    };

    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      await setPipelineSettings(body);
      btn.textContent = "Saved";
      setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 1200);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Save";
    }
  }

  // -- Stage 12.x: how often subscribed shows get checked for new
  //    episodes, and the optional auto-recheck (retry a stuck episode, or
  //    look for a better release once one's already downloaded). Same
  //    "takes effect on the next wake-up, no restart" pattern as Download
  //    preferences above. Auto-recheck defaults off — it's new, automatic,
  //    unattended behavior, including replacing an already-downloaded
  //    file on an upgrade, so it stays opt-in until turned on here. --

  async function renderTvScheduleSection() {
    const section = document.getElementById("tvScheduleSection");
    try {
      const s = await getTvSettings();
      section.innerHTML = `
        <h2>TV show scheduling</h2>
        <div class="settings-field">
          <label for="tvCheckInterval">Check subscribed shows every (hours)</label>
          <input type="number" id="tvCheckInterval" min="0.5" step="0.5" value="${s.show_check_interval_hours}">
        </div>
        <div class="settings-field">
          <label for="tvAirBuffer">Wait this long after air date before searching (hours)</label>
          <input type="number" id="tvAirBuffer" min="0" step="1" value="${s.episode_air_buffer_hours}">
          <div class="settings-hint">Avoids searching before a real release exists — 0 searches immediately.</div>
        </div>
        <div class="settings-field">
          <label class="settings-checkbox-label">
            <input type="checkbox" id="tvRecheckEnabled" ${s.episode_recheck_enabled ? "checked" : ""}>
            Automatically recheck episodes &amp; season packs
          </label>
          <div class="settings-hint">Retries empty searches and upgrades to a better release when found.</div>
        </div>
        <div class="settings-field">
          <label for="tvRecheckInterval">Recheck every (hours)</label>
          <input type="number" id="tvRecheckInterval" min="0.1" step="0.1" value="${s.episode_recheck_interval_hours}">
        </div>
        <div class="settings-field">
          <label for="tvRecheckLimit">Stop rechecking after this many attempts</label>
          <input type="number" id="tvRecheckLimit" min="0" step="1" value="${s.episode_recheck_max_attempts}">
          <div class="settings-hint">0 means keep rechecking indefinitely.</div>
        </div>
        <button class="settings-btn" id="tvScheduleSaveBtn">Save</button>
        <div class="settings-save-error" id="tvScheduleSaveError" hidden></div>
      `;
      document.getElementById("tvScheduleSaveBtn").addEventListener("click", saveTvScheduleSettings);
    } catch (err) {
      section.innerHTML = `<h2>TV show scheduling</h2><div class="plex-error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function saveTvScheduleSettings() {
    const btn = document.getElementById("tvScheduleSaveBtn");
    const errorEl = document.getElementById("tvScheduleSaveError");
    errorEl.hidden = true;

    const body = {
      show_check_interval_hours: Number(document.getElementById("tvCheckInterval").value),
      episode_air_buffer_hours: Number(document.getElementById("tvAirBuffer").value),
      episode_recheck_enabled: document.getElementById("tvRecheckEnabled").checked,
      episode_recheck_interval_hours: Number(document.getElementById("tvRecheckInterval").value),
      episode_recheck_max_attempts: Number(document.getElementById("tvRecheckLimit").value),
    };

    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      await setTvSettings(body);
      btn.textContent = "Saved";
      setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 1200);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Save";
    }
  }

  // -- Stage 6: self-update. A plain visible button — not real auth (anyone
  //    with the frontend open on the LAN can trigger it), an accepted risk
  //    per the confirmed architecture: the endpoint only ever runs one
  //    fixed `git pull`, never an arbitrary command. --

  async function triggerDeploy() {
    const btn = document.getElementById("deployBtn");
    if (!confirm("Pull the latest deployed code from git now?")) return;
    btn.disabled = true;
    btn.textContent = "Deploying…";
    try {
      const result = await postDeploy();
      alert(`Deployed: ${result.detail}\nNow at ${result.commit}`);
    } catch (err) {
      alert(`Deploy failed: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = "Check for updates";
    }
  }

  async function refreshPlexSettings() {
    const section = document.getElementById("plexSection");
    try {
      const status = await getPlexStatus();
      section.innerHTML = `
        <h2>Plex</h2>
        ${status.linked ? `
          <div class="plex-connected">Connected as <strong>${escapeHtml(status.username || "your account")}</strong>${status.server_name ? ` · ${escapeHtml(status.server_name)}` : ""}</div>
          <button class="settings-btn danger" id="plexUnlinkBtn">Disconnect</button>
        ` : `
          <div class="plex-hint">Keeps completed downloads recognized even after qBittorrent clears them.</div>
          <button class="settings-btn" id="plexLinkBtn" ${status.pending ? "disabled" : ""}>${status.pending ? "Waiting for sign-in…" : "Sign in with Plex"}</button>
          ${status.error ? `<div class="plex-error">${escapeHtml(status.error)}</div>` : ""}
        `}
      `;
      const linkBtn = document.getElementById("plexLinkBtn");
      if (linkBtn) {
        linkBtn.addEventListener("click", async () => {
          linkBtn.disabled = true;
          linkBtn.textContent = "Opening Plex…";
          try {
            const { auth_url } = await startPlexLink();
            window.open(auth_url, "_blank");
            await refreshPlexSettings();
          } catch (err) {
            linkBtn.disabled = false;
            linkBtn.textContent = "Sign in with Plex";
            alert(`Couldn't start Plex sign-in: ${err.message}`);
          }
        });
      }
      const unlinkBtn = document.getElementById("plexUnlinkBtn");
      if (unlinkBtn) {
        unlinkBtn.addEventListener("click", async () => {
          if (!confirm("Disconnect Plex?")) return;
          await unlinkPlex();
          await refreshPlexSettings();
        });
      }
      if (status.pending) {
        activePollTimer = setTimeout(refreshPlexSettings, 3000);
      }
    } catch (err) {
      section.innerHTML = errorHtml(err.message, "#/settings");
    }
  }

  // -- Search (Prime-Video-style overlay, toggled from the header icon) --

  const searchInput = document.getElementById("searchInput");
  const searchIconBtn = document.getElementById("searchIconBtn");
  const searchClearBtn = document.getElementById("searchClearBtn");
  const searchToggleBtn = document.getElementById("searchToggleBtn");
  const searchOverlay = document.getElementById("searchOverlay");
  function openSearchOverlay() {
    searchOverlay.hidden = false;
    // #topbar itself sits above the overlay and outside it, so it needs
    // its own signal to pick up the same tint (see body.search-open
    // #topbar) — without this it kept whatever background its other
    // states (hero gradient, scrolled frosted glass) already gave it,
    // staying see-through to the sharp, unblurred hero behind it while
    // everything below it in the overlay was dimmed and blurred.
    document.body.classList.add("search-open");
    searchToggleBtn.setAttribute("aria-expanded", "true");
    searchInput.focus();
  }
  function closeSearchOverlay() {
    searchOverlay.hidden = true;
    document.body.classList.remove("search-open");
    searchToggleBtn.setAttribute("aria-expanded", "false");
  }
  function submitSearch() {
    if (searchInput.value.trim()) {
      navigate(`#/search/${encodeURIComponent(searchInput.value.trim())}`);
      closeSearchOverlay();
    }
  }
  // Clear-x only shows once there's text — the search glyph on the left
  // is permanent chrome now (Prime's own pill keeps it there too), not a
  // toggle-with-clear pair sharing one slot like the old inline bar had.
  function updateSearchClearBtn() {
    searchClearBtn.hidden = !searchInput.value;
  }
  searchToggleBtn.addEventListener("click", () => {
    if (searchOverlay.hidden) openSearchOverlay(); else closeSearchOverlay();
  });
  // Closes on a click anywhere in the dimmed backdrop, but not one that
  // started inside the pill itself — e.currentTarget is always the
  // overlay (listener is attached there), so this only fires for a
  // direct backdrop click, same pattern as any other modal-dismiss.
  searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeSearchOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !searchOverlay.hidden) closeSearchOverlay();
  });
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSearch(); });
  // type="search" also fires a native "search" event on Enter/the clear-x —
  // catches it even if a keydown listener alone doesn't (e.g. Safari's own
  // handling of the field's built-in submit affordance).
  searchInput.addEventListener("search", submitSearch);
  searchInput.addEventListener("input", updateSearchClearBtn);
  searchIconBtn.addEventListener("click", submitSearch);
  searchClearBtn.addEventListener("click", () => {
    searchInput.value = "";
    updateSearchClearBtn();
    searchInput.focus();
  });

  // Revolving placeholder: types a suggested title out, holds, deletes it,
  // then moves to the next one — a terminal-style typing effect. Written
  // to the `placeholder` attribute, so it only ever shows while the field
  // is genuinely empty (the browser hides a placeholder the instant there's
  // real text) and never touches `value` or interferes with typing/search.
  const SEARCH_SUGGESTIONS = ["Dune", "The Godfather", "Inception", "Interstellar", "Parasite", "The Dark Knight"];
  const TYPE_MS = 90;
  const DELETE_MS = 45;
  const HOLD_MS = 2400;
  const BETWEEN_MS = 1000;
  (function runSearchPlaceholderTypewriter() {
    let phrase = 0;
    let chars = 0;
    let deleting = false;
    function tick() {
      const target = `Search "${SEARCH_SUGGESTIONS[phrase]}"…`;
      if (!deleting) {
        chars++;
        searchInput.placeholder = target.slice(0, chars);
        if (chars === target.length) { deleting = true; setTimeout(tick, HOLD_MS); return; }
        setTimeout(tick, TYPE_MS);
      } else {
        chars--;
        searchInput.placeholder = target.slice(0, chars);
        if (chars === 0) {
          deleting = false;
          phrase = (phrase + 1) % SEARCH_SUGGESTIONS.length;
          setTimeout(tick, BETWEEN_MS);
          return;
        }
        setTimeout(tick, DELETE_MS);
      }
    }
    tick();
  })();

  document.getElementById("settingsToggle").addEventListener("click", () => navigate("#/settings"));

  route();
})();
</script>
</body>
</html>
