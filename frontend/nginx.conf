# TMDB image cache — the zone for `location ^~ /img/` further down.
# Declared out here because proxy_cache_path is an http-context
# directive and this whole file is included into http{} as
# conf.d/default.conf.
#
#   keys_zone=tmdb:10m  metadata for ~80k objects, far more than
#                       max_size can hold at TMDB's image sizes.
#   max_size=5g         the hard ceiling. nginx evicts least-recently-used
#                       to stay under it, so this can never grow into the
#                       pool no matter how much of TMDB gets browsed.
#   inactive=30d        and an image nobody has looked at in a month goes
#                       even if the cache is nowhere near full.
#   use_temp_path=off   write straight into the cache tree rather than
#                       staging through a temp dir and copying.
#
# Lives in the container's own filesystem, so it starts cold if the
# container is ever recreated. That's deliberate: it needs no volume and
# no TrueNAS config change to work, and a cache that rebuilds itself on
# demand is not worth persisting. docker-compose.yml mounts a volume here
# anyway where it's free to do so.
proxy_cache_path /var/cache/nginx/tmdb levels=1:2 keys_zone=tmdb:10m max_size=5g inactive=30d use_temp_path=off;

# Which scheme the *browser* used, which is not the one that reached this
# server. TLS is terminated at Cloudflare's edge and the tunnel hands us
# plain HTTP over the bridge network, so `$scheme` here is `http` for a
# request that was HTTPS the entire way to the person making it. The
# backend needs the browser's answer, not ours: it is what decides whether
# a session cookie is marked `Secure`, and a cookie marked Secure is never
# sent back over plain HTTP.
#
# That distinction is the whole reason this exists. The app is reachable
# two ways at once — https://<domain> through the tunnel and
# http://<nas>:8095 on the LAN — so there is no single right answer to
# "is there HTTPS in front of this", only a right answer per request. The
# setting that used to decide it globally could only ever be wrong for one
# of the two doors, and was: enabled, LAN sign-ins set a Secure cookie the
# browser immediately discarded, so signing in appeared to work and the
# very next request was a 401.
#
# Cloudflare sets X-Forwarded-Proto at its edge from the connection the
# browser actually made, and replaces any value a client sent, so it is
# trustworthy for tunnel traffic. A LAN client reaching :8095 directly
# sends none, and `default $scheme` answers `http` — correct, and the safe
# way to be wrong, since the failure mode of guessing `http` is a cookie
# without Secure rather than a session that cannot be kept.
#
# Known limit, deliberate: someone already on the LAN can send this header
# themselves and talk nginx into `https`. All that buys them is a Secure
# cookie their own plain-HTTP browser then refuses to send back — they
# lock themselves out and no one else is affected. It stops being
# self-limiting only if the backend ever gains a published port, which is
# the same invariant `_client_ip` in api.py depends on, for the same
# reason.
map $http_x_forwarded_proto $obsidian_client_proto {
    default   $scheme;
    https     https;
    http      http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Frontend migration Part G3 — whose address the allow/deny rules
    # below actually judge.
    #
    # Behind a Cloudflare Tunnel, every request from the internet arrives
    # here from `cloudflared`'s own address, and that address is a private
    # one on this compose network. Without this, the private-range `allow`
    # list in the `/api/(setup/|plex/link)` block below therefore matches
    # the entire internet, and the LAN restriction that block exists to
    # enforce — the one thing standing between a stranger and claiming the
    # admin identity — silently becomes a no-op the moment a tunnel is
    # pointed at this container. This is what keeps $remote_addr the real
    # client, so that block goes on denying what it was written to deny.
    #
    # Trusted narrowly, and twice over: only when the peer is inside the
    # Docker bridge range (Docker's own default address pools are
    # 172.17-172.31, all within this /12) and only when the header is
    # actually present. Cloudflare's edge sets CF-Connecting-IP on every
    # request it forwards and `cloudflared` passes it through, whereas a
    # LAN browser reaching this port directly sends no such header at all
    # and so keeps its own address. A LAN client could forge one, but it is
    # already inside the allow list — all forging buys it is being denied.
    #
    # The /12 is deliberately not widened to the other private ranges: it
    # covers `cloudflared` running as a service on this project's network
    # (truenas/custom-app-compose.yaml), which is the supported shape. Run
    # it anywhere else — its own TrueNAS app aimed at the published 8095,
    # say — and its address has to be added here, or the gate below is
    # back to being a no-op.
    #
    # ngx_http_realip_module is built into the nginx:alpine image the
    # Dockerfile starts from, so this needs no rebuild flag. It does need
    # the image rebuilt and this container recreated, though: nginx.conf is
    # COPYed in, not bind-mounted like dist/ is, and so is the one thing a
    # `git pull` + deploy genuinely cannot deliver.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Frontend migration Part G4 — baseline security headers. HSTS only
    # bites once a client has actually reached this over HTTPS (a plain-HTTP
    # LAN deployment just ignores it), so it's safe to send unconditionally
    # rather than gating it on remote_access_enabled.
    #
    # nginx gotcha: `add_header` is only inherited into a location block
    # that has no `add_header` of its own — a location setting even one
    # (several below do, for Cache-Control) silently drops every header
    # set here instead of adding to them. So every location below that
    # sets its own Cache-Control repeats this block explicitly.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Same-origin app, no third-party embeds — a tight default-src plus the
    # exact exceptions this app actually needs: inline styles for the
    # color-mix()/clamp() token system, the Google Fonts stylesheets
    # index.html links directly (Baloo 2/Inter/Material Symbols) and the
    # actual font files those stylesheets reference on fonts.gstatic.com,
    # TMDB poster images, and the app's own same-origin /api/ calls.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Frontend migration Part G1 — setup and the pre-setup Plex-link bootstrap
    # are the routes that let whoever reaches them first claim the admin
    # identity, so they're restricted to private-IP ranges unconditionally,
    # regardless of remote_access_enabled — this is enforced before the
    # request ever reaches the backend, not something the app can be tricked
    # out of. This regex location overrides the plain-prefix /api/ block
    # below for matching paths regardless of file order (nginx always prefers
    # a matching regex location over a prefix one, unless the prefix uses
    # ^~ or =, which /api/ does not) — no reordering of that block needed.
    #
    # Note on /api/plex/link specifically: this also blocks an already-linked
    # admin from switching Plex servers remotely, since nginx can't cheaply
    # tell "pre-setup bootstrap" apart from "post-setup admin action" without
    # meaningfully more complexity (Lua/njs/auth_request) than this
    # homelab-scale project warrants. Documented trade-off, not an oversight:
    # switching servers remotely requires being on the LAN (or over a VPN
    # that makes you appear as one), same as initial setup.
    # ...with one carve-out. GET /api/setup/status is the probe App.tsx
    # makes on every boot, before it can know whether to show the setup
    # wizard or the login screen — so it cannot be gated on being set up,
    # or on being signed in, or (this block's original mistake) on being
    # on the LAN. Blocked, the app renders ErrorState for every remote
    # visitor and never reaches the login screen at all: remote access
    # appears completely broken while every other route works fine.
    #
    # Safe to answer from anywhere because it is readable-only and says
    # nothing worth knowing: seven booleans plus a "env"/"db" source
    # string, no secret values, by the endpoint's own deliberate design.
    # What it does tell an unauthenticated caller is whether this instance
    # has been set up — and an unset-up one is claimable. That claim still
    # cannot happen from here: the routes that perform it (the setup PUTs,
    # and POST /api/plex/link) stay behind the block below. In practice
    # remote access gets turned on after setup, so the answer is already
    # `true` by the time anyone outside can ask.
    #
    # `=` is load-bearing: an exact-match location beats every regex
    # location outright in nginx's precedence rules, so this wins over the
    # block below without depending on file order — the same way that
    # block wins over the plain /api/ prefix one.
    location = /api/setup/status {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $obsidian_client_proto;
        proxy_read_timeout 70s;
    }

    location ~ ^/api/(setup/|plex/link$) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $obsidian_client_proto;
        proxy_read_timeout 70s;
    }

    # Same-origin only (confirmed architecture): this is the app's one
    # published port. No CORS headers anywhere — the browser never talks
    # to the backend container directly.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $obsidian_client_proto;
        # Search jobs can run close to a 55s ceiling server-side; give the
        # proxy room so nginx doesn't cut a slow /api/requests poll short.
        proxy_read_timeout 70s;
    }

    # Every TMDB image the app shows — posters, backdrops, title logos,
    # episode stills, cast photos — comes through here instead of each
    # browser fetching it from image.tmdb.org itself. A cold home page is
    # 60-100 of these and several megabytes; served from here they come
    # off local disk at LAN speed, and the household shares one upstream
    # fetch rather than making one apiece. It also means img-src in the
    # CSP above is now just 'self', and lib/palette.ts samples a
    # same-origin image rather than relying on TMDB's CORS headers to
    # keep its canvas untainted.
    #
    # `^~` is load-bearing: without it the `\.(png|ico|json)$` regex block
    # below would win for every .png title logo, because nginx prefers a
    # matching regex location over a plain prefix one — the same
    # precedence rule the /api/setup/ block above relies on to override
    # /api/. With `^~` the prefix wins outright and no reordering matters.
    location ^~ /img/ {
        # A TMDB image path is immutable — /t/p/w342/<hash>.jpg is always
        # the same bytes — so cache hard and don't revalidate. Serving
        # stale on an upstream error is the difference between a slightly
        # old poster and a page of grey boxes whenever TMDB has a bad day.
        proxy_cache tmdb;
        proxy_cache_valid 200 301 302 30d;
        # A miss is usually a genuinely absent image, but not always worth
        # a month of remembering it.
        proxy_cache_valid 404 1h;
        # One upstream fetch per image rather than one per browser that
        # happened to ask while it was in flight — which on a cold home
        # page, with the whole household opening it at once, is the
        # difference between 60 requests to TMDB and 600.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # The path alone identifies the bytes, so that is the whole key.
        # That is only safe if there really is one variant per path, which
        # is what dropping Accept-Encoding upstream guarantees: JPEGs and
        # PNGs are already compressed, so an encoding negotiation buys
        # nothing and would otherwise let a `Vary: Accept-Encoding` either
        # fragment this cache across every browser's header spelling or,
        # ignored, hand someone a variant they can't read.
        proxy_set_header Accept-Encoding "";
        proxy_cache_key "$uri";
        proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;

        # /img/w342/abc.jpg -> https://image.tmdb.org/t/p/w342/abc.jpg.
        # Resolved per-request through Docker's embedded DNS rather than
        # pinned at config load: image.tmdb.org is behind a CDN whose
        # addresses move, and a container that has been up for weeks
        # shouldn't still be dialling whatever it saw when it booted.
        # Putting the host in a variable is what forces that re-resolution
        # — with a literal, nginx resolves once at startup and keeps it.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tmdb_origin image.tmdb.org;
        rewrite ^/img/(.*)$ /t/p/$1 break;
        proxy_pass https://$tmdb_origin;
        proxy_set_header Host image.tmdb.org;
        # /img/ is same-origin now, so the browser attaches this app's
        # session cookie to every poster request. Without this line nginx
        # would forward it straight to TMDB. Nothing upstream has any
        # business seeing it, and nothing upstream has any business
        # setting cookies on this origin either.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # Real certificate verification on the upstream hop, not nginx's
        # default of trusting whatever answers. SNI is required regardless
        # — the CDN serves nothing without it.
        proxy_ssl_server_name on;
        proxy_ssl_name image.tmdb.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;

        # A month in the browser too, so a warm client doesn't even ask.
        # TMDB sends its own Cache-Control and add_header does not replace
        # it — without hiding it first the response carries two of them,
        # which is at best ambiguous and at worst read as the wrong one.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Which is worth being able to confirm: HIT, MISS, EXPIRED, STALE.
        # `always`, unlike the Cache-Control above, so it is still there
        # on a 404 or a 502 — the responses you most want to diagnose are
        # exactly the ones a bare add_header silently drops.
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Trailer files, sent by nginx on the backend's behalf.
    #
    # `internal` is the whole safety of this: nothing outside can request
    # this path, only an X-Accel-Redirect from a backend response can
    # reach it. So /api/trailers/<file> still goes to the app, still
    # passes the session gate and the filename whitelist there, and only
    # a request that got through both ends up here — at which point
    # nginx sends the file instead of uvicorn streaming it through
    # Python while also trying to answer the API. Range requests, which
    # a <video> leans on heavily, are handled properly for free.
    #
    # Read-only mount of the backend's own data volume; the app writes
    # these, this only ever reads them.
    location /internal-trailers/ {
        internal;
        alias /srv/backend-data/trailers/;
        add_header Cache-Control "private, max-age=86400";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # The one HTML file: never let Safari's "Add to Home Screen" standalone
    # mode keep serving a stale version after a `git pull` deploy (Stage 4's
    # open decision, resolved here) — always revalidate.
    location = / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Vite's own hashed build output (frontend migration Part B) —
    # index-<contenthash>.js/.css under dist/assets/. The hash changes
    # whenever the content does, so a stale cached copy is never actually
    # served under a URL that now means something different — safe to
    # cache as hard as browsers allow.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Manifest/icons change only when the app itself is redesigned — a
    # short cache is fine and doesn't risk misleading job-status staleness.
    location ~* \.(?:png|ico|json)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Defense in depth against ever accidentally serving source files —
    # dist/ (this root, once the bind mount targets frontend/dist per
    # Part B) never actually contains a dotfile at all, so this shouldn't
    # ever fire in practice, but a generic "deny every dotfile" rule costs
    # nothing and doesn't depend on that staying true (e.g. a bind mount
    # that ever got repointed back at frontend/ itself, which does hold
    # .git/.env, wouldn't silently lose this protection the way the old
    # rule — scoped to exactly "Dockerfile" and "nginx.conf" by name —
    # would have).
    location ~ /\. {
        deny all;
        return 404;
    }
}
