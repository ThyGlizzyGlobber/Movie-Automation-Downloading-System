server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin only (confirmed architecture): this is the app's one
    # published port. No CORS headers anywhere — the browser never talks
    # to the backend container directly.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Search jobs can run close to a 55s ceiling server-side; give the
        # proxy room so nginx doesn't cut a slow /api/requests poll short.
        proxy_read_timeout 70s;
    }

    # The one HTML file: never let Safari's "Add to Home Screen" standalone
    # mode keep serving a stale version after a `git pull` deploy (Stage 4's
    # open decision, resolved here) — always revalidate.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Manifest/icons change only when the app itself is redesigned — a
    # short cache is fine and doesn't risk misleading job-status staleness.
    location ~* \.(?:png|ico|json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Stage 5's TrueNAS Custom App bind-mounts the whole frontend/ source
    # directory as html root (a directory-level mount, unlike a per-file
    # mount, keeps working after `git pull` replaces a file via rename —
    # see the Stage 5 decision log). That directory also holds this repo's
    # own Dockerfile/nginx.conf; never serve them.
    location ~* /(Dockerfile|nginx\.conf)$ {
        deny all;
        return 404;
    }
}
